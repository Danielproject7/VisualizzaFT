                  <div className="font-medium">{e.supplier || '—'}</div>
                  <div style={{color:'var(--ink-3)'}}>{e.supplierVat || ''}</div>
                </td>
                <td className="num text-right text-xs">{typeof e.xmlValue === 'number' ? fmtMoney(e.xmlValue) : (e.xmlValue || '—')}</td>
                <td className="num text-right text-xs">{typeof e.registerValue === 'number' ? fmtMoney(e.registerValue) : (e.registerValue || '—')}</td>
                <td className="num text-right text-xs" style={{color: typeof e.difference === 'number' && Math.abs(e.difference) > 0.01 ? 'var(--err)' : 'inherit'}}>
                  {typeof e.difference === 'number' ? fmtMoney(e.difference) : '—'}
                </td>
                <td className="text-xs" style={{maxWidth:280}}>
                  <div>{e.description}</div>
                  {e.suggestedAction && <div className="italic mt-1" style={{color:'var(--ink-3)'}}>→ {e.suggestedAction}</div>}
                </td>
                <td className="text-xs" style={{minWidth:160}}>
                  <input className="input text-xs" placeholder="Annotazione…"
                         defaultValue={e.userNote}
                         onBlur={ev => updateItem(e.id, { userNote: ev.target.value })}/>
                </td>
                <td>
                  <select className="input text-xs" value={e.status}
                          onChange={ev => updateItem(e.id, { status: ev.target.value })}>
                    <option value="open">Aperto</option>
                    <option value="in-progress">In lavorazione</option>
                    <option value="resolved">Risolto</option>
                  </select>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

/* =========================================================================
   PDF — Estrazione allegato o generazione, navigazione e bulk export
========================================================================= */
const base64ToBlob = (b64, mime) => {
  try {
    const clean = (b64 || '').replace(/\s+/g, '');
    const byteChars = atob(clean);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    return new Blob([bytes], { type: mime || 'application/pdf' });
  } catch (e) {
    console.error('base64ToBlob failed', e);
    return null;
  }
};

const findEmbeddedPdf = (inv) => {
  if (!inv || !inv.allegati || !inv.allegati.length) return null;
  return inv.allegati.find(a =>
    (a.formato || '').toLowerCase().includes('pdf') ||
    (a.nomeAttachment || '').toLowerCase().endsWith('.pdf')
  ) || null;
};

const generatePdfFromInvoice = (inv) => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14;
  let y = M;

  const ensurePage = (need) => {
    if (y + need > H - M - 6) { doc.addPage(); y = M; }
  };

  // Header band
  doc.setFillColor(27, 24, 20);
  doc.rect(0, 0, W, 8, 'F');
  doc.setFillColor(247, 244, 237);
  doc.rect(0, 8, W, 22, 'F');

  doc.setTextColor(181, 70, 46);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
  doc.text('FATTURA ELETTRONICA', M, 16);

  doc.setTextColor(27, 24, 20);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(`${tipoDocLabel(inv.tipoDocumento)}`, M, 23);

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.setTextColor(90, 84, 76);
  const right = (txt, yy) => doc.text(txt, W - M, yy, { align: 'right' });
  right(`N. ${inv.numeroDocumento || inv.numero || '—'}`, 16);
  right(`${fmtDate(inv.dataDocumento || inv.data) || '—'}`, 21);
  right(`${inv.divisa || 'EUR'}`, 26);

  y = 38;

  // Cedente / Cessionario boxes
  const boxW = (W - M*2 - 4) / 2;
  doc.setDrawColor(228, 220, 204);
  doc.setLineWidth(0.3);

  const drawParty = (x, label, party) => {
    doc.setFillColor(252, 250, 245);
    doc.rect(x, y, boxW, 32, 'F');
    doc.rect(x, y, boxW, 32, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(7);
    doc.setTextColor(176, 138, 62);
    doc.text(label.toUpperCase(), x+3, y+4.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.setTextColor(27,24,20);
    const name = party.denominazione || `${party.nome||''} ${party.cognome||''}`.trim() || '—';
    doc.text(doc.splitTextToSize(name, boxW-6), x+3, y+10);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(90,84,76);
    let yy = y + 16;
    if (party.partitaIva) { doc.text(`P.IVA: ${party.partitaIva}`, x+3, yy); yy += 4; }
    if (party.codiceFiscale && party.codiceFiscale !== party.partitaIva) { doc.text(`CF: ${party.codiceFiscale}`, x+3, yy); yy += 4; }
    if (party.indirizzo) {
      const sede = `${party.indirizzo||''}${party.numeroCivico?' '+party.numeroCivico:''}, ${party.cap||''} ${party.comune||''} ${party.provincia?'('+party.provincia+')':''}`;
      doc.text(doc.splitTextToSize(sede, boxW-6), x+3, yy);
    }
  };
  drawParty(M, 'Cedente / Prestatore', inv.cedente || {});
  drawParty(M + boxW + 4, 'Cessionario / Committente', inv.cessionario || {});
  y += 36;

  // Causale (parser stores it as a string with " | " separator)
  const causaleStr = Array.isArray(inv.causale) ? inv.causale.join(' · ') : (inv.causale || '');
  if (causaleStr) {
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.setTextColor(176, 138, 62);
    doc.text('CAUSALE', M, y); y += 4;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(27,24,20);
    const lines = doc.splitTextToSize(causaleStr, W - M*2);
    doc.text(lines, M, y);
    y += lines.length * 4 + 3;
  }

  // Lines table — dynamic row height to accommodate wrapped descriptions
  if (inv.lines && inv.lines.length) {
    ensurePage(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.setTextColor(176,138,62);
    doc.text('DETTAGLIO LINEE', M, y); y += 4;

    const cols = [
      { k:'numeroLinea', label:'#', w:8, align:'right' },
      { k:'descrizione', label:'Descrizione', w:78, align:'left' },
      { k:'quantita', label:'Q.tà', w:14, align:'right', fmt: v => v != null ? fmtNum(v,2) : '' },
      { k:'prezzoUnitario', label:'Prezzo un.', w:22, align:'right', fmt: v => v != null ? fmtMoney(v) : '' },
      { k:'aliquotaIVA', label:'IVA%', w:12, align:'right', fmt: v => v != null ? fmtNum(v,1) : '' },
      { k:'natura', label:'Nat.', w:12, align:'left' },
      { k:'prezzoTotale', label:'Totale', w:26, align:'right', fmt: v => v != null ? fmtMoney(v) : '' },
    ];
    const lineH = 3.4;   // height per text line (mm) at 7.5pt
    const padV = 1.2;    // top/bottom padding in each row

    const drawHeader = () => {
      doc.setFillColor(27, 24, 20);
      doc.rect(M, y, W - M*2, 6, 'F');
      doc.setTextColor(247, 244, 237);
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      let xx = M;
      cols.forEach(c => {
        const tx = c.align === 'right' ? xx + c.w - 1.5 : xx + 1.5;
        doc.text(c.label, tx, y + 4, { align: c.align });
        xx += c.w;
      });
      y += 6;
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.setTextColor(27,24,20);
    };

    drawHeader();

    inv.lines.forEach((ln, i) => {
      // Pre-compute wrapped text per cell so we know the row height up-front
      const cellLines = cols.map(c => {
        let val = ln[c.k];
        if (c.fmt) val = c.fmt(val);
        val = val == null ? '' : String(val);
        return doc.splitTextToSize(val, c.w - 3);
      });
      const maxLines = Math.max(1, ...cellLines.map(a => a.length));
      const rowH = padV * 2 + maxLines * lineH;

      // Page break if row doesn't fit
      if (y + rowH > H - M - 6) {
        doc.addPage(); y = M;
        drawHeader();
      }

      // Zebra background sized to actual row height
      if (i % 2 === 0) {
        doc.setFillColor(252, 250, 245);
        doc.rect(M, y, W - M*2, rowH, 'F');
      }

      let xc = M;
      cols.forEach((c, ci) => {
        const tx = c.align === 'right' ? xc + c.w - 1.5 : xc + 1.5;
        doc.text(cellLines[ci], tx, y + padV + lineH - 0.6, { align: c.align });
        xc += c.w;
      });
      y += rowH;
    });
    y += 3;
  }

  // Summaries
  if (inv.summaries && inv.summaries.length) {
    ensurePage(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.setTextColor(176,138,62);
    doc.text('RIEPILOGO IVA', M, y); y += 4;
    doc.setFillColor(27,24,20);
    doc.rect(M, y, W - M*2, 6, 'F');
    doc.setTextColor(247,244,237);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.text('Aliq.', M+3, y+4);
    doc.text('Natura', M+22, y+4);
    doc.text('Imponibile', M+90, y+4, { align:'right' });
    doc.text('Imposta', M+130, y+4, { align:'right' });
    doc.text('Esigibilità', M+170, y+4, { align:'right' });
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor(27,24,20);
    inv.summaries.forEach((s,i) => {
      ensurePage(5);
      if (i % 2 === 0) { doc.setFillColor(252,250,245); doc.rect(M, y, W-M*2, 5, 'F'); }
      doc.text(`${fmtNum(s.aliquotaIVA||0,2)}%`, M+3, y+3.5);
      doc.text(s.natura || '—', M+22, y+3.5);
      doc.text(fmtMoney(s.imponibile), M+90, y+3.5, { align:'right' });
      doc.text(fmtMoney(s.imposta), M+130, y+3.5, { align:'right' });
      doc.text(s.esigibilita || '—', M+170, y+3.5, { align:'right' });
      y += 5;
    });
    y += 3;
  }

  // Total
  ensurePage(14);
  doc.setFillColor(181, 70, 46);
  doc.rect(W - M - 80, y, 80, 10, 'F');
  doc.setTextColor(247,244,237);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('TOTALE DOCUMENTO', W - M - 78, y+4);
  doc.setFontSize(13);
  doc.text(fmtMoney(inv.totaleDocumento || 0), W - M - 2, y+7, { align:'right' });
  y += 14;

  // Footer (last page only)
  doc.setTextColor(150, 145, 136);
  doc.setFont('helvetica','italic'); doc.setFontSize(6.5);
  doc.text(`Documento generato — file XML di origine: ${inv.sourceFileName || '—'}  ·  ID interno: ${inv.id || ''}`, M, H - 7);

  return doc.output('blob');
};

const PdfSection = ({ invoices, target, setTarget }) => {
  const [pdfUrl, setPdfUrl] = useState(null);
  const [pdfSource, setPdfSource] = useState(null); // 'embedded' | 'generated'
  const [busy, setBusy] = useState(false);
  const [bulkProgress, setBulkProgress] = useState(null);
  const urlRef = useRef(null);

  const current = target || (invoices.length ? invoices[0] : null);
  const idx = current ? invoices.findIndex(i => i.id === current.id) : -1;

  useEffect(() => {
    if (!current) return;
    if (urlRef.current) { URL.revokeObjectURL(urlRef.current); urlRef.current = null; }
    setPdfUrl(null);
    setBusy(true);
    setTimeout(() => {
      try {
        const att = findEmbeddedPdf(current);
        let blob = null;
        if (att && att.attachment) {
          blob = base64ToBlob(att.attachment, 'application/pdf');
          if (blob) { setPdfSource('embedded'); }
        }
        if (!blob) {
          blob = generatePdfFromInvoice(current);
          setPdfSource('generated');
        }
        const url = URL.createObjectURL(blob);
        urlRef.current = url;
        setPdfUrl(url);
      } catch (e) {
        console.error(e);
      } finally {
        setBusy(false);
      }
    }, 30);
  }, [current && current.id]);

  useEffect(() => () => { if (urlRef.current) URL.revokeObjectURL(urlRef.current); }, []);

  const navigate = (delta) => {
    if (!invoices.length) return;
    const ni = ((idx + delta) % invoices.length + invoices.length) % invoices.length;
    setTarget(invoices[ni]);
  };

  const downloadCurrent = () => {
    if (!current || !pdfUrl) return;
    const a = document.createElement('a');
    a.href = pdfUrl;
    const safe = (s) => (s || '').toString().replace(/[^\w\-]+/g, '_').slice(0, 60);
    const supplier = safe(current.cedente && (current.cedente.denominazione || `${current.cedente.nome||''}_${current.cedente.cognome||''}`));
    const num = safe(current.numero);
    a.download = `${supplier || 'fattura'}_${num || 'doc'}.pdf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  const exportAllZip = async () => {
    if (!invoices.length) return;
    setBulkProgress({ done: 0, total: invoices.length, current: '' });
    const zip = new JSZip();
    const safe = (s) => (s || '').toString().replace(/[^\w\-]+/g, '_').slice(0, 60);
    for (let i = 0; i < invoices.length; i++) {
      const inv = invoices[i];
      setBulkProgress({ done: i, total: invoices.length, current: inv.sourceFileName });
      try {
        const att = findEmbeddedPdf(inv);
        let blob = null;
        if (att && att.attachment) blob = base64ToBlob(att.attachment, 'application/pdf');
        if (!blob) blob = generatePdfFromInvoice(inv);
        const supplier = safe(inv.cedente && (inv.cedente.denominazione || `${inv.cedente.nome||''}_${inv.cedente.cognome||''}`));
        const num = safe(inv.numero);
        const date = (inv.data || '').replace(/-/g,'');
        const folder = supplier || 'sconosciuto';
        const fname = `${date}_${num || 'doc'}.pdf`;
        zip.folder(folder).file(fname, blob);
      } catch (e) {
        console.error('PDF zip err', inv.id, e);
      }
      // yield to UI
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }
    setBulkProgress({ done: invoices.length, total: invoices.length, current: 'Compressione…' });
    const out = await zip.generateAsync({ type:'blob' }, (m) => {
      setBulkProgress({ done: invoices.length, total: invoices.length, current: `Compressione ${Math.round(m.percent)}%` });
    });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url; a.download = `fatture_pdf_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setTimeout(() => setBulkProgress(null), 1500);
  };

  if (!invoices.length) {
    return (
      <div className="grid-12">
        <div className="col-span-12">
          <h2 className="serif text-3xl mb-1">Anteprima PDF</h2>
          <p className="text-sm" style={{color:'var(--ink-3)'}}>Nessuna fattura caricata. Importa file XML dalla sezione Caricamento.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="grid-12">
      <div className="col-span-12 flex items-end justify-between gap-4 flex-wrap">
        <div>
          <h2 className="serif text-3xl mb-1">Anteprima PDF</h2>
          <p className="text-sm" style={{color:'var(--ink-3)'}}>
            {pdfSource === 'embedded' && <span><span className="badge b-ok">PDF allegato</span> estratto da &lt;Allegati&gt; nell'XML</span>}
            {pdfSource === 'generated' && <span><span className="badge b-info">PDF generato</span> dai dati della fattura (nessun allegato presente)</span>}
            {!pdfSource && <span>Caricamento…</span>}
          </p>
        </div>
        <div className="flex gap-2 items-center flex-wrap">
          <button className="btn" onClick={()=>navigate(-1)} disabled={invoices.length<2}>
            <Icon name="chev-right" size={14} style={{transform:'rotate(180deg)'}}/> Precedente
          </button>
          <span className="text-sm font-mono" style={{color:'var(--ink-3)'}}>{idx+1} / {invoices.length}</span>
          <button className="btn" onClick={()=>navigate(1)} disabled={invoices.length<2}>
            Successivo <Icon name="chev-right" size={14}/>
          </button>
          <button className="btn primary" onClick={downloadCurrent} disabled={!pdfUrl}>
            <Icon name="download" size={14}/> Scarica PDF
          </button>
          <button className="btn" onClick={exportAllZip} disabled={!!bulkProgress}>
            <Icon name="archive" size={14}/> Esporta tutti (ZIP)
          </button>
        </div>
      </div>

      {bulkProgress && (
        <div className="col-span-12 card p-4">
          <div className="flex justify-between mb-2 text-xs">
            <span>Generazione PDF in corso… {bulkProgress.current}</span>
            <span className="num">{bulkProgress.done} / {bulkProgress.total}</span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{background:'var(--bg-3)'}}>
            <div className="h-full" style={{
              width: `${(bulkProgress.done/Math.max(1,bulkProgress.total))*100}%`,
              background:'linear-gradient(90deg, var(--accent), var(--gold))',
              transition:'width 0.2s'
            }}/>
          </div>
        </div>
      )}

      {current && (
        <div className="col-span-4 card p-4">
          <div className="label mb-2">Documento corrente</div>
          <div className="serif text-xl mb-1">{tipoDocLabel(current.tipoDocumento)}</div>
          <div className="text-sm font-mono mb-3" style={{color:'var(--ink-3)'}}>
            N. {current.numero || '—'} · {fmtDate(current.data) || '—'}
          </div>
          <div className="text-xs uppercase tracking-wider mb-1" style={{color:'var(--gold)'}}>Cedente</div>
          <div className="text-sm mb-3">
            {current.cedente ? (current.cedente.denominazione || `${current.cedente.nome||''} ${current.cedente.cognome||''}`.trim()) : '—'}
            <div className="font-mono text-xs" style={{color:'var(--ink-3)'}}>{current.cedente && current.cedente.partitaIva}</div>
          </div>
          <div className="text-xs uppercase tracking-wider mb-1" style={{color:'var(--gold)'}}>Cessionario</div>
          <div className="text-sm mb-3">
            {current.cessionario ? (current.cessionario.denominazione || `${current.cessionario.nome||''} ${current.cessionario.cognome||''}`.trim()) : '—'}
            <div className="font-mono text-xs" style={{color:'var(--ink-3)'}}>{current.cessionario && current.cessionario.partitaIva}</div>
          </div>
          <div className="border-t pt-3 mt-3" style={{borderColor:'var(--line)'}}>
            <div className="flex justify-between text-xs mb-1">
              <span style={{color:'var(--ink-3)'}}>Imponibile</span>
              <span className="num">{fmtMoney(current.totals && current.totals.totaleImponibile)}</span>
            </div>
            <div className="flex justify-between text-xs mb-1">
              <span style={{color:'var(--ink-3)'}}>Imposta</span>
              <span className="num">{fmtMoney(current.totals && current.totals.totaleImposta)}</span>
            </div>
            <div className="flex justify-between mt-2 pt-2 border-t" style={{borderColor:'var(--line)'}}>
              <span className="font-medium">Totale</span>
              <span className="num font-bold" style={{color:'var(--accent)'}}>{fmtMoney(current.importoTotaleDocumento || (current.totals && current.totals.totaleDocumento))}</span>
            </div>
          </div>
          <div className="mt-3 pt-3 border-t" style={{borderColor:'var(--line)'}}>
            <div className="label mb-1">File XML di origine</div>
            <div className="text-xs font-mono break-all" style={{color:'var(--ink-3)'}}>{current.sourceFileName}</div>
            {current.allegati && current.allegati.length > 0 && (
              <div className="mt-2">
                <div className="label mb-1">Allegati ({current.allegati.length})</div>
                {current.allegati.map((a,i) => (
                  <div key={i} className="text-xs" style={{color:'var(--ink-3)'}}>
                    · {a.nomeAttachment || '(senza nome)'} <span className="badge b-mute">{a.formato || '?'}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      <div className="col-span-8 card p-0 overflow-hidden" style={{minHeight:680}}>
        {busy && (
          <div className="flex items-center justify-center h-[680px]">
            <div className="text-center">
              <div className="serif text-xl mb-2" style={{color:'var(--accent)'}}>Preparazione anteprima…</div>
              <div className="text-xs" style={{color:'var(--ink-3)'}}>Estrazione allegato o generazione PDF</div>
            </div>
          </div>
        )}
        {!busy && pdfUrl && (
          <iframe src={pdfUrl} title="Anteprima fattura" style={{width:'100%', height:'82vh', minHeight:680, border:'none', background:'#525659'}}/>
        )}
        {!busy && !pdfUrl && (
          <div className="flex items-center justify-center h-[680px]">
            <div className="text-center">
              <Icon name="alert" size={48}/>
              <div className="serif text-xl mt-3 mb-2">Anteprima non disponibile</div>
              <div className="text-xs" style={{color:'var(--ink-3)'}}>Si è verificato un errore nella generazione del PDF.</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* =========================================================================
   MOUNT
========================================================================= */
try {
  var rootEl = document.getElementById('root');
  // remove fallback
  var fb = document.getElementById('boot-fallback');
  if (fb) fb.remove();
  const root = ReactDOM.createRoot(rootEl);
  root.render(<App />);
} catch (err) {
  console.error(err);
  document.body.innerHTML =
    '<div style="padding:40px;font-family:monospace;background:#F7F4ED;color:#A8362A;">'+
    '<h2 style="font-family:Georgia,serif;color:#1B1814;">Errore di avvio dell\'applicazione</h2>'+
    '<pre style="background:#fff;padding:14px;border-left:3px solid #A8362A;white-space:pre-wrap;font-size:12px;">'+
    (err && err.stack ? err.stack : String(err)) +
    '</pre></div>';
}

</script>
</body>
</html>
