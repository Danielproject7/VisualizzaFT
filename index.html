/* =========================================================================
   REGISTRI IVA — Excel import + flexible column mapping
========================================================================= */
const REGISTER_FIELDS = [
  { id:'registrationDate', label:'Data registrazione', kind:'date', hints:['data reg','data registrazione','data prot','protocollazione'] },
  { id:'documentDate', label:'Data documento', kind:'date', hints:['data doc','data fattura','data documento'] },
  { id:'documentNumber', label:'Numero documento', kind:'text', hints:['n. doc','numero doc','numero fattura','num doc','n.fattura','nr doc','nr fattura'] },
  { id:'protocolNumber', label:'Protocollo IVA', kind:'text', hints:['protocollo','prot','prot.','protocol','prot. iva'] },
  { id:'supplierOrCustomer', label:'Fornitore / Cliente', kind:'text', hints:['fornitore','cliente','denominazione','ragione sociale','soggetto'] },
  { id:'vatNumber', label:'Partita IVA', kind:'text', hints:['p.iva','piva','partita iva','vat'] },
  { id:'fiscalCode', label:'Codice fiscale', kind:'text', hints:['cf','c.f.','codice fiscale'] },
  { id:'taxableAmount', label:'Imponibile', kind:'money', hints:['imponibile','base imponibile','imp.'] },
  { id:'vatAmount', label:'Imposta IVA', kind:'money', hints:['iva','imposta','imp.iva','vat amount'] },
  { id:'vatRate', label:'Aliquota IVA', kind:'pct', hints:['aliquota','% iva','aliq','aliquota iva'] },
  { id:'natureCode', label:'Codice natura', kind:'text', hints:['natura','codice natura'] },
  { id:'vatArticle', label:'Articolo IVA', kind:'text', hints:['articolo','articolo iva','art iva','art.iva','codice iva'] },
  { id:'vatArticleDescription', label:'Descrizione articolo IVA', kind:'text', hints:['descrizione iva','descrizione articolo','desc iva'] },
  { id:'documentTotal', label:'Totale documento', kind:'money', hints:['totale','totale doc','totale documento','importo totale'] },
  { id:'accountingAccount', label:'Conto contabile', kind:'text', hints:['conto','conto co','conto co.ge','mastro','sottoconto'] },
  { id:'accountingDescription', label:'Causale contabile', kind:'text', hints:['causale','descrizione causale','causale co'] },
];

const guessMapping = (headers) => {
  const map = {};
  REGISTER_FIELDS.forEach(field => {
    const found = headers.findIndex(h => {
      const norm = String(h||'').toLowerCase().replace(/[._-]/g,' ').replace(/\s+/g,' ').trim();
      return field.hints.some(hint => norm.includes(hint));
    });
    map[field.id] = found >= 0 ? headers[found] : '';
  });
  return map;
};

/* =========================================================================
   REGISTRI IVA — Import multi-file con auto-rilevamento formato
   - "detailed":  registro per documento (formato classico, mapping flessibile)
   - "summary":   registro riassuntivo per periodo/sezionale/codice IVA
========================================================================= */
const RegistriSection = ({ vatRegister, setVatRegister }) => {
  const [step, setStep] = useState(vatRegister.files.length > 0 ? 'preview' : 'upload');
  const [stagedFile, setStagedFile] = useState(null); // file in fase di import (per detailed: con mapping; per summary: già parsato)
  const [mapping, setMapping] = useState({});
  const [tab, setTab] = useState('files'); // files | detailed | summary | codes
  const [periodFilter, setPeriodFilter] = useState('');
  const [sezioneFilter, setSezioneFilter] = useState('');
  const [showCodeEditor, setShowCodeEditor] = useState(false);
  const fileRef = useRef();
  const fileMultiRef = useRef();

  // Auto-jump tab after import
  useEffect(() => {
    if (vatRegister.summaryRows.length > 0 && vatRegister.rows.length === 0) setTab('summary');
    else if (vatRegister.rows.length > 0 && vatRegister.summaryRows.length === 0) setTab('detailed');
  }, [vatRegister.summaryRows.length, vatRegister.rows.length]);

  /* ---- FILE PARSING ---- */
  const parseExcelFile = async (file) => {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheetName = wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const rawSheet = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
    const json = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if (json.length === 0) throw new Error('Foglio vuoto');
    // Find header row (first row with at least 3 non-empty cells)
    let headerRowIdx = 0;
    for (let i = 0; i < Math.min(10, json.length); i++) {
      const nonEmpty = json[i].filter(c => c !== '' && c != null).length;
      if (nonEmpty >= 3) { headerRowIdx = i; break; }
    }
    const headers = json[headerRowIdx].map(h => String(h||'').trim());
    const rows = json.slice(headerRowIdx+1)
      .filter(r => r.some(c => c !== '' && c != null))
      .map(r => {
        const obj = {};
        headers.forEach((h, i) => { if (h) obj[h] = r[i]; });
        return obj;
      });
    return { headers, rows, rawSheet, fileName: file.name, sheetName, sheets: wb.SheetNames };
  };

  const importJasperFile = (raw) => {
    const parsed = parseJasperVatSheet(raw.rawSheet, raw.fileName);
    const fileId = uid();
    const newRows = parsed.rows.map(r => ({ ...r, sourceFileId: fileId }));
    const periods = parsed.periodFromTo ? [parsed.periodFromTo] : [];
    const fileEntry = {
      id: fileId,
      fileName: raw.fileName,
      format: 'detailed',
      formatVariant: 'jasper',
      registerType: parsed.registerType,
      company: parsed.companyName,
      sezionale: parsed.sezionale,
      rowCount: newRows.length,
      docCount: parsed.docCount,
      periods,
      importedAt: new Date().toISOString(),
    };
    setVatRegister(prev => ({
      ...prev,
      files: [...prev.files, fileEntry],
      rows: [...prev.rows, ...newRows],
      fileName: prev.fileName || raw.fileName,
    }));
    setStep('preview');
    setTab('detailed');
  };

  /* ---- SUMMARY FORMAT IMPORT (auto, no mapping needed) ---- */
  const parseSummaryRows = (raw, fileId, fileName) => {
    // Trova le colonne corrette (case-insensitive, normalizzato)
    const findCol = (...keys) => {
      for (const k of keys) {
        const norm = k.toLowerCase().replace(/[._\s-]+/g,'');
        const found = raw.headers.find(h => String(h||'').toLowerCase().replace(/[._\s-]+/g,'').includes(norm));
        if (found) return found;
      }
      return null;
    };
    const cols = {
      periodo:  findCol('periodo'),
      sez:      findCol('sez'),
      descSez:  findCol('descrizionesezionale','descsez'),
      tipoReg:  findCol('tiporeg'),
      aliqIva:  findCol('aliqiva'),
      descIva:  findCol('descrizione'),
      tipoIva:  findCol('tipologiaiva'),
      descTipo: findCol('descr'),
      imponibile: findCol('imponibile'),
      imposta:  findCol('imposta'),
      indetr:   findCol('impostanondetraibile','nondetraibile','indetraibile'),
    };
    const rows = raw.rows.map((r, idx) => ({
      id: uid(),
      sourceFileId: fileId,
      sourceFileName: fileName,
      rowNumber: idx + 1,
      periodoRaw: cols.periodo ? String(r[cols.periodo]||'').trim() : '',
      periodo: parsePeriodo(r[cols.periodo]),
      sezione: cols.sez ? String(r[cols.sez]||'').trim() : '',
      descSezione: cols.descSez ? String(r[cols.descSez]||'').trim() : '',
      tipoReg: cols.tipoReg ? safeNum(r[cols.tipoReg]) : null,
      aliqIvaCode: cols.aliqIva ? String(r[cols.aliqIva]||'').trim() : '',
      aliqIvaDesc: cols.descIva ? String(r[cols.descIva]||'').trim() : '',
      tipologiaIva: cols.tipoIva ? String(r[cols.tipoIva]||'').trim() : '',
      tipologiaIvaDesc: cols.descTipo ? String(r[cols.descTipo]||'').trim() : '',
      imponibile: cols.imponibile ? safeNum(r[cols.imponibile]) : 0,
      imposta:    cols.imposta    ? safeNum(r[cols.imposta])    : 0,
      indetraibile: cols.indetr   ? safeNum(r[cols.indetr])     : 0,
    }));
    return rows;
  };

  /* ---- UPLOAD HANDLERS ---- */
  const onSingleFile = async (file) => {
    if (!file) return;
    try {
      const raw = await parseExcelFile(file);
      // 1) Try the JasperReports register layout (auto, no mapping needed)
      if (detectJasperVatFormat(raw.rawSheet)) {
        importJasperFile(raw);
        return;
      }
      // 2) Existing summary / detailed flow
      const format = detectRegisterFormat(raw.headers);
      if (format === 'summary') {
        // Auto-import: niente mapping da fare
        importSummaryFile(raw);
      } else {
        // Apri il wizard di mapping per il formato detailed
        setStagedFile({ ...raw, format: 'detailed' });
        setMapping(guessMapping(raw.headers));
        setStep('mapping');
      }
    } catch (e) {
      alert('Errore lettura file: ' + e.message);
    }
  };

  const onMultiFiles = async (files) => {
    if (!files || files.length === 0) return;
    let imported = 0, errors = [];
    for (const f of files) {
      try {
        const raw = await parseExcelFile(f);
        if (detectJasperVatFormat(raw.rawSheet)) {
          importJasperFile(raw);
          imported++;
          continue;
        }
        const format = detectRegisterFormat(raw.headers);
        if (format === 'summary') {
          importSummaryFile(raw);
          imported++;
        } else {
          errors.push(`${f.name}: formato non riassuntivo, va caricato singolarmente per la mappatura colonne`);
        }
      } catch (e) {
        errors.push(`${f.name}: ${e.message}`);
      }
    }
    if (errors.length > 0) alert(`Importati ${imported}.\nErrori:\n${errors.join('\n')}`);
  };

  const importSummaryFile = (raw) => {
    const fileId = uid();
    const newRows = parseSummaryRows(raw, fileId, raw.fileName);
    const periods = [...new Set(newRows.map(r => r.periodo).filter(Boolean))].sort();
    const fileEntry = {
      id: fileId,
      fileName: raw.fileName,
      format: 'summary',
      rowCount: newRows.length,
      periods,
      importedAt: new Date().toISOString(),
    };
    setVatRegister(prev => ({
      ...prev,
      files: [...prev.files, fileEntry],
      summaryRows: [...prev.summaryRows, ...newRows],
    }));
    setStep('preview');
    setTab('summary');
  };

  const applyDetailedMapping = () => {
    if (!stagedFile) return;
    const rows = stagedFile.rows.map((r, idx) => {
      const out = { id: uid(), rowNumber: idx+1, sourceFileName: stagedFile.fileName };
      REGISTER_FIELDS.forEach(f => {
        const col = mapping[f.id];
        if (!col) { out[f.id] = null; return; }
        const v = r[col];
        if (v === '' || v == null) { out[f.id] = null; return; }
        if (f.kind === 'money' || f.kind === 'pct') {
          out[f.id] = safeNum(v);
        } else if (f.kind === 'date') {
          if (typeof v === 'number') {
            const epoch = new Date(Date.UTC(1899, 11, 30));
            const ms = v * 86400000;
            const d = new Date(epoch.getTime() + ms);
            out[f.id] = d.toISOString().slice(0,10);
          } else {
            const s = String(v).trim();
            const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
            if (m) {
              const yy = m[3].length === 2 ? '20'+m[3] : m[3];
              out[f.id] = `${yy}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
            } else {
              out[f.id] = s;
            }
          }
        } else {
          out[f.id] = String(v).trim();
        }
      });
      return out;
    });
    const fileId = uid();
    const periods = [...new Set(rows.map(r => r.documentDate ? r.documentDate.slice(0,7) : null).filter(Boolean))].sort();
    const fileEntry = {
      id: fileId,
      fileName: stagedFile.fileName,
      format: 'detailed',
      rowCount: rows.length,
      periods,
      importedAt: new Date().toISOString(),
    };
    rows.forEach(r => r.sourceFileId = fileId);
    setVatRegister(prev => ({
      ...prev,
      files: [...prev.files, fileEntry],
      rows: [...prev.rows, ...rows],
      mapping,                            // memorizza l'ultimo mapping
      fileName: stagedFile.fileName,
    }));
    setStagedFile(null); setMapping({});
    setStep('preview');
    setTab('detailed');
  };

  /* ---- FILE MANAGEMENT ---- */
  const removeFile = (fileId) => {
    const f = vatRegister.files.find(x => x.id === fileId);
    if (!f) return;
    if (!confirm(`Rimuovere il file "${f.fileName}" (${f.rowCount} righe)?`)) return;
    setVatRegister(prev => ({
      ...prev,
      files: prev.files.filter(x => x.id !== fileId),
      rows: prev.rows.filter(r => r.sourceFileId !== fileId),
      summaryRows: prev.summaryRows.filter(r => r.sourceFileId !== fileId),
    }));
  };

  /* ---- DERIVED STATE ---- */
  const allPeriods = useMemo(() => {
    const s = new Set();
    vatRegister.summaryRows.forEach(r => r.periodo && s.add(r.periodo));
    vatRegister.rows.forEach(r => r.documentDate && s.add(r.documentDate.slice(0,7)));
    return Array.from(s).sort();
  }, [vatRegister.summaryRows, vatRegister.rows]);

  const allSezioni = useMemo(() => {
    const s = new Set();
    vatRegister.summaryRows.forEach(r => r.sezione && s.add(`${r.sezione} — ${r.descSezione || ''}`));
    return Array.from(s).sort();
  }, [vatRegister.summaryRows]);

  const filteredSummary = useMemo(() => {
    return vatRegister.summaryRows.filter(r => {
      if (periodFilter && r.periodo !== periodFilter) return false;
      if (sezioneFilter && `${r.sezione} — ${r.descSezione || ''}` !== sezioneFilter) return false;
      return true;
    });
  }, [vatRegister.summaryRows, periodFilter, sezioneFilter]);

  const summaryTotals = useMemo(() => ({
    imponibile: filteredSummary.reduce((s,r) => s + (r.imponibile||0), 0),
    imposta: filteredSummary.reduce((s,r) => s + (r.imposta||0), 0),
    indetraibile: filteredSummary.reduce((s,r) => s + (r.indetraibile||0), 0),
  }), [filteredSummary]);

  /* ---- VAT CODE MAP EDITOR ---- */
  const updateCodeMap = (code, field, value) => {
    setVatRegister(prev => ({
      ...prev,
      codeMap: { ...prev.codeMap, [code]: { ...prev.codeMap[code], [field]: value } }
    }));
  };
  const addCodeMapping = () => {
    const code = prompt('Nuovo codice IVA gestionale (es. "999"):');
    if (!code || vatRegister.codeMap[code]) return;
    setVatRegister(prev => ({
      ...prev,
      codeMap: { ...prev.codeMap, [code.trim()]: { aliquota: 0, natura: '', descrizione: '' } }
    }));
  };
  const removeCodeMapping = (code) => {
    if (!confirm(`Rimuovere mapping per codice "${code}"?`)) return;
    setVatRegister(prev => {
      const m = { ...prev.codeMap }; delete m[code]; return { ...prev, codeMap: m };
    });
  };
  const resetCodeMap = () => {
    if (!confirm('Ripristinare la mappa codici IVA ai valori predefiniti?')) return;
    setVatRegister(prev => ({ ...prev, codeMap: { ...DEFAULT_VAT_CODE_MAP } }));
  };

  /* Codici presenti nei dati ma NON mappati (alert visivo) */
  const unmappedCodes = useMemo(() => {
    const used = new Set(vatRegister.summaryRows.map(r => r.aliqIvaCode).filter(Boolean));
    return Array.from(used).filter(c => !vatRegister.codeMap[c]).sort();
  }, [vatRegister.summaryRows, vatRegister.codeMap]);

  /* ---- EXPORT ---- */
  const exportSummaryExcel = () => {
    if (!vatRegister.summaryRows.length) return;
    const data = vatRegister.summaryRows.map(r => {
      const m = vatRegister.codeMap[r.aliqIvaCode] || {};
      return {
        'File': r.sourceFileName,
        'Periodo': r.periodoRaw,
        'Periodo (norm.)': r.periodo,
        'Sez.': r.sezione,
        'Descrizione sezionale': r.descSezione,
        'Tipo reg.': r.tipoReg,
        'Codice IVA': r.aliqIvaCode,
        'Descrizione cod. IVA': r.aliqIvaDesc,
        'Aliquota mappata (%)': m.aliquota != null ? m.aliquota : '',
        'Natura mappata': m.natura || '',
        'Tipologia IVA': r.tipologiaIva,
        'Descrizione tipologia': r.tipologiaIvaDesc,
        'Imponibile': r.imponibile,
        'Imposta': r.imposta,
        'Imposta non detraibile': r.indetraibile,
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Registro IVA');
    XLSX.writeFile(wb, `registro_iva_riassuntivo_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  const totalRowsAll = vatRegister.rows.length + vatRegister.summaryRows.length;

  return (
    <div className="px-10 py-8 max-w-[1400px]">
      <div className="flex items-baseline justify-between mb-2">
        <h1 className="text-4xl font-serif font-medium tracking-tight">Registri IVA</h1>
        <div className="text-sm" style={{color:'var(--ink-3)'}}>
          {vatRegister.files.length > 0 && (
            <span><span className="font-mono">{vatRegister.files.length}</span> file · <span className="font-mono">{totalRowsAll}</span> righe totali</span>
          )}
        </div>
      </div>
      <p className="text-sm mb-6" style={{ color:'var(--ink-3)' }}>
        Carica uno o più registri IVA Excel. Il formato <em>riassuntivo</em> (Periodo · Sezionale · Codice IVA) viene rilevato e importato automaticamente. Il formato <em>per documento</em> apre la mappatura colonne.
      </p>

      {step === 'upload' && totalRowsAll === 0 && (
        <div className="card p-8 text-center grid-paper">
          <Icon name="book" size={32} className="mx-auto mb-3" />
          <h3 className="font-serif text-xl mb-2">Carica registro IVA</h3>
          <p className="text-sm mb-5" style={{ color:'var(--ink-3)' }}>
            Formati: <code className="font-mono">.xlsx</code> · <code className="font-mono">.xls</code> · <code className="font-mono">.csv</code>
          </p>
          <div className="flex gap-2 justify-center">
            <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>
              <Icon name="file" size={13}/> Carica un file
            </button>
            <button className="btn" onClick={()=>fileMultiRef.current?.click()}>
              <Icon name="folder" size={13}/> Carica più file (formato riassuntivo)
            </button>
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden"
                 onChange={(e)=>e.target.files[0] && onSingleFile(e.target.files[0])}/>

/* =========================================================================
   SUMMARY RECONCILIATION — Confronto aggregato per periodo/aliquota/natura
   Per registro IVA in formato riassuntivo. Aggrega entrambe le fonti per
   (periodo mese, aliquota, natura) e confronta i totali. Considera solo
   le righe registro con tipoReg=1 (acquisti) per l'allineamento con XML
   di acquisto/passive (per ora il match si fa solo lato passivo).
========================================================================= */
const runSummaryReconciliation = (invoices, vatRegister, tolerance) => {
  const codeMap = vatRegister.codeMap || DEFAULT_VAT_CODE_MAP;

  // 1) Aggrega XML per (periodo, aliquota, natura)
  const xmlAgg = new Map();
  invoices.forEach(inv => {
    const periodo = inv.dataDocumento ? inv.dataDocumento.slice(0,7) : null;
    if (!periodo) return;
    inv.summaries.forEach(s => {
      const aliq = s.aliquotaIVA != null ? s.aliquotaIVA : 0;
      const nat = s.natura || '';
      const key = `${periodo}|${aliq}|${nat}`;
      if (!xmlAgg.has(key)) xmlAgg.set(key, { periodo, aliquota: aliq, natura: nat, imponibile: 0, imposta: 0, invoiceIds: new Set(), nDocumenti: 0 });
      const e = xmlAgg.get(key);
      e.imponibile += s.imponibile || 0;
      e.imposta    += s.imposta    || 0;
      e.invoiceIds.add(inv.id);
    });
  });
  xmlAgg.forEach(v => v.nDocumenti = v.invoiceIds.size);

  // 2) Aggrega registro per (periodo, aliquota mappata, natura mappata) — solo tipoReg=1
  const regAgg = new Map();
  vatRegister.summaryRows.forEach(r => {
    if (r.tipoReg !== 1) return;        // solo acquisti per ora
    const periodo = r.periodo;
    if (!periodo) return;
    const m = codeMap[r.aliqIvaCode] || {};
    const aliq = m.aliquota != null ? m.aliquota : 0;
    const nat = m.natura || '';
    const key = `${periodo}|${aliq}|${nat}`;
    if (!regAgg.has(key)) regAgg.set(key, { periodo, aliquota: aliq, natura: nat, imponibile: 0, imposta: 0, indetraibile: 0, codiciIva: new Set(), sezionali: new Set() });
    const e = regAgg.get(key);
    e.imponibile += r.imponibile || 0;
    e.imposta    += r.imposta    || 0;
    e.indetraibile += r.indetraibile || 0;
    if (r.aliqIvaCode) e.codiciIva.add(r.aliqIvaCode);
    if (r.sezione)     e.sezionali.add(r.sezione);
  });

  // 3) Unione delle chiavi
  const allKeys = new Set([...xmlAgg.keys(), ...regAgg.keys()]);
  const comparisons = [];
  allKeys.forEach(key => {
    const x = xmlAgg.get(key);
    const r = regAgg.get(key);
    const periodo  = (x || r).periodo;
    const aliquota = (x || r).aliquota;
    const natura   = (x || r).natura;

    const xmlImp = x ? round2(x.imponibile) : 0;
    const xmlImp_iva = x ? round2(x.imposta) : 0;
    const regImp = r ? round2(r.imponibile) : 0;
    const regImp_iva = r ? round2(r.imposta + r.indetraibile) : 0;  // somma anche indetraibile
    const diffImp = round2(xmlImp - regImp);
    const diffIva = round2(xmlImp_iva - regImp_iva);

    let status = 'ok';
    let note = '';
    if (!x && r) { status = 'register-only'; note = 'Presente solo nel registro IVA'; }
    else if (x && !r) { status = 'xml-only'; note = 'Presente solo nelle fatture XML'; }
    else if (Math.abs(diffImp) > tolerance || Math.abs(diffIva) > tolerance) {
      status = 'diff';
      note = `Diff. imponibile ${fmtMoney(diffImp)}, IVA ${fmtMoney(diffIva)}`;
    }

    comparisons.push({
      id: uid(),
      periodo, aliquota, natura,
      naturaDescrizione: naturaLabel(natura),
      xmlImponibile: xmlImp, xmlImposta: xmlImp_iva, xmlDocumenti: x ? x.nDocumenti : 0,
      regImponibile: regImp, regImposta: r ? round2(r.imposta) : 0, regIndetraibile: r ? round2(r.indetraibile) : 0,
      regCodiciIva: r ? Array.from(r.codiciIva).sort() : [],
      regSezionali: r ? Array.from(r.sezionali).sort() : [],
      diffImponibile: diffImp, diffImposta: diffIva,
      status, note,
      invoiceIds: x ? Array.from(x.invoiceIds) : [],
    });
  });

  comparisons.sort((a,b) => {
    const k = (a.periodo||'').localeCompare(b.periodo||'');
    if (k !== 0) return k;
    return (b.xmlImponibile + b.regImponibile) - (a.xmlImponibile + a.regImponibile);
  });

  return {
    mode: 'summary',
    comparisons,
    summary: {
      totalKeys: comparisons.length,
      ok: comparisons.filter(c => c.status === 'ok').length,
      diff: comparisons.filter(c => c.status === 'diff').length,
      xmlOnly: comparisons.filter(c => c.status === 'xml-only').length,
      registerOnly: comparisons.filter(c => c.status === 'register-only').length,
      xmlImponibile: comparisons.reduce((s,c)=>s+c.xmlImponibile,0),
      xmlImposta:    comparisons.reduce((s,c)=>s+c.xmlImposta,0),
      regImponibile: comparisons.reduce((s,c)=>s+c.regImponibile,0),
      regImposta:    comparisons.reduce((s,c)=>s+c.regImposta+c.regIndetraibile,0),
    }
  };
};

const buildSummaryErrorReport = (summaryResult) => {
  if (!summaryResult || summaryResult.mode !== 'summary') return [];
  const rows = [];
  summaryResult.comparisons.forEach(c => {
    if (c.status === 'ok') return;
    let severity = 'warning', errorType = '';
    if (c.status === 'xml-only') {
      severity = 'error'; errorType = 'Aggregato solo in XML';
    } else if (c.status === 'register-only') {
      severity = 'error'; errorType = 'Aggregato solo nel registro';
    } else if (c.status === 'diff') {
      severity = Math.abs(c.diffImponibile) > 100 || Math.abs(c.diffImposta) > 22 ? 'error' : 'warning';
      errorType = 'Differenza totali aggregati';
    }
    rows.push({
      id: c.id,
      severity, errorType, status: 'open',
      documentNumber: `${formatPeriodo(c.periodo)} · ${c.aliquota}% ${c.natura||''}`,
      documentDate: c.periodo,
      supplier: c.regCodiciIva.length ? `Cod. IVA: ${c.regCodiciIva.join(', ')}` : '—',
      supplierVat: '',
      sourceFile: 'Riassuntivo',
      xmlValue: c.xmlImponibile,
      registerValue: c.regImponibile,
      difference: c.diffImponibile,
      description: `${c.note}. Imp. XML ${fmtMoney(c.xmlImponibile)} (${c.xmlDocumenti} doc) vs Imp. registro ${fmtMoney(c.regImponibile)}.`,
      suggestedAction: c.status === 'xml-only'
        ? 'Verificare che le fatture XML siano state registrate'
        : c.status === 'register-only'
          ? 'Verificare che le fatture corrispondenti siano state importate'
          : 'Verificare allocazione codici IVA o totali per questo periodo/aliquota/natura',
      userNote: '',
    });
  });
  return rows;
};



// Score-based matching between an XML invoice and a register row
const matchScore = (inv, reg) => {
  let score = 0;
  const reasons = [];

  // VAT number — strong signal
  const invVat = normalizeVat(inv.supplierVat || inv.customerVat);
  const regVat = normalizeVat(reg.vatNumber);
  if (invVat && regVat) {
    if (invVat === regVat) { score += 40; reasons.push('P.IVA esatta'); }
    else if (invVat.endsWith(regVat) || regVat.endsWith(invVat)) { score += 25; reasons.push('P.IVA simile'); }
  }

  // Document number
  const invNum = normalizeNumber(inv.numeroDocumento);
  const regNum = normalizeNumber(reg.documentNumber);
  if (invNum && regNum) {
    if (invNum === regNum) { score += 25; reasons.push('Numero esatto'); }
    else if (invNum.includes(regNum) || regNum.includes(invNum)) { score += 12; reasons.push('Numero contenuto'); }
  }

  // Document date
  if (inv.dataDocumento && reg.documentDate) {
    if (inv.dataDocumento === reg.documentDate) { score += 15; reasons.push('Data esatta'); }
    else {
      const d1 = new Date(inv.dataDocumento), d2 = new Date(reg.documentDate);
      const diffDays = Math.abs((d1-d2)/86400000);
      if (diffDays <= 3) { score += 8; reasons.push('Data vicina'); }
    }
  }

  // Document total (sum across all summaries vs register)
  if (inv.totaleDocumento != null && reg.documentTotal != null) {
    const diff = Math.abs(inv.totaleDocumento - reg.documentTotal);
    if (diff <= 0.02) { score += 20; reasons.push('Totale uguale'); }
    else if (diff <= 1) { score += 10; reasons.push('Totale ≈'); }
  }

  return { score, reasons };
};

// Group register rows by (vatNumber + documentNumber + documentDate) to handle multi-line per doc
const groupRegisterByDocument = (rows) => {
  const map = new Map();
  rows.forEach(r => {
    const key = `${normalizeVat(r.vatNumber)}|${normalizeNumber(r.documentNumber)}|${r.documentDate||''}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  return map;
};

const runReconciliation = (invoices, vatRegister, tolerance) => {
  const registerGroups = groupRegisterByDocument(vatRegister.rows);
  const usedKeys = new Set();
  const results = [];

  invoices.forEach(inv => {
    // Try direct key match first
    const directKey = `${normalizeVat(inv.supplierVat || inv.customerVat)}|${normalizeNumber(inv.numeroDocumento)}|${inv.dataDocumento||''}`;
    let matched = registerGroups.get(directKey);
    let matchType = 'exact';

    if (!matched || matched.length === 0) {
      // Score-based fallback
      let best = null;
      let bestScore = 0;
      let bestKey = null;
      for (const [key, regRows] of registerGroups.entries()) {
        if (usedKeys.has(key)) continue;
        const { score, reasons } = matchScore(inv, regRows[0]);
        if (score > bestScore) { bestScore = score; best = regRows; bestKey = key; }
      }
      if (best && bestScore >= 50) {
        matched = best;
        matchType = bestScore >= 85 ? 'probable-high' : 'probable';
        if (bestKey) usedKeys.add(bestKey);
      }
    } else {
      usedKeys.add(directKey);
    }

    if (!matched) {
      results.push({
        id: uid(), invoiceId: inv.id, invoice: inv,
        registerRows: [],
        matchStatus: 'xml-only',
        confidenceScore: 0,
        diffs: [],
        roundingChecks: [],
        articleChecks: [],
        notes: 'Fattura presente in XML ma non nel registro IVA',
        suggestedAction: 'Verificare se la fattura è da registrare',
      });
      return;
    }

    // For each XML summary, find matching register row(s) by rate+nature
    const articleChecks = [];
    const roundingChecks = [];
    const diffs = [];

    inv.summaries.forEach(sum => {
      const matchingRegs = matched.filter(r => {
        // Match on rate first; if both have nature, require it
        const rateMatch = (r.vatRate == null && sum.aliquotaIVA == null) ||
                         (Math.abs((r.vatRate||0) - (sum.aliquotaIVA||0)) <= 0.01);
        const xmlHasNat = !!sum.natura;
        const regHasNat = !!r.natureCode;
        const natureMatch = (!xmlHasNat && !regHasNat) || (xmlHasNat && regHasNat && sum.natura === r.natureCode);
        return rateMatch && (natureMatch || (!xmlHasNat && !regHasNat));
      });

      // VAT article check
      const articleCheck = checkVatArticle(sum, matchingRegs, inv);
      articleChecks.push(articleCheck);

      // Rounding check (only if we have at least one matching register row)
      if (matchingRegs.length > 0) {
        const regImponibile = matchingRegs.reduce((s,r) => s + (r.taxableAmount || 0), 0);
        const regImposta = matchingRegs.reduce((s,r) => s + (r.vatAmount || 0), 0);

        const xmlImponibile = sum.imponibile || 0;
        const xmlImposta = sum.imposta || 0;
        const computedTheoretical = round2(xmlImponibile * (sum.aliquotaIVA||0) / 100);

        const diffImponibile = round2(xmlImponibile - regImponibile);
        const diffImposta = round2(xmlImposta - regImposta);

        // Detect rounding presence in XML: difference between declared and theoretical
        const xmlRoundingPresent = Math.abs(xmlImposta - computedTheoretical) >= 0.01 && (sum.aliquotaIVA||0) > 0;
        const xmlRoundingValue = round2(xmlImposta - computedTheoretical);

        // The register IVA should match the XML IVA if rounding is correctly handled
        let status, valutazione, suggested;
        const absDiffImposta = Math.abs(diffImposta);

        if (absDiffImposta <= 0.005) {
          status = 'ok';
          valutazione = xmlRoundingPresent
            ? 'IVA corretta — arrotondamento gestito correttamente'
            : 'IVA corretta';
          suggested = '—';
        } else if (absDiffImposta <= tolerance) {
          status = 'warning';
          if (xmlRoundingPresent) {
            valutazione = `Differenza IVA minima (${fmtMoney(diffImposta)}) — arrotondamento XML potenzialmente non recepito nel registro`;
            suggested = `Verificare se l'arrotondamento di ${fmtMoney(xmlRoundingValue)} indicato in XML è stato registrato`;
          } else {
            valutazione = `Differenza IVA minima (${fmtMoney(diffImposta)}) entro tolleranza tecnica`;
            suggested = 'Differenza fisiologica da arrotondamento — revisione consigliata';
          }
        } else {
          status = 'error';
          if (xmlRoundingPresent && Math.abs(diffImposta - xmlRoundingValue) <= 0.01) {
            valutazione = `Arrotondamento XML di ${fmtMoney(xmlRoundingValue)} non gestito nel registro`;
            suggested = 'Imputare l\'arrotondamento IVA come da fattura XML';
          } else {
            valutazione = `IVA registrata (${fmtMoney(regImposta)}) diversa da XML (${fmtMoney(xmlImposta)}) di ${fmtMoney(diffImposta)}`;
            suggested = 'Verificare imputazione contabile / articolo IVA utilizzato';
          }
        }

        roundingChecks.push({
          aliquotaIVA: sum.aliquotaIVA,
          natura: sum.natura,
          xmlImponibile, regImponibile, diffImponibile,
          xmlImposta, regImposta, diffImposta,
          xmlTheoretical: computedTheoretical,
          xmlRoundingPresent, xmlRoundingValue,
          status, valutazione, suggested,
        });

        if (Math.abs(diffImponibile) > 0.01) {
          diffs.push({
            field:'imponibile',
            xmlValue: xmlImponibile,
            regValue: regImponibile,
            difference: diffImponibile,
            severity: Math.abs(diffImponibile) > tolerance ? 'error' : 'warning',
            description: `Imponibile aliquota ${fmtNum(sum.aliquotaIVA,2)}% — differenza ${fmtMoney(diffImponibile)}`,
          });
        }
      } else {
        // Summary in XML not found in register
        articleCheck.status = 'error';
        articleCheck.descrizione = 'Riepilogo IVA presente in XML ma non in registro per questa aliquota/natura';
        articleCheck.suggested = 'Verificare se il registro contiene il dettaglio IVA per questa aliquota';
        diffs.push({
          field:'aliquota',
          xmlValue: `${fmtNum(sum.aliquotaIVA,2)}% ${sum.natura||''}`,
          regValue: '—',
          difference: null,
          severity: 'error',
          description: `Aliquota/natura presente in XML ma non in registro`,
        });
      }
    });

    // Cross-check summaries in register but not in XML
    const xmlRateNature = new Set(inv.summaries.map(s => `${s.aliquotaIVA||''}|${s.natura||''}`));
    matched.forEach(r => {
      const k = `${r.vatRate||''}|${r.natureCode||''}`;
      if (!xmlRateNature.has(k) && (r.taxableAmount || r.vatAmount)) {
        diffs.push({
          field:'aliquota',
          xmlValue: '—',
          regValue: `${fmtNum(r.vatRate,2)}% ${r.natureCode||''}`,
          difference: null,
          severity: 'warning',
          description: 'Aliquota/natura presente in registro ma non in XML',
        });
      }
    });

    // Total comparison
    const regTotal = matched.reduce((s,r) => Math.max(s, r.documentTotal || 0), 0);
    let totalDiff = null;
    if (inv.totaleDocumento != null && regTotal != null) {
      totalDiff = round2(inv.totaleDocumento - regTotal);
      if (Math.abs(totalDiff) > tolerance) {
        diffs.push({
          field:'totale',
          xmlValue: inv.totaleDocumento,
          regValue: regTotal,
          difference: totalDiff,
          severity: Math.abs(totalDiff) > 1 ? 'error' : 'warning',
          description: `Totale documento — differenza ${fmtMoney(totalDiff)}`,
        });
      }
    }

    const hasError = diffs.some(d => d.severity==='error') ||
                     roundingChecks.some(r => r.status==='error') ||
                     articleChecks.some(a => a.status==='error');
    const hasWarn = diffs.some(d => d.severity==='warning') ||
                    roundingChecks.some(r => r.status==='warning') ||
                    articleChecks.some(a => a.status==='warning');

    let status, score = matchType === 'exact' ? 100 : (matchType === 'probable-high' ? 85 : 60);
    if (hasError) status = 'error';
    else if (hasWarn) status = 'warning';
    else status = 'ok';

    results.push({
      id: uid(), invoiceId: inv.id, invoice: inv,
      registerRows: matched,
      matchStatus: matchType,
      confidenceScore: score,
      diffs, roundingChecks, articleChecks,
      status,
      notes: matchType === 'exact' ? 'Corrispondenza certa' :
             matchType === 'probable-high' ? 'Corrispondenza probabile (alta confidenza)' :
             'Corrispondenza probabile',
      suggestedAction: hasError ? 'Verificare errori' : (hasWarn ? 'Revisione consigliata' : 'OK'),
    });
  });

  // Register rows not matched to any XML
  const matchedKeys = new Set();
  results.forEach(r => r.registerRows.forEach(rr => matchedKeys.add(rr.id)));
  const orphanRegisterRows = vatRegister.rows.filter(r => !matchedKeys.has(r.id));
  // Group orphans by document key
  const orphanGroups = new Map();
  orphanRegisterRows.forEach(r => {
    const k = `${normalizeVat(r.vatNumber)}|${normalizeNumber(r.documentNumber)}|${r.documentDate||''}`;
    if (!orphanGroups.has(k)) orphanGroups.set(k, []);
    orphanGroups.get(k).push(r);
  });
  for (const [k, rows] of orphanGroups.entries()) {
    if (k === '||') continue; // skip empty keys
    results.push({
      id: uid(), invoiceId: null, invoice: null,
      registerRows: rows,
      matchStatus: 'register-only',
      confidenceScore: 0,
      diffs: [], roundingChecks: [], articleChecks: [],
      status: 'warning',
      notes: 'Documento presente nel registro IVA ma non tra gli XML',
      suggestedAction: 'Verificare se l\'XML è da scaricare/importare',
    });
  }

  return results;
};

// VAT article coherence check
const checkVatArticle = (xmlSummary, regRows, inv) => {
  const xmlRate = xmlSummary.aliquotaIVA;
  const xmlNat = xmlSummary.natura;

  if (regRows.length === 0) {
    return {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: '—',
      status: 'error',
      descrizione: 'Nessuna riga di registro corrisponde all\'aliquota/natura della fattura',
      suggested: 'Verificare la registrazione di questa aliquota IVA',
    };
  }

  const articoli = [...new Set(regRows.map(r => r.vatArticle).filter(Boolean))];
  const naturaInReg = regRows.some(r => r.natureCode === xmlNat);
  const rateMatchExact = regRows.every(r => Math.abs((r.vatRate||0) - (xmlRate||0)) <= 0.01);

  // Case 1: Nature in XML but no natureCode in register
  if (xmlNat && !regRows.some(r => r.natureCode)) {
    return {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: articoli.join(', ') || '—',
      status: 'warning',
      descrizione: `Natura IVA "${xmlNat}" presente in XML ma codice natura assente nel registro`,
      suggested: `Verificare che l'articolo IVA "${articoli.join(', ')}" sia coerente con natura ${xmlNat}`,
    };
  }

  // Case 2: Different natures
  if (xmlNat && !naturaInReg && regRows.some(r => r.natureCode)) {
    const regNature = [...new Set(regRows.map(r => r.natureCode).filter(Boolean))].join(', ');
    return {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: articoli.join(', ') || '—',
      status: 'error',
      descrizione: `Codice natura divergente: XML="${xmlNat}", Registro="${regNature}"`,
      suggested: 'Articolo IVA potenzialmente errato — verificare imputazione',
    };
  }

  // Case 3: Different rates
  if (!rateMatchExact) {
    const regRates = [...new Set(regRows.map(r => r.vatRate).filter(v=>v!=null))].map(r=>fmtNum(r,2)+'%').join(', ');
    return {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: articoli.join(', ') || '—',
      status: 'error',
      descrizione: `Aliquota divergente: XML=${fmtNum(xmlRate,2)}%, Registro=${regRates}`,
      suggested: 'Verificare l\'aliquota IVA usata nel registro',
    };
  }

  // Case 4: No article in register
  if (articoli.length === 0) {
    return {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: '—',
      status: 'warning',
      descrizione: 'Articolo IVA mancante nel registro',
      suggested: 'Inserire codice articolo IVA',
    };
  }

  // Case 5: Special operations needing review
  if (xmlNat) {
    const naturaCheck = {
      aliquotaXml: xmlRate, naturaXml: xmlNat,
      articoloRegistro: articoli.join(', '),
      status: 'review',
      descrizione: `Operazione con natura ${xmlNat} — verifica manuale consigliata`,
      suggested: 'Verificare regime: non imponibile / esente / esclusa / reverse charge / split payment',
    };
    // Looser status if everything else matches
    if (naturaInReg && rateMatchExact) {
      naturaCheck.status = 'ok';
      naturaCheck.descrizione = `Natura ${xmlNat} coerente. Articolo: ${articoli.join(', ')}`;
      naturaCheck.suggested = 'OK';
    }
    return naturaCheck;
  }

  return {
    aliquotaXml: xmlRate, naturaXml: xmlNat,
    articoloRegistro: articoli.join(', '),
    status: 'ok',
    descrizione: `Aliquota ${fmtNum(xmlRate,2)}% coerente · articolo "${articoli.join(', ')}"`,
    suggested: 'OK',
  };
};

// Build error report from reconciliation
const buildErrorReport = (results) => {
  const items = [];
  results.forEach(r => {
    const inv = r.invoice;
    const docInfo = inv ? {
      documentNumber: inv.numeroDocumento,
      documentDate: inv.dataDocumento,
      supplierOrCustomer: inv.supplierName,
      sourceFileName: inv.sourceFileName,
    } : (r.registerRows[0] ? {
      documentNumber: r.registerRows[0].documentNumber,
      documentDate: r.registerRows[0].documentDate,
      supplierOrCustomer: r.registerRows[0].supplierOrCustomer,
      sourceFileName: r.registerRows[0].sourceFileName,
    } : {});

    if (r.matchStatus === 'xml-only') {
      items.push({
        id: uid(), severity: 'warning', errorType: 'XML senza riscontro',
        ...docInfo,
        xmlValue: '—', registerValue: '—', difference: null,
        description: 'Fattura presente in XML ma non nel registro IVA',
        suggestedAction: 'Verificare se la fattura è da registrare',
        status: 'open', userNote: '',
      });
      return;
    }
    if (r.matchStatus === 'register-only') {
      items.push({
        id: uid(), severity: 'warning', errorType: 'Registro senza XML',
        ...docInfo,
        xmlValue: '—', registerValue: '—', difference: null,
        description: 'Documento nel registro IVA ma nessun XML corrispondente',
        suggestedAction: 'Verificare se l\'XML è da importare',
        status: 'open', userNote: '',
      });
      return;
    }

    r.diffs.forEach(d => {
      items.push({
        id: uid(),
        severity: d.severity,
        errorType: `Differenza ${d.field}`,
        ...docInfo,
        xmlValue: typeof d.xmlValue === 'number' ? fmtMoney(d.xmlValue) : d.xmlValue,
        registerValue: typeof d.regValue === 'number' ? fmtMoney(d.regValue) : d.regValue,
        difference: d.difference != null ? fmtMoney(d.difference) : '—',
        description: d.description,
        suggestedAction: 'Verificare imputazione',
        status: 'open', userNote: '',
      });
    });
    r.roundingChecks.filter(c => c.status !== 'ok').forEach(c => {
      items.push({
        id: uid(),
        severity: c.status === 'error' ? 'error' : 'warning',
        errorType: 'Controllo IVA / Arrotondamento',
        ...docInfo,
        xmlValue: fmtMoney(c.xmlImposta),
        registerValue: fmtMoney(c.regImposta),
        difference: fmtMoney(c.diffImposta),
        description: c.valutazione,
        suggestedAction: c.suggested,
        status: 'open', userNote: '',
      });
    });
    r.articleChecks.filter(a => a.status === 'error' || a.status === 'review').forEach(a => {
      items.push({
        id: uid(),
        severity: a.status === 'error' ? 'error' : 'review',
        errorType: 'Articolo IVA',
        ...docInfo,
        xmlValue: `${fmtNum(a.aliquotaXml,2)}% ${a.naturaXml||''}`,
        registerValue: a.articoloRegistro,
        difference: '—',
        description: a.descrizione,
        suggestedAction: a.suggested,
        status: 'open', userNote: '',
      });
    });
  });
  return items;
};


/* =========================================================================
   CONTROLLI SECTION — UI
========================================================================= */
const ControlliSection = ({ invoices, vatRegister, tolerance, setTolerance,
                             reconResults, setReconResults, setErrorReport, setPdfTarget }) => {
  const [running, setRunning] = useState(false);
  const [filterStatus, setFilterStatus] = useState('all');
  const [expanded, setExpanded] = useState({});
  const [summaryResult, setSummaryResult] = useState(null);

  const hasDetailed = vatRegister.rows.length > 0;
  const hasSummary  = vatRegister.summaryRows.length > 0;
  const canRun = invoices.length > 0 && (hasDetailed || hasSummary);

  const run = () => {
    setRunning(true);
    setTimeout(() => {
      if (hasDetailed) {
        const results = runReconciliation(invoices, vatRegister, tolerance);
        setReconResults(results);
        setErrorReport(buildErrorReport(results));
        setSummaryResult(null);
      } else if (hasSummary) {
        const sumRes = runSummaryReconciliation(invoices, vatRegister, tolerance);
        setSummaryResult(sumRes);
        setReconResults([]);
        setErrorReport(buildSummaryErrorReport(sumRes));
      }
      setRunning(false);
    }, 100);
  };

  const filtered = useMemo(() => {
    if (filterStatus === 'all') return reconResults;
    if (filterStatus === 'unmatched') return reconResults.filter(r => r.matchStatus === 'xml-only' || r.matchStatus === 'register-only');
    if (filterStatus === 'errors') return reconResults.filter(r => r.status === 'error');
    if (filterStatus === 'warnings') return reconResults.filter(r => r.status === 'warning');
    if (filterStatus === 'ok') return reconResults.filter(r => r.status === 'ok');
    return reconResults;
  }, [reconResults, filterStatus]);

  const counts = useMemo(() => ({
    total: reconResults.length,
    ok: reconResults.filter(r => r.status === 'ok').length,
    warning: reconResults.filter(r => r.status === 'warning').length,
    error: reconResults.filter(r => r.status === 'error').length,
    xmlOnly: reconResults.filter(r => r.matchStatus === 'xml-only').length,
    registerOnly: reconResults.filter(r => r.matchStatus === 'register-only').length,
  }), [reconResults]);

  const exportRecon = () => {
    const data = reconResults.map(r => {
      const inv = r.invoice;
      const reg0 = r.registerRows[0];
      return {
        'Stato match': r.matchStatus,
        'Confidence': r.confidenceScore,
        'Esito controllo': r.status,
        'File XML': inv?.sourceFileName || '—',
        'Tipo': inv?.tipoDocumento || '—',
        'Numero XML': inv?.numeroDocumento || '—',
        'Data XML': inv?.dataDocumento || '—',
        'Fornitore XML': inv?.supplierName || '—',
        'P.IVA XML': inv?.supplierVat || '—',
        'Imponibile XML': inv?.taxableAmountTotal || '',
        'IVA XML': inv?.vatAmountTotal || '',
        'Totale XML': inv?.totaleDocumento || '',
        'Numero Reg.': reg0?.documentNumber || '—',
        'Data Reg.': reg0?.documentDate || '—',
        'Soggetto Reg.': reg0?.supplierOrCustomer || '—',
        'P.IVA Reg.': reg0?.vatNumber || '—',
        'Imponibile Reg.': r.registerRows.reduce((s,x)=>s+(x.taxableAmount||0),0) || '',
        'IVA Reg.': r.registerRows.reduce((s,x)=>s+(x.vatAmount||0),0) || '',
        'Totale Reg.': reg0?.documentTotal || '',
        'Note': r.notes,
        'Azione consigliata': r.suggestedAction,
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Riconciliazione');

    // Sheet for VAT articles
    const articleData = reconResults.flatMap(r =>
      r.articleChecks.map(a => ({
        'File XML': r.invoice?.sourceFileName || '—',
        'Numero': r.invoice?.numeroDocumento || '—',
        'Soggetto': r.invoice?.supplierName || '—',
        'Aliquota XML': a.aliquotaXml != null ? a.aliquotaXml+'%' : '',
        'Natura XML': a.naturaXml || '',
        'Articolo IVA Registro': a.articoloRegistro,
        'Esito': a.status,
        'Descrizione': a.descrizione,
        'Suggerimento': a.suggested,
      }))
    );
    if (articleData.length > 0) {
      const wsA = XLSX.utils.json_to_sheet(articleData);
      XLSX.utils.book_append_sheet(wb, wsA, 'Controllo Articoli IVA');
    }

    // Sheet for rounding checks
    const roundingData = reconResults.flatMap(r =>
      r.roundingChecks.map(c => ({
        'File XML': r.invoice?.sourceFileName || '—',
        'Numero': r.invoice?.numeroDocumento || '—',
        'Soggetto': r.invoice?.supplierName || '—',
        'Aliquota': c.aliquotaIVA != null ? c.aliquotaIVA+'%' : '',
        'Imponibile XML': c.xmlImponibile,
        'IVA XML': c.xmlImposta,
        'IVA teorica (calcolata)': c.xmlTheoretical,
        'Arrotondamento XML': c.xmlRoundingPresent ? c.xmlRoundingValue : 0,
        'IVA Registro': c.regImposta,
        'Differenza IVA': c.diffImposta,
        'Esito': c.status,
        'Valutazione': c.valutazione,
        'Suggerimento': c.suggested,
      }))
    );
    if (roundingData.length > 0) {
      const wsR = XLSX.utils.json_to_sheet(roundingData);
      XLSX.utils.book_append_sheet(wb, wsR, 'Controllo Arrotondamenti');
    }

    XLSX.writeFile(wb, `controlli_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  if (!canRun) {
    return (
      <div className="px-10 py-8">
        <h1 className="text-4xl font-serif font-medium tracking-tight mb-6">Controlli</h1>
        <div className="card p-12 text-center">
          <Icon name="check" size={32} className="mx-auto mb-3" />
          <h3 className="font-serif text-xl mb-2">Servono fatture XML e registro IVA</h3>
          <p className="text-sm" style={{ color:'var(--ink-3)' }}>
            {invoices.length === 0 && 'Nessuna fattura caricata. '}
            {!hasDetailed && !hasSummary && 'Nessun registro IVA caricato.'}
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className="px-10 py-8 h-full flex flex-col">
      <h1 className="text-4xl font-serif font-medium tracking-tight mb-2">Controlli</h1>
      <p className="text-sm mb-6" style={{ color:'var(--ink-3)' }}>
        Riconciliazione tra fatture XML e registro IVA, controllo articoli IVA e arrotondamenti.
      </p>

      <div className="card p-5 mb-4">
        <div className="grid grid-cols-12 gap-4 items-end">
          <div className="col-span-3">
            <label className="label block mb-1">Soglia tolleranza differenze IVA (€)</label>
            <input type="number" step="0.01" className="input"
                   value={tolerance} onChange={e => setTolerance(parseFloat(e.target.value)||0)}/>
            <div className="text-[11px] mt-1" style={{ color:'var(--ink-3)' }}>
              Solo come supporto al controllo, non regola di accettazione automatica.
            </div>
          </div>
          <div className="col-span-3 text-sm">
            <div className="label">Dataset</div>
            <div>📄 <strong>{invoices.length}</strong> fatture XML</div>
            {hasDetailed && <div>📋 <strong>{vatRegister.rows.length}</strong> righe registro per documento</div>}
            {hasSummary && <div>📊 <strong>{vatRegister.summaryRows.length}</strong> righe registro riassuntivo</div>}
            {hasSummary && !hasDetailed && (
              <div className="text-[11px] mt-1" style={{color:'var(--accent)'}}>
                Modalità: <strong>confronto aggregato</strong> per periodo/aliquota/natura
              </div>
            )}
          </div>
          <div className="col-span-6 flex justify-end gap-2">
            {reconResults.length > 0 && (
              <button className="btn btn-secondary" onClick={exportRecon}>
                <Icon name="download" size={13}/> Esporta Excel controlli
              </button>
            )}
            <button className="btn btn-accent" onClick={run} disabled={running}>
              {running ? <><span className="pulse">⟳</span> Elaborazione...</> :
                <><Icon name="refresh" size={13}/> Esegui controlli</>}
            </button>
          </div>
        </div>
      </div>

      {summaryResult && (
        <Fragment>
          <div className="grid grid-cols-6 gap-3 mb-4">
            <div className="kpi-card">
              <div className="label">Aggregati</div>
              <div className="text-2xl font-serif">{summaryResult.summary.totalKeys}</div>
            </div>
            <div className="kpi-card ok">
              <div className="label">Coerenti</div>
              <div className="text-2xl font-serif" style={{color:'var(--ok)'}}>{summaryResult.summary.ok}</div>
            </div>
            <div className="kpi-card warn">
              <div className="label">Differenze</div>
              <div className="text-2xl font-serif" style={{color:'var(--warn)'}}>{summaryResult.summary.diff}</div>
            </div>
            <div className="kpi-card err">
              <div className="label">Solo XML</div>
              <div className="text-2xl font-serif" style={{color:'var(--err)'}}>{summaryResult.summary.xmlOnly}</div>
            </div>
            <div className="kpi-card err">
              <div className="label">Solo registro</div>
              <div className="text-2xl font-serif" style={{color:'var(--err)'}}>{summaryResult.summary.registerOnly}</div>
            </div>
            <div className="kpi-card">
              <div className="label">Diff. tot. imponibile</div>
              <div className="text-xl font-serif" style={{color: Math.abs(summaryResult.summary.xmlImponibile - summaryResult.summary.regImponibile) > tolerance ? 'var(--err)' : 'inherit'}}>
                {fmtMoney(summaryResult.summary.xmlImponibile - summaryResult.summary.regImponibile)}
              </div>
            </div>
          </div>

          <div className="card flex-1 overflow-auto min-h-[400px]">
            <table className="data-table">
              <thead><tr>
                <th>Stato</th><th>Periodo</th><th>Aliq.</th><th>Natura</th>
                <th className="text-right">Imp. XML</th>
                <th className="text-right">Imp. Reg.</th>
                <th className="text-right">Diff. Imp.</th>
                <th className="text-right">IVA XML</th>
                <th className="text-right">IVA Reg.</th>
                <th className="text-right">Diff. IVA</th>
                <th>Codici IVA registro</th>
                <th>Note</th>
              </tr></thead>
              <tbody>
                {summaryResult.comparisons.map(c => (
                  <tr key={c.id} style={{background: c.status === 'ok' ? undefined : 'rgba(181,134,46,0.04)'}}>
                    <td>
                      {c.status === 'ok' && <span className="badge b-ok">OK</span>}
                      {c.status === 'diff' && <span className="badge b-warn">Diff.</span>}
                      {c.status === 'xml-only' && <span className="badge b-err">Solo XML</span>}
                      {c.status === 'register-only' && <span className="badge b-err">Solo Reg.</span>}
                    </td>
                    <td className="text-xs">{formatPeriodo(c.periodo)}</td>
                    <td className="num text-xs">{c.aliquota}%</td>
                    <td className="text-xs" title={c.naturaDescrizione}>
                      {c.natura ? <span className="badge b-mute">{c.natura}</span> : '—'}
                    </td>
                    <td className="num text-right">{fmtMoney(c.xmlImponibile)}</td>
                    <td className="num text-right">{fmtMoney(c.regImponibile)}</td>
                    <td className="num text-right" style={{color: Math.abs(c.diffImponibile) > tolerance ? 'var(--err)' : 'inherit', fontWeight: Math.abs(c.diffImponibile) > 0.01 ? 600 : 400}}>
                      {fmtMoney(c.diffImponibile)}
                    </td>
                    <td className="num text-right">{fmtMoney(c.xmlImposta)}</td>
                    <td className="num text-right">{fmtMoney(c.regImposta + c.regIndetraibile)}</td>
                    <td className="num text-right" style={{color: Math.abs(c.diffImposta) > tolerance ? 'var(--err)' : 'inherit', fontWeight: Math.abs(c.diffImposta) > 0.01 ? 600 : 400}}>
                      {fmtMoney(c.diffImposta)}
                    </td>
                    <td className="text-xs">
                      {c.regCodiciIva.length > 0 ? c.regCodiciIva.map(k => <span key={k} className="badge b-mute mr-1">{k}</span>) : '—'}
                    </td>
                    <td className="text-xs italic" style={{color:'var(--ink-3)'}}>{c.note || ''}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Fragment>
      )}


      {reconResults.length > 0 && (
        <Fragment>
          <div className="grid grid-cols-6 gap-3 mb-4">
            <button onClick={()=>setFilterStatus('all')}
                    className={`kpi-card text-left ${filterStatus==='all'?'':'opacity-70'}`}>
              <div className="label">Totale</div>
              <div className="text-2xl font-serif">{counts.total}</div>
            </button>
            <button onClick={()=>setFilterStatus('ok')}
                    className={`kpi-card ok text-left ${filterStatus==='ok'?'':'opacity-70'}`}>
              <div className="label">Coerenti</div>
              <div className="text-2xl font-serif" style={{color:'var(--ok)'}}>{counts.ok}</div>
            </button>
            <button onClick={()=>setFilterStatus('warnings')}
                    className={`kpi-card warn text-left ${filterStatus==='warnings'?'':'opacity-70'}`}>
              <div className="label">Warning</div>
              <div className="text-2xl font-serif" style={{color:'var(--warn)'}}>{counts.warning}</div>
            </button>
            <button onClick={()=>setFilterStatus('errors')}
                    className={`kpi-card err text-left ${filterStatus==='errors'?'':'opacity-70'}`}>
              <div className="label">Errori</div>
              <div className="text-2xl font-serif" style={{color:'var(--err)'}}>{counts.error}</div>
            </button>
            <button onClick={()=>setFilterStatus('unmatched')}
                    className={`kpi-card text-left ${filterStatus==='unmatched'?'':'opacity-70'}`}>
              <div className="label">XML senza match</div>
              <div className="text-2xl font-serif">{counts.xmlOnly}</div>
            </button>
            <div className="kpi-card">
              <div className="label">Registro senza XML</div>
              <div className="text-2xl font-serif">{counts.registerOnly}</div>
            </div>
          </div>

          <div className="card flex-1 overflow-auto min-h-[400px]">
            <table className="data-table">
              <thead>
                <tr>
                  <th style={{width:32}}></th>
                  <th>Esito</th>
                  <th>Match</th>
                  <th>Conf.</th>
                  <th>Documento</th>
                  <th>Soggetto</th>
                  <th className="text-right">Tot. XML</th>
                  <th className="text-right">Tot. Registro</th>
                  <th className="text-right">Diff.</th>
                  <th>Anomalie</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(r => {
                  const isExp = !!expanded[r.id];
                  const inv = r.invoice;
                  const reg0 = r.registerRows[0];
                  const totXml = inv?.totaleDocumento;
                  const totReg = reg0?.documentTotal;
                  const diff = (totXml != null && totReg != null) ? round2(totXml - totReg) : null;
                  const anomalieCount = r.diffs.length + r.roundingChecks.filter(c=>c.status!=='ok').length + r.articleChecks.filter(a=>a.status!=='ok').length;
                  return (
                    <Fragment key={r.id}>
                      <tr className="hover-row cursor-pointer" onClick={()=>setExpanded(p=>({...p,[r.id]:!isExp}))}>
                        <td><Icon name={isExp?'chevdown':'chevright'} size={12}/></td>
                        <td>
                          {r.status==='ok' && <span className="badge b-ok">OK</span>}
                          {r.status==='warning' && <span className="badge b-warn">Warning</span>}
                          {r.status==='error' && <span className="badge b-err">Errore</span>}
                        </td>
                        <td className="text-xs">
                          {r.matchStatus==='exact' && <span className="badge b-ok">Esatto</span>}
                          {r.matchStatus==='probable-high' && <span className="badge b-info">Probabile alto</span>}
                          {r.matchStatus==='probable' && <span className="badge b-warn">Probabile</span>}
                          {r.matchStatus==='xml-only' && <span className="badge b-warn">Solo XML</span>}
                          {r.matchStatus==='register-only' && <span className="badge b-warn">Solo Reg.</span>}
                        </td>
                        <td className="num text-xs">{r.confidenceScore}</td>
                        <td className="text-xs">
                          {inv ? <><span className="font-mono">{inv.numeroDocumento}</span> · {fmtDate(inv.dataDocumento)}</>
                               : <><span className="font-mono">{reg0?.documentNumber}</span> · {fmtDate(reg0?.documentDate)}</>}
                        </td>
                        <td className="truncate max-w-[220px] text-xs">
                          {inv?.supplierName || reg0?.supplierOrCustomer || '—'}
                        </td>
                        <td className="num text-right">{totXml != null ? fmtMoney(totXml) : '—'}</td>
                        <td className="num text-right">{totReg != null ? fmtMoney(totReg) : '—'}</td>
                        <td className={`num text-right ${diff && Math.abs(diff)>tolerance ? 'font-bold' : ''}`}
                            style={{ color: diff && Math.abs(diff)>tolerance ? 'var(--err)' : 'inherit' }}>
                          {diff != null ? fmtMoney(diff) : '—'}
                        </td>
                        <td className="text-xs">
                          {anomalieCount > 0 ? <span className="badge b-warn">{anomalieCount}</span> : <span className="text-xs" style={{color:'var(--ink-3)'}}>—</span>}
                        </td>
                        <td>
                          {inv && (
                            <button className="btn btn-ghost" style={{padding:'2px 4px'}} onClick={(e)=>{e.stopPropagation(); setPdfTarget(inv);}}>
                              <Icon name="eye" size={12}/>
                            </button>
                          )}
                        </td>
                      </tr>
                      {isExp && (
                        <tr style={{ background:'var(--bg)' }}>
                          <td colSpan="11" className="!p-5">
                            <ReconDetail r={r} tolerance={tolerance}/>
                          </td>
                        </tr>
                      )}
                    </Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Fragment>
      )}

      {reconResults.length === 0 && (
        <div className="card p-12 text-center mt-4">
          <p style={{ color:'var(--ink-3)' }}>Esegui i controlli per visualizzare i risultati.</p>
        </div>
      )}
    </div>
  );
};

const ReconDetail = ({ r, tolerance }) => (

    <div className="col-span-12">
      <div className="text-sm font-semibold mb-1">{r.notes}</div>
      <div className="text-xs" style={{color:'var(--ink-3)'}}>{r.suggestedAction}</div>
    </div>

    {r.articleChecks.length > 0 && (
      <div className="col-span-12">
        <div className="label mb-2">Controllo articoli IVA ({r.articleChecks.length})</div>
        <div className="card overflow-x-auto">
          <table className="data-table">
            <thead><tr>
              <th>Esito</th><th>Aliquota XML</th><th>Natura XML</th><th>Articolo IVA Registro</th><th>Descrizione</th><th>Suggerimento</th>
            </tr></thead>
            <tbody>
              {r.articleChecks.map((a,i) => (
                <tr key={i}>
                  <td>
                    {a.status==='ok' && <span className="badge b-ok">OK</span>}
                    {a.status==='warning' && <span className="badge b-warn">Warning</span>}
                    {a.status==='error' && <span className="badge b-err">Errore</span>}
                    {a.status==='review' && <span className="badge b-info">Verifica</span>}
                  </td>
                  <td className="num text-xs">{a.aliquotaXml != null ? fmtNum(a.aliquotaXml,2)+'%' : '—'}</td>
                  <td className="text-xs">{a.naturaXml || '—'}</td>
                  <td className="text-xs"><span className="badge b-mute">{a.articoloRegistro}</span></td>
                  <td className="text-xs">{a.descrizione}</td>
                  <td className="text-xs italic" style={{color:'var(--ink-3)'}}>{a.suggested}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    )}

    {r.roundingChecks.length > 0 && (
      <div className="col-span-12">
        <div className="label mb-2">Controllo arrotondamenti IVA ({r.roundingChecks.length})</div>
        <div className="card overflow-x-auto">
          <table className="data-table">
            <thead><tr>
              <th>Esito</th><th>Aliq.</th>
              <th className="text-right">Imponibile XML</th>
              <th className="text-right">IVA XML</th>
              <th className="text-right">IVA teorica</th>
              <th className="text-right">Arrotond. XML</th>
              <th className="text-right">IVA Registro</th>
              <th className="text-right">Differenza</th>
              <th>Valutazione</th>
            </tr></thead>
            <tbody>
              {r.roundingChecks.map((c,i) => (
                <tr key={i}>
                  <td>
                    {c.status==='ok' && <span className="badge b-ok">OK</span>}
                    {c.status==='warning' && <span className="badge b-warn">Warning</span>}
                    {c.status==='error' && <span className="badge b-err">Errore</span>}
                  </td>
                  <td className="num text-xs">{fmtNum(c.aliquotaIVA||0,2)}%</td>
                  <td className="num text-right">{fmtMoney(c.xmlImponibile)}</td>
                  <td className="num text-right">{fmtMoney(c.xmlImposta)}</td>
                  <td className="num text-right text-xs" style={{color:'var(--ink-3)'}}>{fmtMoney(c.xmlTheoretical)}</td>
                  <td className="num text-right">
                    {c.xmlRoundingPresent ?
                      <span style={{color:'var(--accent)'}}>{fmtMoney(c.xmlRoundingValue)}</span> :
                      <span style={{color:'var(--ink-3)'}}>—</span>}
                  </td>
                  <td className="num text-right">{fmtMoney(c.regImposta)}</td>
                  <td className="num text-right" style={{ color: Math.abs(c.diffImposta) > tolerance ? 'var(--err)' : 'inherit', fontWeight: Math.abs(c.diffImposta) > 0.005 ? 600 : 400 }}>
                    {fmtMoney(c.diffImposta)}
                  </td>
                  <td className="text-xs">{c.valutazione}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

    {r.diffs.length > 0 && (
      <div className="col-span-12">
        <div className="label mb-2">Altre differenze ({r.diffs.length})</div>
        <div className="card overflow-x-auto">
          <table className="data-table">
            <thead><tr>
              <th>Severità</th><th>Campo</th><th>Valore XML</th><th>Valore Registro</th><th>Differenza</th><th>Descrizione</th>
            </tr></thead>
            <tbody>
              {r.diffs.map((d,i) => (
                <tr key={i}>
                  <td><span className={`badge ${d.severity==='error'?'b-err':'b-warn'}`}>{d.severity}</span></td>
                  <td className="text-xs">{d.field}</td>
                  <td className="text-xs">{typeof d.xmlValue==='number'? fmtMoney(d.xmlValue) : d.xmlValue}</td>
                  <td className="text-xs">{typeof d.regValue==='number'? fmtMoney(d.regValue) : d.regValue}</td>
                  <td className="num text-xs">{d.difference != null ? fmtMoney(d.difference) : '—'}</td>
                  <td className="text-xs">{d.description}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    )}
  </div>
);


/* =========================================================================
   ERRORI — Report errori esportabile
========================================================================= */
const ErroriSection = ({ errorReport, setErrorReport }) => {
  const [filterSev, setFilterSev] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterType, setFilterType] = useState('all');
  const [search, setSearch] = useState('');

  const errorTypes = useMemo(() => {
    const s = new Set();
    errorReport.forEach(e => s.add(e.errorType));
    return Array.from(s).sort();
  }, [errorReport]);

  const filtered = useMemo(() => {
    return errorReport.filter(e => {
      if (filterSev !== 'all' && e.severity !== filterSev) return false;
      if (filterStatus !== 'all' && e.status !== filterStatus) return false;
      if (filterType !== 'all' && e.errorType !== filterType) return false;
      if (search) {
        const q = search.toLowerCase();
        const blob = `${e.documentNumber} ${e.supplier} ${e.description} ${e.suggestedAction} ${e.userNote}`.toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
  }, [errorReport, filterSev, filterStatus, filterType, search]);

  const counts = useMemo(() => ({
    total: errorReport.length,
    error: errorReport.filter(e => e.severity === 'error').length,
    warning: errorReport.filter(e => e.severity === 'warning').length,
    review: errorReport.filter(e => e.severity === 'review').length,
    open: errorReport.filter(e => e.status === 'open').length,
    inProgress: errorReport.filter(e => e.status === 'in-progress').length,
    resolved: errorReport.filter(e => e.status === 'resolved').length,
  }), [errorReport]);

  const updateItem = (id, patch) => {
    setErrorReport(prev => prev.map(e => e.id === id ? { ...e, ...patch } : e));
  };

  const exportXlsx = () => {
    if (!filtered.length) return;
    const rows = filtered.map(e => ({
      'Severità': e.severity,
      'Tipo errore': e.errorType,
      'Stato': e.status,
      'Documento N.': e.documentNumber,
      'Data': e.documentDate,
      'Fornitore/Cliente': e.supplier,
      'P.IVA': e.supplierVat,
      'File XML': e.sourceFile,
      'Valore XML': e.xmlValue,
      'Valore Registro': e.registerValue,
      'Differenza': e.difference,
      'Descrizione': e.description,
      'Azione suggerita': e.suggestedAction,
      'Note utente': e.userNote || '',
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.min(40, Math.max(12, k.length + 4)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report Errori');
    XLSX.writeFile(wb, `report_errori_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  if (!errorReport.length) {
    return (
      <div className="grid-12">
        <div className="col-span-12">
          <h2 className="serif text-3xl mb-1">Report errori</h2>
          <p className="text-sm" style={{color:'var(--ink-3)'}}>Esegui prima una riconciliazione nella sezione Controlli per popolare il report errori.</p>
        </div>
        <div className="col-span-12 card p-12 text-center" style={{background:'var(--bg-2)'}}>
          <div className="stamp inline-block mx-auto mb-4">Nessun errore</div>
          <p className="text-sm" style={{color:'var(--ink-3)'}}>Importa i registri IVA, lancia la riconciliazione e i problemi rilevati appariranno qui.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="grid-12">
      <div className="col-span-12 flex items-end justify-between gap-4 flex-wrap">
        <div>
          <h2 className="serif text-3xl mb-1">Report errori</h2>
          <p className="text-sm" style={{color:'var(--ink-3)'}}>{filtered.length} di {errorReport.length} segnalazioni · gestisci stato e note</p>
        </div>
        <div className="flex gap-2 items-center">
          <button className="btn" onClick={exportXlsx} disabled={!filtered.length}>
            <Icon name="download" size={14}/> Esporta Excel
          </button>
        </div>
      </div>

      <div className="col-span-12 grid grid-cols-7 gap-2">
        <button onClick={()=>{setFilterSev('all'); setFilterStatus('all');}} className={`kpi-card text-left ${filterSev==='all'&&filterStatus==='all'?'ring-2':''}`} style={{ringColor:'var(--accent)'}}>
          <div className="label">Totali</div>

                <td className="text-xs">
