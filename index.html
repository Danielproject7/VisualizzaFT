  useEffect(() => {
    if (adeLoaded && !visibleCols.includes('dataRicezione')) {
      setVisibleCols(prev => ['dataRicezione', ...prev]);
    }
  }, [adeLoaded]);
  const [search, setSearch] = useState('');
  const [filterSupplier, setFilterSupplier] = useState('');
  const [filterCustomer, setFilterCustomer] = useState('');
  const [filterTipo, setFilterTipo] = useState('');
  const [filterAliq, setFilterAliq] = useState('');
  const [filterNat, setFilterNat] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [sortBy, setSortBy] = useState(() => adeLoaded
    ? { col:'dataRicezione', dir:'desc' }
    : { col:'dataDocumento', dir:'asc' });
  // When the AdE list becomes available later, switch the default sort once
  useEffect(() => {
    if (adeLoaded && sortBy.col === 'dataDocumento') setSortBy({ col:'dataRicezione', dir:'desc' });
  }, [adeLoaded]);
  const [showColPicker, setShowColPicker] = useState(false);
  const [showDisplay, setShowDisplay] = useState(false);

  // Display settings (persisted)
  const [fontFamily, setFontFamily] = useState(() => localStorage.getItem('vx_analitico_font') || 'Manrope');
  const [fontSize, setFontSize] = useState(() => parseInt(localStorage.getItem('vx_analitico_fsize') || '13'));
  const [headerFontFamily, setHeaderFontFamily] = useState(() => localStorage.getItem('vx_analitico_hfont') || 'Manrope');
  const [headerFontSize, setHeaderFontSize] = useState(() => parseInt(localStorage.getItem('vx_analitico_hfsize') || '11'));
  const [wrapMode, setWrapMode] = useState(() => localStorage.getItem('vx_analitico_wrap') || 'nowrap'); // 'wrap' | 'nowrap'
  const [compact, setCompact] = useState(() => localStorage.getItem('vx_analitico_compact') === '1');
  const [colWidths, setColWidths] = useState(() => loadJSON('vx_analitico_widths', {}));
  const [freezeCols, setFreezeCols] = useState(() => parseInt(localStorage.getItem('vx_analitico_freeze') || '0'));
  const [groupByInvoice, setGroupByInvoice] = useState(() => localStorage.getItem('vx_analitico_group') === '1');
  const [pdfPopup, setPdfPopup] = useState(null); // invoice currently shown in popup

  useEffect(() => { localStorage.setItem('vx_analitico_cols', JSON.stringify(visibleCols)); }, [visibleCols]);
  useEffect(() => { localStorage.setItem('vx_analitico_font', fontFamily); }, [fontFamily]);
  useEffect(() => { localStorage.setItem('vx_analitico_fsize', String(fontSize)); }, [fontSize]);
  useEffect(() => { localStorage.setItem('vx_analitico_hfont', headerFontFamily); }, [headerFontFamily]);
  useEffect(() => { localStorage.setItem('vx_analitico_hfsize', String(headerFontSize)); }, [headerFontSize]);
  useEffect(() => { localStorage.setItem('vx_analitico_wrap', wrapMode); }, [wrapMode]);
  useEffect(() => { localStorage.setItem('vx_analitico_compact', compact ? '1' : '0'); }, [compact]);
  useEffect(() => { localStorage.setItem('vx_analitico_widths', JSON.stringify(colWidths)); }, [colWidths]);
  useEffect(() => { localStorage.setItem('vx_analitico_freeze', String(freezeCols)); }, [freezeCols]);
  useEffect(() => { localStorage.setItem('vx_analitico_group', groupByInvoice ? '1' : '0'); }, [groupByInvoice]);

  const widthFor = (col) => colWidths[col.id] || col.width;

  const startColResize = (e, col) => {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX;
    const startW = widthFor(col);
    const target = e.currentTarget;
    target.classList.add('dragging');
    const onMove = (ev) => {
      const w = Math.max(40, startW + (ev.clientX - startX));
      setColWidths(prev => ({ ...prev, [col.id]: w }));
    };
    const onUp = () => {
      target.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const suppliers = useMemo(() => [...new Set(allLines.map(r => r.supplierName).filter(Boolean))].sort(), [allLines]);
  const customers = useMemo(() => [...new Set(allLines.map(r => r.customerName).filter(Boolean))].sort(), [allLines]);
  const tipi = useMemo(() => [...new Set(allLines.map(r => r.tipoDocumento).filter(Boolean))].sort(), [allLines]);
  const aliquote = useMemo(() => [...new Set(allLines.map(r => r.aliquotaIVARiep).filter(v => v != null))].sort((a,b)=>a-b), [allLines]);
  const nature = useMemo(() => [...new Set(allLines.map(r => r.naturaRiep).filter(Boolean))].sort(), [allLines]);

  const filtered = useMemo(() => {
    let rows = allLines;
    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(r =>
        Object.values(r).some(v => v != null && typeof v !== 'object' && String(v).toLowerCase().includes(q))
      );
    }
    if (filterSupplier) rows = rows.filter(r => r.supplierName === filterSupplier);
    if (filterCustomer) rows = rows.filter(r => r.customerName === filterCustomer);
    if (filterTipo) rows = rows.filter(r => r.tipoDocumento === filterTipo);
    if (filterAliq !== '') rows = rows.filter(r => String(r.aliquotaIVARiep) === filterAliq);
    if (filterNat) rows = rows.filter(r => r.naturaRiep === filterNat);
    if (dateFrom) rows = rows.filter(r => r.dataDocumento && r.dataDocumento >= dateFrom);
    if (dateTo)   rows = rows.filter(r => r.dataDocumento && r.dataDocumento <= dateTo);

    const col = ANALITICO_COLUMNS.find(c => c.id === sortBy.col);
    if (col) {
      rows = [...rows].sort((a, b) => {
        const va = col.getter(a), vb = col.getter(b);
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        let cmp;
        if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
        else cmp = String(va).localeCompare(String(vb), 'it', {numeric:true});
        return sortBy.dir === 'asc' ? cmp : -cmp;
      });
    }
    return rows;
  }, [allLines, search, filterSupplier, filterCustomer, filterTipo, filterAliq, filterNat, dateFrom, dateTo, sortBy]);

  const totals = useMemo(() => ({
    imponibile: filtered.reduce((s,r) => s+(r.imponibileRiep||0), 0),
    imposta: filtered.reduce((s,r) => s+(r.impostaRiep||0), 0),
  }), [filtered]);

  const exportExcel = () => {
    const cols = ANALITICO_COLUMNS.filter(c => visibleCols.includes(c.id));
    const data = filtered.map(r => {
      const obj = {};
      cols.forEach(c => {
        const v = c.getter(r);
        obj[c.label] = (c.type === 'date') ? fmtDate(v) : v;
      });
      return obj;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Analitico');
    XLSX.writeFile(wb, `analitico_fatture_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  const renderCell = (r, col) => {
    const v = col.getter(r);
    if (v == null || v === '') return <span style={{ color:'var(--ink-3)' }}>—</span>;
    if (col.type === 'money') return <span className="num">{fmtMoney(v)}</span>;
    if (col.type === 'pct') {
      const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
      return <span className="num">{isNaN(n) ? v : fmtNum(n,2)+'%'}</span>;
    }
    if (col.type === 'num') {
      const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
      return <span className="num">{isNaN(n) ? v : fmtNum(n,2)}</span>;
    }
    if (col.type === 'int') {
      const n = typeof v === 'number' ? v : parseInt(String(v), 10);
      return <span className="num">{isNaN(n) ? v : fmtNum(n,0)}</span>;
    }
    if (col.type === 'date') return <span>{fmtDate(v)}</span>;
    return <span>{v}</span>;
  };

  if (allLines.length === 0) {
    return (
      <div className="px-10 py-8">
        <h1 className="text-4xl font-serif font-medium tracking-tight mb-6">Database analitico</h1>
        <div className="card p-12 text-center">
          <Icon name="table" size={32} className="mx-auto mb-3" />
          <p style={{ color:'var(--ink-3)' }}>Nessuna riga analitica. Carica prima i file XML.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="px-10 py-8 h-full flex flex-col">
      <div className="flex items-baseline justify-between mb-2">
        <h1 className="text-4xl font-serif font-medium tracking-tight">Database analitico</h1>
        <div className="text-sm" style={{ color:'var(--ink-3)' }}>
          <span className="num">{fmtNum(filtered.length, 0)}</span> righe · imponibile <span className="num font-semibold">{fmtMoney(totals.imponibile)}</span> · IVA <span className="num font-semibold">{fmtMoney(totals.imposta)}</span>
        </div>
      </div>
      <p className="text-sm mb-6" style={{ color:'var(--ink-3)' }}>
        Una riga per ogni combinazione fattura · riga di dettaglio · articolo IVA / riepilogo IVA.
      </p>

      {/* Filters */}
      <div className="card p-4 mb-4">
        <div className="grid grid-cols-12 gap-3">
          <div className="col-span-3">
            <label className="label block mb-1">Ricerca</label>
            <div className="relative">
              <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color:'var(--ink-3)' }}/>
              <input className="input pl-9" placeholder="testo libero..." value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
          </div>
          <div className="col-span-2">
            <label className="label block mb-1">Fornitore</label>
            <select className="input" value={filterSupplier} onChange={e=>setFilterSupplier(e.target.value)}>
              <option value="">Tutti</option>
              {suppliers.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="col-span-2">
            <label className="label block mb-1">Cliente</label>
            <select className="input" value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)}>
              <option value="">Tutti</option>
              {customers.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="col-span-1">
            <label className="label block mb-1">Tipo</label>
            <select className="input" value={filterTipo} onChange={e=>setFilterTipo(e.target.value)}>
              <option value="">—</option>
              {tipi.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="col-span-1">
            <label className="label block mb-1">Aliquota</label>
            <select className="input" value={filterAliq} onChange={e=>setFilterAliq(e.target.value)}>
              <option value="">—</option>
              {aliquote.map(s => <option key={s} value={s}>{s}%</option>)}
            </select>
          </div>
          <div className="col-span-1">
            <label className="label block mb-1">Natura</label>
            <select className="input" value={filterNat} onChange={e=>setFilterNat(e.target.value)}>
              <option value="">—</option>
              {nature.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="col-span-1">
            <label className="label block mb-1">Da</label>
            <input type="date" className="input" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
          </div>
          <div className="col-span-1">
            <label className="label block mb-1">A</label>
            <input type="date" className="input" value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
          </div>
        </div>
        <div className="flex justify-between items-center mt-4 pt-3 border-t" style={{ borderColor:'var(--line-2)' }}>
          <div className="flex gap-2 flex-wrap">
            <button className="btn btn-secondary" onClick={()=>setShowColPicker(true)}>
              <Icon name="grid" size={13}/> Colonne ({visibleCols.length}/{ANALITICO_COLUMNS.length})
            </button>
            <button className="btn btn-secondary" onClick={()=>setShowDisplay(true)}>
              <Icon name="settings" size={13}/> Visualizzazione
            </button>
            <button className="btn btn-secondary" onClick={()=>{
              setSearch(''); setFilterSupplier(''); setFilterCustomer(''); setFilterTipo('');
              setFilterAliq(''); setFilterNat(''); setDateFrom(''); setDateTo('');
            }}>
              <Icon name="x" size={13}/> Reset filtri
            </button>
            <button className="btn btn-secondary" onClick={()=>setColWidths({})} title="Ripristina larghezze colonne predefinite">
              <Icon name="refresh" size={13}/> Reset larghezze
            </button>
          </div>
          <button className="btn btn-primary" onClick={exportExcel}>
            <Icon name="download" size={13}/> Esporta Excel ({fmtNum(filtered.length, 0)})
          </button>
        </div>
      </div>

      {/* Column picker modal */}
      {showColPicker && (
        <div className="modal-bg" onClick={()=>setShowColPicker(false)}>
          <div className="modal w-[720px]" onClick={e=>e.stopPropagation()}>
            <div className="px-5 py-4 border-b flex items-center justify-between" style={{ borderColor:'var(--line)' }}>
              <h3 className="font-serif text-xl">Configura colonne</h3>
              <button className="btn btn-ghost" onClick={()=>setShowColPicker(false)}><Icon name="x" size={14}/></button>
            </div>
            <div className="p-5">
              <div className="flex gap-2 mb-4 flex-wrap">
                <button className="btn btn-secondary text-xs" onClick={()=>setVisibleCols(ANALITICO_COLUMNS.map(c=>c.id))}>Tutte ({ANALITICO_COLUMNS.length})</button>
                <button className="btn btn-secondary text-xs" onClick={()=>setVisibleCols(ANALITICO_DEFAULT)}>Predefinite</button>
                <button className="btn btn-secondary text-xs" onClick={()=>setVisibleCols([])}>Nessuna</button>
              </div>
              {(() => {
                const groups = {};
                ANALITICO_COLUMNS.forEach(c => { const g = c.group || 'Altro'; (groups[g] = groups[g] || []).push(c); });
                return Object.entries(groups).map(([gName, cols]) => {
                  const allOn = cols.every(c => visibleCols.includes(c.id));
                  return (
                    <div key={gName} className="mb-4">
                      <div className="flex items-center justify-between mb-2 pb-1 border-b" style={{ borderColor:'var(--line-2)' }}>
                        <span className="small-cap text-xs font-semibold" style={{color:'var(--ink-2)'}}>{gName}</span>
                        <button className="text-[11px] underline" style={{color:'var(--ink-3)'}}
                                onClick={()=>{
                                  const ids = cols.map(c=>c.id);
                                  setVisibleCols(prev => allOn ? prev.filter(x=>!ids.includes(x)) : [...new Set([...prev, ...ids])]);
                                }}>
                          {allOn ? 'Deseleziona gruppo' : 'Seleziona gruppo'}
                        </button>
                      </div>
                      <div className="grid grid-cols-2 gap-1">
                        {cols.map(c => {
                          const checked = visibleCols.includes(c.id);
                          return (
                            <label key={c.id} className="flex items-center gap-2 p-2 rounded hover:bg-stone-100 cursor-pointer">
                              <input type="checkbox" checked={checked} onChange={()=>{
                                setVisibleCols(prev => checked ? prev.filter(x=>x!==c.id) : [...prev, c.id]);
                              }}/>
                              <span className="text-sm">{c.label}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          </div>
        </div>
      )}

      {/* Display settings modal */}
      {showDisplay && (
        <div className="modal-bg" onClick={()=>setShowDisplay(false)}>
          <div className="modal w-[480px]" onClick={e=>e.stopPropagation()}>
            <div className="px-5 py-4 border-b flex items-center justify-between" style={{ borderColor:'var(--line)' }}>
              <h3 className="font-serif text-xl">Visualizzazione tabella</h3>
              <button className="btn btn-ghost" onClick={()=>setShowDisplay(false)}><Icon name="x" size={14}/></button>
            </div>
            <div className="p-5 space-y-4 max-h-[80vh] overflow-auto">
              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Celle / contenuto</div>
                <label className="label block mb-1">Carattere</label>
                <select className="input mb-3" value={fontFamily} onChange={e=>setFontFamily(e.target.value)}>
                  {ANALITICO_FONTS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
                <label className="label block mb-1">Dimensione: <span className="num">{fontSize}px</span></label>
                <input type="range" min="10" max="22" step="1" value={fontSize}
                       onChange={e=>setFontSize(parseInt(e.target.value))} className="w-full"/>
              </div>

              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Intestazioni colonna</div>
                <label className="label block mb-1">Carattere intestazioni</label>
                <select className="input mb-3" value={headerFontFamily} onChange={e=>setHeaderFontFamily(e.target.value)}>
                  {ANALITICO_FONTS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
                <label className="label block mb-1">Dimensione intestazioni: <span className="num">{headerFontSize}px</span></label>
                <input type="range" min="9" max="20" step="1" value={headerFontSize}
                       onChange={e=>setHeaderFontSize(parseInt(e.target.value))} className="w-full"/>
              </div>

              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Layout</div>
                <label className="label block mb-2">Andata a capo righe</label>
                <div className="flex gap-2 mb-3">
                  <button className={`btn ${wrapMode==='nowrap' ? 'btn-primary':'btn-secondary'} flex-1`} onClick={()=>setWrapMode('nowrap')}>
                    Una riga (tronca)
                  </button>
                  <button className={`btn ${wrapMode==='wrap' ? 'btn-primary':'btn-secondary'} flex-1`} onClick={()=>setWrapMode('wrap')}>
                    A capo automatico
                  </button>
                </div>
                <label className="flex items-center gap-2 cursor-pointer mb-2">
                  <input type="checkbox" checked={compact} onChange={e=>setCompact(e.target.checked)}/>
                  <span className="text-sm">Densità compatta</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={groupByInvoice} onChange={e=>setGroupByInvoice(e.target.checked)}/>
                  <span className="text-sm">Raggruppa righe per fattura (con separatore)</span>
                </label>
              </div>

              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Blocca riquadri</div>
                <p className="text-[11px] mb-2" style={{color:'var(--ink-3)'}}>L'intestazione resta sempre visibile durante lo scorrimento. Scegli quante colonne a sinistra restano fisse durante lo scorrimento orizzontale.</p>
                <label className="label block mb-1">Colonne fisse a sinistra: <span className="num">{freezeCols}</span></label>
                <input type="range" min="0" max="6" step="1" value={freezeCols}
                       onChange={e=>setFreezeCols(parseInt(e.target.value))} className="w-full"/>
                <div className="flex justify-between text-[10px]" style={{color:'var(--ink-3)'}}>
                  <span>0</span><span>6</span>
                </div>
              </div>

              <div className="pt-1">
                <button className="btn btn-secondary text-xs w-full" onClick={()=>{
                  setFontFamily('Manrope'); setFontSize(13);
                  setHeaderFontFamily('Manrope'); setHeaderFontSize(11);
                  setWrapMode('nowrap'); setCompact(false); setColWidths({});
                  setFreezeCols(0); setGroupByInvoice(false);
                }}>
                  <Icon name="refresh" size={12}/> Ripristina valori predefiniti
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* PDF popup */}
      {pdfPopup && (
        <AnaliticoPdfPopup invoice={pdfPopup} onClose={()=>setPdfPopup(null)}/>
      )}

      {/* Table */}
      {(() => {
        const shownCols = ANALITICO_COLUMNS.filter(c => visibleCols.includes(c.id));
        const fz = Math.min(freezeCols, shownCols.length);
        const leftOffsets = [];
        let acc = 0;
        for (let i = 0; i < fz; i++) {
          leftOffsets.push(acc);
          acc += widthFor(shownCols[i]);
        }
        const headerHeight = Math.max(28, Math.round(headerFontSize * 2.6));
        const rowsToShow = filtered.slice(0, 1000);
        const renderTbody = () => {
          if (!groupByInvoice) {
            return rowsToShow.map((r, i) => (
              <tr key={i} className="hover-row">
                {shownCols.map((col, ci) => {
                  const isFz = ci < fz;
                  return (
                    <td key={col.id}
                        className={isFz ? `freeze${ci===fz-1?' freeze-last':''}` : ''}
                        style={isFz ? { left: leftOffsets[ci]+'px' } : undefined}>
                      {renderCell(r, col)}
                    </td>
                  );
                })}
                <td>
                  <button className="btn btn-ghost" style={{padding:'2px 4px'}} onClick={()=>setPdfPopup(r.invoice)} title="Anteprima fattura">
                    <Icon name="eye" size={12}/>
                  </button>
                </td>
              </tr>
            ));
          }
          // Group by invoice id
          const groups = [];
          const byId = {};
          rowsToShow.forEach(r => {
            const k = r.invoice?.id || (r.sourceFileName + '|' + r.numeroDocumento);
            if (!byId[k]) { byId[k] = { invoice: r.invoice, key: k, rows: [] }; groups.push(byId[k]); }
            byId[k].rows.push(r);
          });
          const out = [];
          groups.forEach((g, gi) => {
            const inv = g.invoice || {};
            const totalCols = shownCols.length + 1;
            const groupTotImp = g.rows.reduce((s,r)=>s+(r.imponibileRiep||0),0);
            const groupTotIva = g.rows.reduce((s,r)=>s+(r.impostaRiep||0),0);
            out.push(
              <tr key={`g-${g.key}`} className="invoice-group-row">
                <td colSpan={totalCols}>
                  <div className="flex items-center gap-3 flex-wrap">
                    <span className="badge b-info">{inv.tipoDocumento || '—'}</span>
                    <span className="font-semibold">{inv.numeroDocumento || '—'}</span>
                    <span style={{color:'var(--ink-3)'}}>{fmtDate(inv.dataDocumento)}</span>
                    <span>·</span>
                    <span className="font-semibold">{inv.supplierName || '—'}</span>
                    <span style={{color:'var(--ink-3)'}}>{inv.supplierVat || ''}</span>
                    <span className="ml-auto text-xs" style={{color:'var(--ink-3)'}}>
                      {fmtNum(g.rows.length, 0)} righe · imp. <span className="num font-semibold">{fmtMoney(groupTotImp)}</span> · IVA <span className="num font-semibold">{fmtMoney(groupTotIva)}</span> · totale <span className="num font-semibold" style={{color:'var(--accent)'}}>{fmtMoney(inv.totaleDocumento)}</span>
                    </span>
                    <button className="btn btn-ghost" style={{padding:'2px 6px'}} onClick={()=>setPdfPopup(inv)} title="Anteprima fattura">
                      <Icon name="eye" size={13}/>
                    </button>
                  </div>
                </td>
              </tr>
            );
            g.rows.forEach((r, i) => {
              out.push(
                <tr key={`r-${g.key}-${i}`} className="hover-row">
                  {shownCols.map((col, ci) => {
                    const isFz = ci < fz;
                    return (
                      <td key={col.id}
                          className={isFz ? `freeze${ci===fz-1?' freeze-last':''}` : ''}
                          style={isFz ? { left: leftOffsets[ci]+'px' } : undefined}>
                        {renderCell(r, col)}
                      </td>
                    );
                  })}
                  <td>
                    <button className="btn btn-ghost" style={{padding:'2px 4px'}} onClick={()=>setPdfPopup(r.invoice)} title="Anteprima fattura">
                      <Icon name="eye" size={12}/>
                    </button>
                  </td>
                </tr>
              );
            });
            if (gi < groups.length - 1) {
              out.push(<tr key={`e-${g.key}`} className="invoice-end-row"><td colSpan={totalCols}></td></tr>);
            }
          });
          return out;
        };
        return (
          <div className="card flex-1 overflow-auto min-h-[400px] analitico-wrapper"
               style={{ fontFamily: `'${fontFamily}', system-ui, sans-serif`, fontSize: fontSize+'px', '--head-offset': headerHeight+'px' }}>
            <table className={`data-table ${wrapMode==='wrap' ? 'wrap-cells' : 'nowrap-cells'} ${compact ? 'compact':''}`}
                   style={{ tableLayout: 'fixed' }}>
              <colgroup>
                {shownCols.map(col => (
                  <col key={col.id} style={{ width: widthFor(col)+'px' }}/>
                ))}
                <col style={{ width: 60 }}/>
              </colgroup>
              <thead>
                <tr>
                  {shownCols.map((col, ci) => {
                    const isFz = ci < fz;
                    return (
                      <th key={col.id}
                          style={{
                            width: widthFor(col)+'px',
                            fontFamily: `'${headerFontFamily}', system-ui, sans-serif`,
                            fontSize: headerFontSize+'px',
                            ...(isFz ? { left: leftOffsets[ci]+'px' } : {})
                          }}
                          className={`cursor-pointer select-none${isFz ? ` freeze${ci===fz-1?' freeze-last':''}` : ''}`}>
                        <div className="flex items-center gap-1"
                             onClick={()=>setSortBy(prev => ({
                               col: col.id,
                               dir: prev.col === col.id && prev.dir === 'asc' ? 'desc' : 'asc'
                             }))}>
                          {col.label}
                          {sortBy.col === col.id && (
                            <span style={{fontSize:'0.8em'}}>{sortBy.dir === 'asc' ? '▲' : '▼'}</span>
                          )}
                        </div>
                        <div className="col-resizer" onMouseDown={(e)=>startColResize(e, col)} title="Trascina per ridimensionare"></div>
                      </th>
                    );
                  })}
                  <th style={{width:60, fontFamily: `'${headerFontFamily}', system-ui, sans-serif`, fontSize: headerFontSize+'px'}}></th>
                </tr>
              </thead>
              <tbody>
                {renderTbody()}
                {filtered.length > 1000 && (
                  <tr><td colSpan={shownCols.length+1} className="text-center italic" style={{color:'var(--ink-3)'}}>
                    ... visualizzate prime 1000 righe su {fmtNum(filtered.length, 0)}. Esporta in Excel per il dataset completo.
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        );
      })()}
    </div>
  );
};

/* PDF popup used inside Database analitico (and other tables) */
const AnaliticoPdfPopup = ({ invoice, onClose }) => {
  const [url, setUrl] = useState(null);
  const [busy, setBusy] = useState(true);
  const [source, setSource] = useState(null);
  const urlRef = useRef(null);
  useEffect(() => {
    setBusy(true);
    setUrl(null);
    const t = setTimeout(() => {
      try {
        const att = findEmbeddedPdf(invoice);
        let blob = null;
        if (att && att.attachment) {
          blob = base64ToBlob(att.attachment, 'application/pdf');
          if (blob) setSource('embedded');
        }
        if (!blob) {
          blob = generatePdfFromInvoice(invoice);
          setSource('generated');
        }
        const u = URL.createObjectURL(blob);
        urlRef.current = u;
        setUrl(u);
      } catch (e) {
        console.error(e);
      } finally {
        setBusy(false);
      }
    }, 30);
    return () => { clearTimeout(t); if (urlRef.current) { URL.revokeObjectURL(urlRef.current); urlRef.current = null; } };
  }, [invoice && invoice.id]);

  const downloadPdf = () => {
    if (!url) return;
    const safe = (s) => (s || '').toString().replace(/[^\w\-]+/g, '_').slice(0, 60);
    const supplier = safe(invoice.supplierName || (invoice.cedente && invoice.cedente.denominazione));
    const num = safe(invoice.numeroDocumento || invoice.numero);
    const a = document.createElement('a');
    a.href = url; a.download = `${supplier || 'fattura'}_${num || 'doc'}.pdf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{ width: '90vw', height: '90vh', display:'flex', flexDirection:'column' }} onClick={e=>e.stopPropagation()}>
        <div className="px-5 py-3 border-b flex items-center justify-between gap-3" style={{ borderColor:'var(--line)' }}>
          <div className="min-w-0">
            <div className="font-serif text-lg truncate">
              {tipoDocLabel(invoice.tipoDocumento)} · {invoice.numeroDocumento || '—'} · {fmtDate(invoice.dataDocumento)}
            </div>
            <div className="text-xs truncate" style={{color:'var(--ink-3)'}}>
              {invoice.supplierName || '—'} {invoice.supplierVat ? `· ${invoice.supplierVat}` : ''}
              {source === 'generated' && <span className="ml-2 badge b-warn">PDF generato</span>}
              {source === 'embedded' && <span className="ml-2 badge b-info">PDF originale</span>}
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button className="btn btn-secondary" onClick={downloadPdf} disabled={!url}>
              <Icon name="download" size={13}/> Scarica
            </button>
            <button className="btn btn-ghost" onClick={onClose} title="Chiudi">
              <Icon name="x" size={16}/>
            </button>
          </div>
        </div>
        <div className="flex-1" style={{ background:'#525659' }}>
          {busy && (
            <div className="flex items-center justify-center h-full text-white">
              <div className="text-center">
                <Icon name="refresh" size={32} className="pulse"/>
                <div className="mt-2 text-sm">Generazione PDF...</div>
              </div>
            </div>
          )}
          {!busy && url && (
            <iframe src={url} title="Anteprima fattura" style={{width:'100%', height:'100%', border:'none'}}/>
          )}
          {!busy && !url && (
            <div className="flex items-center justify-center h-full text-white">
              <div className="text-center">
                <Icon name="alert" size={32}/>
                <div className="mt-2 text-sm">Anteprima non disponibile</div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

];
const DOCUMENTI_DEFAULT = ['tipoDocumento','numeroDocumento','dataDocumento','supplierName','customerName','taxableAmountTotal','vatAmountTotal','totaleDocumento','aliquote','status'];

const DocumentiSection = ({ invoices, adeLoaded=false, setPdfTarget }) => {
  const [search, setSearch] = useState('');
  const [filterTipo, setFilterTipo] = useState('');
  const [filterSupplier, setFilterSupplier] = useState('');
  const [filterCustomer, setFilterCustomer] = useState('');
  const [filterAliquota, setFilterAliquota] = useState('');
  const [filterNatura, setFilterNatura] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [amountMin, setAmountMin] = useState('');
  const [amountMax, setAmountMax] = useState('');
  const [sortBy, setSortBy] = useState(() => adeLoaded
    ? { col:'dataRicezione', dir:'desc' }
    : { col:'dataDocumento', dir:'desc' });
  useEffect(() => {
    if (adeLoaded && sortBy.col === 'dataDocumento') setSortBy({ col:'dataRicezione', dir:'desc' });
  }, [adeLoaded]);
  const [expanded, setExpanded] = useState({});
  const [visibleCols, setVisibleCols] = useState(() => {
    const stored = loadJSON('vx_doc_cols', null);
    if (stored) return stored;
    // Default: include dataRicezione first if AdE is loaded on first render
    return adeLoaded ? ['dataRicezione', ...DOCUMENTI_DEFAULT] : DOCUMENTI_DEFAULT;
  });
  // When AdE becomes loaded later, ensure dataRicezione column is shown
  useEffect(() => {
    if (adeLoaded && !visibleCols.includes('dataRicezione')) {
      setVisibleCols(prev => ['dataRicezione', ...prev]);
    }
  }, [adeLoaded]);
  const [showColPicker, setShowColPicker] = useState(false);
  const [showAdvFilters, setShowAdvFilters] = useState(false);
  const [showDisplay, setShowDisplay] = useState(false);

  // Display settings (persisted, independent from Analitico)
  const [fontFamily, setFontFamily] = useState(() => localStorage.getItem('vx_doc_font') || 'Manrope');
  const [fontSize, setFontSize] = useState(() => parseInt(localStorage.getItem('vx_doc_fsize') || '12'));
  const [headerFontFamily, setHeaderFontFamily] = useState(() => localStorage.getItem('vx_doc_hfont') || 'Manrope');
  const [headerFontSize, setHeaderFontSize] = useState(() => parseInt(localStorage.getItem('vx_doc_hfsize') || '11'));
  const [wrapMode, setWrapMode] = useState(() => localStorage.getItem('vx_doc_wrap') || 'nowrap');
  const [compact, setCompact] = useState(() => {
    const v = localStorage.getItem('vx_doc_compact');
    return v == null ? true : v === '1'; // default ON for max info density
  });
  const [colWidths, setColWidths] = useState(() => loadJSON('vx_doc_widths', {}));
  const [freezeCols, setFreezeCols] = useState(() => parseInt(localStorage.getItem('vx_doc_freeze') || '3'));
  const [pdfPopup, setPdfPopup] = useState(null);
  // Color customization
  const [detailBg, setDetailBg] = useState(() => localStorage.getItem('vx_doc_detail_bg') || '#FBF5E8');
  const [detailAccent, setDetailAccent] = useState(() => localStorage.getItem('vx_doc_detail_accent') || '#B5462E');
  const [headerBg, setHeaderBg] = useState(() => localStorage.getItem('vx_doc_header_bg') || '#ECE7DA');
  const [zebra, setZebra] = useState(() => localStorage.getItem('vx_doc_zebra') === '1');
  const [zebraColor, setZebraColor] = useState(() => localStorage.getItem('vx_doc_zebra_color') || '#F2EDE0');
  const [filterCollapsed, setFilterCollapsed] = useState(() => localStorage.getItem('vx_doc_filter_collapsed') === '1');

  useEffect(() => { localStorage.setItem('vx_doc_cols', JSON.stringify(visibleCols)); }, [visibleCols]);
  useEffect(() => { localStorage.setItem('vx_doc_font', fontFamily); }, [fontFamily]);
  useEffect(() => { localStorage.setItem('vx_doc_fsize', String(fontSize)); }, [fontSize]);
  useEffect(() => { localStorage.setItem('vx_doc_hfont', headerFontFamily); }, [headerFontFamily]);
  useEffect(() => { localStorage.setItem('vx_doc_hfsize', String(headerFontSize)); }, [headerFontSize]);
  useEffect(() => { localStorage.setItem('vx_doc_wrap', wrapMode); }, [wrapMode]);
  useEffect(() => { localStorage.setItem('vx_doc_compact', compact ? '1' : '0'); }, [compact]);
  useEffect(() => { localStorage.setItem('vx_doc_widths', JSON.stringify(colWidths)); }, [colWidths]);
  useEffect(() => { localStorage.setItem('vx_doc_freeze', String(freezeCols)); }, [freezeCols]);
  useEffect(() => { localStorage.setItem('vx_doc_detail_bg', detailBg); }, [detailBg]);
  useEffect(() => { localStorage.setItem('vx_doc_detail_accent', detailAccent); }, [detailAccent]);
  useEffect(() => { localStorage.setItem('vx_doc_header_bg', headerBg); }, [headerBg]);
  useEffect(() => { localStorage.setItem('vx_doc_zebra', zebra ? '1' : '0'); }, [zebra]);
  useEffect(() => { localStorage.setItem('vx_doc_zebra_color', zebraColor); }, [zebraColor]);
  useEffect(() => { localStorage.setItem('vx_doc_filter_collapsed', filterCollapsed ? '1' : '0'); }, [filterCollapsed]);

  const widthFor = (col) => colWidths[col.id] || col.width;
  const startColResize = (e, col) => {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX;
    const startW = widthFor(col);
    const target = e.currentTarget;
    target.classList.add('dragging');
    const onMove = (ev) => {
      const w = Math.max(40, startW + (ev.clientX - startX));
      setColWidths(prev => ({ ...prev, [col.id]: w }));
    };
    const onUp = () => {
      target.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  // Pre-compute enriched rows with derived fields
  const enriched = useMemo(() => invoices.map(inv => ({
    ...inv,
    _aliquote: [...new Set(inv.summaries.map(s => s.aliquotaIVA).filter(v=>v!=null))].sort((a,b)=>a-b),
    _nature:   [...new Set(inv.summaries.map(s => s.natura).filter(Boolean))].sort(),
    _numRighe: inv.lines.length,
    _numArtIVA: inv.summaries.length,
  })), [invoices]);

  // Distinct option lists for the filter dropdowns
  const tipi = useMemo(() => [...new Set(enriched.map(r => r.tipoDocumento).filter(Boolean))].sort(), [enriched]);
  const suppliers = useMemo(() => [...new Set(enriched.map(r => r.supplierName).filter(Boolean))].sort(), [enriched]);
  const customers = useMemo(() => [...new Set(enriched.map(r => r.customerName).filter(Boolean))].sort(), [enriched]);
  const aliquote = useMemo(() => [...new Set(enriched.flatMap(r => r._aliquote))].sort((a,b)=>a-b), [enriched]);
  const nature   = useMemo(() => [...new Set(enriched.flatMap(r => r._nature))].sort(), [enriched]);

  const filtered = useMemo(() => {
    let rows = enriched;
    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(r =>
        (r.supplierName||'').toLowerCase().includes(q) ||
        (r.customerName||'').toLowerCase().includes(q) ||
        (r.numeroDocumento||'').toLowerCase().includes(q) ||
        (r.sourceFileName||'').toLowerCase().includes(q) ||
        (r.supplierVat||'').toLowerCase().includes(q) ||
        (r.customerVat||'').toLowerCase().includes(q) ||
        (r.causale||'').toLowerCase().includes(q)
      );
    }
    if (filterTipo)     rows = rows.filter(r => r.tipoDocumento === filterTipo);
    if (filterSupplier) rows = rows.filter(r => r.supplierName === filterSupplier);
    if (filterCustomer) rows = rows.filter(r => r.customerName === filterCustomer);
    if (filterAliquota !== '') rows = rows.filter(r => r._aliquote.includes(parseFloat(filterAliquota)));
    if (filterNatura)   rows = rows.filter(r => r._nature.includes(filterNatura));
    if (dateFrom)       rows = rows.filter(r => r.dataDocumento && r.dataDocumento >= dateFrom);
    if (dateTo)         rows = rows.filter(r => r.dataDocumento && r.dataDocumento <= dateTo);
    if (amountMin !== '') rows = rows.filter(r => (r.totaleDocumento||0) >= parseFloat(amountMin));
    if (amountMax !== '') rows = rows.filter(r => (r.totaleDocumento||0) <= parseFloat(amountMax));

    rows = [...rows].sort((a,b) => {
      const va = a[sortBy.col], vb = b[sortBy.col];
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      let cmp;
      if (typeof va === 'number') cmp = va - vb;
      else cmp = String(va).localeCompare(String(vb), 'it', {numeric:true});
      return sortBy.dir === 'asc' ? cmp : -cmp;
    });
    return rows;
  }, [enriched, search, filterTipo, filterSupplier, filterCustomer, filterAliquota, filterNatura, dateFrom, dateTo, amountMin, amountMax, sortBy]);

  const totals = useMemo(() => ({
    imponibile: filtered.reduce((s,r) => s+(r.taxableAmountTotal||0), 0),
    imposta: filtered.reduce((s,r) => s+(r.vatAmountTotal||0), 0),
    totale: filtered.reduce((s,r) => s+(r.totaleDocumento||0), 0),
  }), [filtered]);

  const activeFilters = (search?1:0) + (filterTipo?1:0) + (filterSupplier?1:0) + (filterCustomer?1:0)
    + (filterAliquota!==''?1:0) + (filterNatura?1:0)
    + (dateFrom?1:0) + (dateTo?1:0)
    + (amountMin!==''?1:0) + (amountMax!==''?1:0);

  const resetFilters = () => {
    setSearch(''); setFilterTipo(''); setFilterSupplier(''); setFilterCustomer('');
    setFilterAliquota(''); setFilterNatura('');
    setDateFrom(''); setDateTo(''); setAmountMin(''); setAmountMax('');
  };

  const toggleSort = (col) => {
    setSortBy(p => ({ col, dir: p.col===col && p.dir==='asc' ? 'desc' : (p.col===col ? 'asc' : 'desc') }));
  };

  const toggleCol = (id) => {
    setVisibleCols(prev => prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]);
  };
  const colIsVisible = (id) => visibleCols.includes(id);

  const exportExcel = () => {
    const data = filtered.map(inv => ({
      'Data ricezione': fmtDate(inv.dataRicezione),
      'Data trasmissione': fmtDate(inv.dataTrasmissione),
      'SDI/file': inv.sdiFileId,
      'Bollo virtuale': inv.bolloVirtuale ? 'Sì' : (inv.adeMatched ? 'No' : ''),
      'File XML': inv.sourceFileName,
      'Tipo doc.': inv.tipoDocumento,
      'Tipo doc. descrizione': tipoDocLabel(inv.tipoDocumento),
      'Numero': inv.numeroDocumento,
      'Data': fmtDate(inv.dataDocumento),
      'Fornitore': inv.supplierName,
      'P.IVA fornitore': inv.supplierVat,
      'CF fornitore': inv.supplierFiscalCode,
      'Cliente': inv.customerName,
      'P.IVA cliente': inv.customerVat,
      'CF cliente': inv.customerFiscalCode,
      'Imponibile totale': inv.taxableAmountTotal,
      'IVA totale': inv.vatAmountTotal,
      'Totale documento': inv.totaleDocumento,
      'N. righe': inv._numRighe,
      'N. articoli IVA': inv._numArtIVA,
      'Aliquote presenti': inv._aliquote.map(a=>a+'%').join(', '),
      'Nature presenti': inv._nature.join(', '),
      'Descrizione nature': inv._nature.map(n => `${n}: ${naturaLabel(n)}`).join(' | '),
      'CIG': inv.cig, 'CUP': inv.cup,
      'Causale': inv.causale,
      'Stato': inv.status,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Documenti');
    XLSX.writeFile(wb, `documenti_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  if (invoices.length === 0) {
    return (
      <div className="px-10 py-8">
        <h1 className="text-4xl font-serif font-medium tracking-tight mb-6">Documenti</h1>
        <div className="card p-12 text-center">
          <Icon name="layers" size={32} className="mx-auto mb-3" />
          <p style={{ color:'var(--ink-3)' }}>Nessun documento. Carica prima i file XML.</p>
        </div>
      </div>
    );
  }

  // Renders cell INNER content based on column kind. Wrapping <td> handled by caller.
  const renderCellInner = (col, inv) => {
    const v = col.getter(inv);
    switch (col.kind) {
      case 'badge':
        return <span className="badge b-info" title={tipoDocLabel(v)}>{v}</span>;
      case 'mono':
        return <span className="font-mono" title={v||''}>{v || '—'}</span>;
      case 'date':
        return <span>{fmtDate(v) || '—'}</span>;
      case 'text':
        return <span title={v||''}>{v || '—'}</span>;
      case 'num':
        return <span className="num">{v != null ? fmtNum(v,0) : '—'}</span>;
      case 'money':
        return <span className="num">{fmtMoney(v)}</span>;
      case 'money-bold':
        return <span className="num font-semibold" style={{color:'var(--accent)'}}>{fmtMoney(v)}</span>;
      case 'badges':
        return (
          <div className="flex gap-1 flex-wrap">
            {(v||[]).map((x,i) => <span key={i} className="badge b-mute" title={typeof x === 'string' ? naturaLabel(x) : ''}>{typeof x === 'number' ? x+'%' : x}</span>)}
          </div>
        );
      case 'status':
        return <span className="badge b-ok"><Icon name="check" size={10}/>{v}</span>;
      default:
        return <span>{v || '—'}</span>;
    }
  };
  const isMoneyKind = (k) => k === 'money' || k === 'money-bold';

  const visibleColObjs = DOCUMENTI_COLUMNS.filter(c => visibleCols.includes(c.id));

  return (
    <div className={`${filterCollapsed ? 'px-6 py-3' : 'px-10 py-6'} h-full flex flex-col`}>
      <div className="flex items-baseline justify-between mb-2 gap-3">
        <h1 className={`${filterCollapsed ? 'text-2xl' : 'text-4xl'} font-serif font-medium tracking-tight`}>Documenti</h1>
        <div className="text-sm flex items-center gap-3" style={{ color:'var(--ink-3)' }}>
          <span><span className="num">{fmtNum(filtered.length, 0)}</span> di <span className="num">{fmtNum(invoices.length, 0)}</span> documenti · totale <span className="num font-semibold" style={{color:'var(--accent)'}}>{fmtMoney(totals.totale)}</span></span>
          <button className="btn btn-ghost" style={{padding:'4px 8px'}}

            <Icon name={filterCollapsed ? 'chevdown' : 'chevright'} size={13}/>
            {filterCollapsed ? 'Mostra filtri' : 'Riduci filtri'}
          </button>

      {filterCollapsed ? (
        <div className="card px-3 py-2 mb-2 flex items-center justify-between gap-3 text-xs" style={{flexWrap:'wrap'}}>
          <div className="flex items-center gap-2 flex-wrap" style={{color:'var(--ink-3)'}}>
            {activeFilters > 0 ? (
              <><span className="badge b-info">{activeFilters} filtri</span>
                <span className="font-semibold">Imp. {fmtMoney(totals.imponibile)} · IVA {fmtMoney(totals.imposta)}</span></>
            ) : (<span>Nessun filtro attivo</span>)}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            {activeFilters > 0 && (
              <button className="btn btn-ghost" style={{padding:'3px 8px'}} onClick={resetFilters}>
                <Icon name="x" size={12}/> Pulisci
              </button>
            )}
            <button className="btn btn-ghost" style={{padding:'3px 8px'}} onClick={()=>setShowColPicker(s=>!s)}>
              <Icon name="grid" size={12}/> Colonne
            </button>
            <button className="btn btn-ghost" style={{padding:'3px 8px'}} onClick={()=>setShowDisplay(true)}>
              <Icon name="settings" size={12}/> Visualizzazione
            </button>
            <button className="btn btn-primary" style={{padding:'3px 8px'}} onClick={exportExcel}>
              <Icon name="download" size={12}/> Excel
            </button>
          </div>
        </div>
      ) : (
      <div className="card p-3 mb-3">
        <div className="grid grid-cols-12 gap-3 items-end">
          <div className="col-span-4">
            <label className="label block mb-1">Ricerca libera</label>
            <input className="input" placeholder="fornitore, cliente, n. doc, P.IVA, file…"
                   value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <div className="col-span-2">
            <label className="label block mb-1">Tipo documento</label>
            <select className="input" value={filterTipo} onChange={e=>setFilterTipo(e.target.value)}>
              <option value="">Tutti</option>
              {tipi.map(t => <option key={t} value={t}>{t} — {tipoDocLabel(t)}</option>)}
            </select>
          </div>
          <div className="col-span-2">
            <label className="label block mb-1">Data dal</label>
            <input type="date" className="input" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
          </div>
          <div className="col-span-2">
            <label className="label block mb-1">Data al</label>
            <input type="date" className="input" value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
          </div>
          <div className="col-span-2 flex gap-2 justify-end">
            <button className="btn btn-ghost" onClick={()=>setShowAdvFilters(s=>!s)}>
              <Icon name="filter" size={13}/> {showAdvFilters?'Nascondi':'Avanzati'}
            </button>
          </div>

          {showAdvFilters && (
            <Fragment>
              <div className="col-span-3">
                <label className="label block mb-1">Fornitore</label>
                <select className="input" value={filterSupplier} onChange={e=>setFilterSupplier(e.target.value)}>
                  <option value="">Tutti ({suppliers.length})</option>
                  {suppliers.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="col-span-3">
                <label className="label block mb-1">Cliente</label>
                <select className="input" value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)}>
                  <option value="">Tutti ({customers.length})</option>
                  {customers.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="col-span-2">
                <label className="label block mb-1">Aliquota</label>
                <select className="input" value={filterAliquota} onChange={e=>setFilterAliquota(e.target.value)}>
                  <option value="">Tutte</option>
                  {aliquote.map(a => <option key={a} value={a}>{a}%</option>)}
                </select>
              </div>
              <div className="col-span-2">
                <label className="label block mb-1">Natura</label>
                <select className="input" value={filterNatura} onChange={e=>setFilterNatura(e.target.value)}>
                  <option value="">Tutte</option>
                  {nature.map(n => <option key={n} value={n}>{n} — {naturaLabel(n).slice(0,40)}</option>)}
                </select>
              </div>
              <div className="col-span-1">
                <label className="label block mb-1">Tot. min</label>
                <input type="number" step="0.01" className="input" value={amountMin} onChange={e=>setAmountMin(e.target.value)}/>
              </div>
              <div className="col-span-1">
                <label className="label block mb-1">Tot. max</label>
                <input type="number" step="0.01" className="input" value={amountMax} onChange={e=>setAmountMax(e.target.value)}/>
              </div>
            </Fragment>
          )}

          <div className="col-span-12 flex items-center justify-between gap-3 pt-2 border-t" style={{borderColor:'var(--line)'}}>
            <div className="text-xs" style={{color:'var(--ink-3)'}}>
              {activeFilters > 0 ? (
                <span><span className="badge b-info">{activeFilters}</span> filtri attivi · <span className="font-semibold">Imponibile {fmtMoney(totals.imponibile)} · IVA {fmtMoney(totals.imposta)}</span></span>
              ) : (
                <span>Nessun filtro attivo</span>
              )}
            </div>
            <div className="flex gap-2 flex-wrap">
              {activeFilters > 0 && (
                <button className="btn btn-ghost" onClick={resetFilters}>
                  <Icon name="x" size={13}/> Pulisci filtri
                </button>
              )}
              <button className="btn btn-ghost" onClick={()=>setShowColPicker(s=>!s)}>
                <Icon name="grid" size={13}/> Colonne ({visibleCols.length}/{DOCUMENTI_COLUMNS.length})
              </button>
              <button className="btn btn-ghost" onClick={()=>setShowDisplay(true)}>
                <Icon name="settings" size={13}/> Visualizzazione
              </button>
              <button className="btn btn-ghost" onClick={()=>setColWidths({})} title="Ripristina larghezze colonne">
                <Icon name="refresh" size={13}/> Reset larghezze
              </button>
              <button className="btn btn-primary" onClick={exportExcel}>
                <Icon name="download" size={13}/> Esporta Excel
              </button>
            </div>
          </div>

          {showColPicker && (
            <div className="col-span-12 p-3 rounded" style={{background:'var(--bg)', border:'1px solid var(--line)'}}>
              <div className="flex items-center justify-between mb-2">
                <div className="label">Colonne visibili</div>
                <div className="flex gap-2">
                  <button className="btn btn-ghost text-xs" onClick={()=>setVisibleCols(DOCUMENTI_COLUMNS.map(c=>c.id))}>Tutte</button>
                  <button className="btn btn-ghost text-xs" onClick={()=>setVisibleCols(DOCUMENTI_DEFAULT)}>Default</button>
                  <button className="btn btn-ghost text-xs" onClick={()=>setVisibleCols([])}>Nessuna</button>
                </div>
              </div>
              <div className="grid grid-cols-4 gap-2">
                {DOCUMENTI_COLUMNS.map(c => (
                  <label key={c.id} className="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" checked={colIsVisible(c.id)} onChange={()=>toggleCol(c.id)}/>
                    <span>{c.label}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
      )}

      {/* Display settings modal */}
      {showDisplay && (
        <div className="modal-bg" onClick={()=>setShowDisplay(false)}>
          <div className="modal w-[480px]" onClick={e=>e.stopPropagation()}>
            <div className="px-5 py-4 border-b flex items-center justify-between" style={{ borderColor:'var(--line)' }}>
              <h3 className="font-serif text-xl">Visualizzazione tabella</h3>
              <button className="btn btn-ghost" onClick={()=>setShowDisplay(false)}><Icon name="x" size={14}/></button>
            </div>
            <div className="p-5 space-y-4 max-h-[80vh] overflow-auto">
              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Celle / contenuto</div>
                <label className="label block mb-1">Carattere</label>
                <select className="input mb-3" value={fontFamily} onChange={e=>setFontFamily(e.target.value)}>
                  {ANALITICO_FONTS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
                <label className="label block mb-1">Dimensione: <span className="num">{fontSize}px</span></label>
                <input type="range" min="9" max="22" step="1" value={fontSize}
                       onChange={e=>setFontSize(parseInt(e.target.value))} className="w-full"/>
              </div>
              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Intestazioni colonna</div>
                <label className="label block mb-1">Carattere intestazioni</label>
                <select className="input mb-3" value={headerFontFamily} onChange={e=>setHeaderFontFamily(e.target.value)}>
                  {ANALITICO_FONTS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
                <label className="label block mb-1">Dimensione intestazioni: <span className="num">{headerFontSize}px</span></label>
                <input type="range" min="9" max="20" step="1" value={headerFontSize}
                       onChange={e=>setHeaderFontSize(parseInt(e.target.value))} className="w-full"/>
              </div>
              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Layout</div>
                <label className="label block mb-2">Andata a capo righe</label>
                <div className="flex gap-2 mb-3">
                  <button className={`btn ${wrapMode==='nowrap' ? 'btn-primary':'btn-secondary'} flex-1`} onClick={()=>setWrapMode('nowrap')}>
                    Una riga (tronca)
                  </button>
                  <button className={`btn ${wrapMode==='wrap' ? 'btn-primary':'btn-secondary'} flex-1`} onClick={()=>setWrapMode('wrap')}>
                    A capo automatico
                  </button>
                </div>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={compact} onChange={e=>setCompact(e.target.checked)}/>
                  <span className="text-sm">Densità compatta (consigliata per max informazioni)</span>
                </label>
              </div>
              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Blocca riquadri</div>
                <p className="text-[11px] mb-2" style={{color:'var(--ink-3)'}}>Colonne a sinistra che restano sempre visibili durante lo scorrimento orizzontale.</p>
                <label className="label block mb-1">Colonne fisse a sinistra: <span className="num">{freezeCols}</span></label>
                <input type="range" min="0" max="6" step="1" value={freezeCols}
                       onChange={e=>setFreezeCols(parseInt(e.target.value))} className="w-full"/>
                <div className="flex justify-between text-[10px]" style={{color:'var(--ink-3)'}}>
                  <span>0</span><span>6</span>
                </div>
              </div>

              <div className="border-b pb-3" style={{ borderColor:'var(--line-2)' }}>
                <div className="small-cap text-xs font-semibold mb-2" style={{color:'var(--ink-2)'}}>Colori</div>
                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div>
                    <label className="label block mb-1">Sfondo dettaglio aperto</label>
                    <div className="flex items-center gap-2">
                      <input type="color" value={detailBg} onChange={e=>setDetailBg(e.target.value)} className="w-10 h-8 cursor-pointer rounded border" style={{borderColor:'var(--line)'}}/>
                      <input type="text" value={detailBg} onChange={e=>setDetailBg(e.target.value)} className="input flex-1 font-mono text-xs"/>
                    </div>
                  </div>
                  <div>
                    <label className="label block mb-1">Bordo accento dettaglio</label>
                    <div className="flex items-center gap-2">
                      <input type="color" value={detailAccent} onChange={e=>setDetailAccent(e.target.value)} className="w-10 h-8 cursor-pointer rounded border" style={{borderColor:'var(--line)'}}/>
                      <input type="text" value={detailAccent} onChange={e=>setDetailAccent(e.target.value)} className="input flex-1 font-mono text-xs"/>
                    </div>
                  </div>
                  <div>
                    <label className="label block mb-1">Sfondo intestazioni</label>
                    <div className="flex items-center gap-2">
                      <input type="color" value={headerBg} onChange={e=>setHeaderBg(e.target.value)} className="w-10 h-8 cursor-pointer rounded border" style={{borderColor:'var(--line)'}}/>
                      <input type="text" value={headerBg} onChange={e=>setHeaderBg(e.target.value)} className="input flex-1 font-mono text-xs"/>
                    </div>
                  </div>
                  <div>
                    <label className="label block mb-1">Righe alternate</label>
                    <div className="flex items-center gap-2">
                      <input type="color" value={zebraColor} onChange={e=>setZebraColor(e.target.value)} disabled={!zebra}
                             className="w-10 h-8 cursor-pointer rounded border disabled:opacity-50" style={{borderColor:'var(--line)'}}/>
                      <input type="text" value={zebraColor} onChange={e=>setZebraColor(e.target.value)} disabled={!zebra}
                             className="input flex-1 font-mono text-xs disabled:opacity-50"/>
                    </div>
                  </div>
                </div>
                <label className="flex items-center gap-2 cursor-pointer text-sm">
                  <input type="checkbox" checked={zebra} onChange={e=>setZebra(e.target.checked)}/>
                  Attiva colorazione righe alternate (zebrato)
                </label>
              </div>

              <div className="pt-1">
                <button className="btn btn-secondary text-xs w-full" onClick={()=>{
                  setFontFamily('Manrope'); setFontSize(12);
                  setHeaderFontFamily('Manrope'); setHeaderFontSize(11);
                  setWrapMode('nowrap'); setCompact(true); setColWidths({});
                  setFreezeCols(3);
                  setDetailBg('#FBF5E8'); setDetailAccent('#B5462E'); setHeaderBg('#ECE7DA');
                  setZebra(false); setZebraColor('#F2EDE0');
                }}>
                  <Icon name="refresh" size={12}/> Ripristina valori predefiniti
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* PDF popup */}
      {pdfPopup && (
        <AnaliticoPdfPopup invoice={pdfPopup} onClose={()=>setPdfPopup(null)}/>
      )}

      {/* Table */}
      {(() => {
        const fz = Math.min(freezeCols, visibleColObjs.length);
        // first cell is the +/- expand toggle (width 28). It's always frozen first.
        const expandColW = 28;
        const leftOffsets = []; // for visibleColObjs (after expand col)
        let acc = expandColW;
        for (let i = 0; i < fz; i++) {
          leftOffsets.push(acc);
          acc += widthFor(visibleColObjs[i]);
        }
        const headerHeight = Math.max(28, Math.round(headerFontSize * 2.6));
        const totalCols = visibleColObjs.length + 2; // expand + cols + actions
        return (
          <div className="card flex-1 overflow-auto min-h-[400px] analitico-wrapper documenti-wrapper"
               style={{ fontFamily: `'${fontFamily}', system-ui, sans-serif`, fontSize: fontSize+'px',
                        '--head-offset': headerHeight+'px',
                        '--detail-bg': detailBg, '--detail-accent': detailAccent,
                        '--header-bg': headerBg,
                        '--zebra-bg': zebra ? zebraColor : 'transparent' }}>
            <table className={`data-table ${wrapMode==='wrap' ? 'wrap-cells' : 'nowrap-cells'} ${compact ? 'compact':''}${zebra ? ' zebra':''}`}
                   style={{ tableLayout: 'fixed' }}>
              <colgroup>
                <col style={{ width: expandColW }}/>
                {visibleColObjs.map(c => (
                  <col key={c.id} style={{ width: widthFor(c)+'px' }}/>
                ))}
                <col style={{ width: 40 }}/>
              </colgroup>
              <thead>
                <tr>
                  <th className="freeze" style={{ left: 0, width: expandColW, background: headerBg, fontFamily: `'${headerFontFamily}', system-ui, sans-serif`, fontSize: headerFontSize+'px' }}></th>
                  {visibleColObjs.map((c, ci) => {
                    const isFz = ci < fz;
                    return (
                      <th key={c.id}
                          className={`cursor-pointer select-none${isFz ? ` freeze${ci===fz-1?' freeze-last':''}` : ''}`}
                          style={{
                            width: widthFor(c)+'px',
                            background: headerBg,
                            fontFamily: `'${headerFontFamily}', system-ui, sans-serif`,
                            fontSize: headerFontSize+'px',
                            ...(isFz ? { left: leftOffsets[ci]+'px' } : {})
                          }}>
                        <div className="flex items-center gap-1" onClick={()=>toggleSort(c.id)}>
                          {c.label}
                          {sortBy.col === c.id && (
                            <span style={{color:'var(--accent)', fontSize:'0.8em'}}>
                              {sortBy.dir==='asc'?'▲':'▼'}
                            </span>
                          )}
                        </div>
                        <div className="col-resizer" onMouseDown={(e)=>startColResize(e, c)} title="Trascina per ridimensionare"></div>
                      </th>
                    );
                  })}
                  <th style={{width:40, background: headerBg, fontFamily: `'${headerFontFamily}', system-ui, sans-serif`, fontSize: headerFontSize+'px'}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(inv => {
                  const isExp = !!expanded[inv.id];
                  return (
                    <Fragment key={inv.id}>
                      <tr className="hover-row cursor-pointer" onClick={()=>setExpanded(prev => ({...prev, [inv.id]: !isExp}))}>
                        <td className="freeze" style={{left: 0}}><Icon name={isExp?'chevdown':'chevright'} size={12}/></td>
                        {visibleColObjs.map((c, ci) => {
                          const isFz = ci < fz;
                          const align = isMoneyKind(c.kind) ? 'text-right' : '';
                          return (
                            <td key={c.id}
                                className={`${align}${isFz ? ` freeze${ci===fz-1?' freeze-last':''}` : ''}`}
                                style={isFz ? { left: leftOffsets[ci]+'px' } : undefined}>
                              {renderCellInner(c, inv)}
                            </td>
                          );
                        })}
                        <td>
                          <button className="btn btn-ghost" style={{padding:'2px 4px'}}
                                  onClick={(e)=>{e.stopPropagation(); setPdfPopup(inv);}}
                                  title="Apri anteprima PDF">
                            <Icon name="eye" size={12}/>
                          </button>
                        </td>
                      </tr>
                      {isExp && (
                        <tr className="documenti-detail-row">
                          <td colSpan={totalCols}
                              style={{
                                padding: 0,
                                whiteSpace: 'normal',
                                overflow: 'visible',
                                textOverflow: 'clip',
                                background: detailBg,
                                borderTop: `2px solid ${detailAccent}`,
                                borderBottom: `2px solid ${detailAccent}`,
                                boxShadow: `inset 5px 0 0 ${detailAccent}`,
                              }}>
                            <div style={{ padding: '8px 12px 10px 16px' }}>
                              <DocumentDetail inv={inv} accent={detailAccent}/>
                            </div>
                          </td>
                        </tr>
                      )}
                    </Fragment>
                  );
                })}
                {filtered.length === 0 && (
                  <tr><td colSpan={totalCols} className="text-center" style={{padding:'32px', color:'var(--ink-3)'}}>
                    Nessun documento corrisponde ai filtri applicati.
                  </td></tr>
                )}
              </tbody>
              {filtered.length > 0 && (
                <tfoot>
                  <tr style={{background:'var(--bg)', fontWeight:600, borderTop:'2px solid var(--accent)'}}>
                    <td className="freeze" style={{left: 0}}></td>
                    {visibleColObjs.map((c, ci) => {
                      const isFz = ci < fz;
                      const fzClass = isFz ? ` freeze${ci===fz-1?' freeze-last':''}` : '';
                      const fzStyle = isFz ? { left: leftOffsets[ci]+'px' } : undefined;
                      if (c.id === 'taxableAmountTotal') return <td key={c.id} className={`num text-right${fzClass}`} style={fzStyle}>{fmtMoney(totals.imponibile)}</td>;
                      if (c.id === 'vatAmountTotal')     return <td key={c.id} className={`num text-right${fzClass}`} style={fzStyle}>{fmtMoney(totals.imposta)}</td>;
                      if (c.id === 'totaleDocumento')    return <td key={c.id} className={`num text-right${fzClass}`} style={{...(fzStyle||{}), color:'var(--accent)'}}>{fmtMoney(totals.totale)}</td>;
                      if (c.id === 'numRighe')           return <td key={c.id} className={`num${fzClass}`} style={fzStyle}>{fmtNum(filtered.reduce((s,r)=>s+r._numRighe,0), 0)}</td>;
                      if (c.id === 'numArtIVA')          return <td key={c.id} className={`num${fzClass}`} style={fzStyle}>{fmtNum(filtered.reduce((s,r)=>s+r._numArtIVA,0), 0)}</td>;
                      return <td key={c.id} className={fzClass} style={fzStyle}>{c.id==='tipoDocumento'?'Totali':''}</td>;
                    })}
                    <td></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        );
      })()}
    </div>
  );
};

const DocumentDetail = ({ inv, accent='var(--accent)' }) => (
  <div className="grid grid-cols-12 gap-x-3 gap-y-2 text-xs" style={{lineHeight: 1.35}}>
    <div className="col-span-4">
      <div className="text-[10px] font-bold uppercase tracking-wider mb-0.5" style={{color: accent}}>Cedente / Prestatore</div>
      <div className="font-semibold" style={{fontSize: '12px'}}>{inv.cedente.denominazione || '—'}</div>
      <div style={{ color:'var(--ink-2)' }}>
        P.IVA: <span className="font-mono">{inv.cedente.partitaIva || '—'}</span>
        {inv.cedente.codiceFiscale && inv.cedente.codiceFiscale !== inv.cedente.partitaIva &&
          <> · CF: <span className="font-mono">{inv.cedente.codiceFiscale}</span></>}
        {inv.cedente.indirizzo && <div>{inv.cedente.indirizzo}</div>}
      </div>
    </div>
    <div className="col-span-4">
      <div className="text-[10px] font-bold uppercase tracking-wider mb-0.5" style={{color: accent}}>Cessionario / Committente</div>
      <div className="font-semibold" style={{fontSize: '12px'}}>{inv.cessionario.denominazione || '—'}</div>
      <div style={{ color:'var(--ink-2)' }}>
        P.IVA: <span className="font-mono">{inv.cessionario.partitaIva || '—'}</span>
        {inv.cessionario.codiceFiscale && inv.cessionario.codiceFiscale !== inv.cessionario.partitaIva &&
          <> · CF: <span className="font-mono">{inv.cessionario.codiceFiscale}</span></>}
        {inv.cessionario.indirizzo && <div>{inv.cessionario.indirizzo}</div>}
      </div>
    </div>
    <div className="col-span-4">
      <div className="text-[10px] font-bold uppercase tracking-wider mb-0.5" style={{color: accent}}>Dettagli documento</div>
      <div style={{ color:'var(--ink-2)' }}>

            <col style={{width: 60}}/>
            <col style={{width: 110}}/>
            <col style={{width: 120}}/>

          </thead>
          <tbody>
            {inv.lines.map((l,i) => (
              <tr key={i}>
                <td className="num">{l.numeroLinea}</td>

    <div className="col-span-12 mt-1">

        <table className="doc-detail-table">
          <colgroup>
            <col style={{width: 80}}/>
            <col style={{width: 90}}/>
            <col/>
            <col style={{width: 130}}/>
            <col style={{width: 130}}/>
            <col style={{width: 100}}/>
            <col/>
          </colgroup>
          <thead>
            <tr>
              <th>Aliquota</th><th>Natura</th><th>Descrizione natura</th>
              <th style={{textAlign:'right'}}>Imponibile</th><th style={{textAlign:'right'}}>Imposta</th>
              <th>Esigibilità</th><th>Riferimento normativo</th>
            </tr>
          </thead>
          <tbody>
            {inv.summaries.map((s,i) => (
              <tr key={i}>
                <td className="num">{s.aliquotaIVA != null ? fmtNum(s.aliquotaIVA,2)+'%' : '—'}</td>
                <td>{s.natura ? <span className="badge b-mute">{s.natura}</span> : '—'}</td>
                <td style={{color:'var(--ink-2)'}}>
                  {s.natura ? naturaLabel(s.natura) : '—'}
                </td>
                <td className="num" style={{textAlign:'right'}}>{fmtMoney(s.imponibile)}</td>
                <td className="num font-semibold" style={{textAlign:'right'}}>{fmtMoney(s.imposta)}</td>
                <td>{s.esigibilita || '—'}</td>
                <td style={{color: accent}}>{s.riferimentoNormativo || '—'}</td>
