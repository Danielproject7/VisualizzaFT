<style>
  :root {
    --bg: #F7F4ED;
    --bg-elev: #FFFEFA;
    --bg-deep: #ECE7DA;
    --ink: #1B1814;
    --ink-2: #423A33;
    --ink-3: #6B6056;
    --line: #D9D1C0;
    --line-2: #E8E1D1;
    --accent: #B5462E;
    --accent-2: #1F3A2E;
    --gold: #B08A3E;
    --ok: #3F6B4A;
    --warn: #B5862E;
    --err: #A8362A;
    --info: #2E5A7C;
  }
  html, body, #root { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .font-serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .font-mono  { font-family: 'JetBrains Mono', monospace; }
  .num { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  .grid-paper {
    background-image:
      linear-gradient(var(--line-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-2) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  .stamp {
    border: 1.5px solid var(--accent);
    color: var(--accent);
    transform: rotate(-3deg);
    font-family: 'Fraunces', serif;
    letter-spacing: 0.05em;
  }
  .hover-row:hover { background: var(--bg-deep); }
  .selected-row { background: #EDE5D0 !important; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid;
  }
  .b-ok   { background:#E8EFE6; color:var(--ok); border-color:#C5D4BD; }
  .b-warn { background:#F4ECD7; color:var(--warn); border-color:#E0CFA2; }
  .b-err  { background:#F2DDD8; color:var(--err); border-color:#DDB5AC; }
  .b-info { background:#DCE6EC; color:var(--info); border-color:#B6C8D2; }
  .b-mute { background:#E8E1D1; color:var(--ink-3); border-color:#D9D1C0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 4px; font-size: 13px;
    font-weight: 600; transition: all 0.15s; cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--ink); color: var(--bg-elev); }
  .btn-primary:hover { background: var(--accent); }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { background: var(--bg-deep); border-color: var(--ink-3); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #963921; }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--bg-deep); }

  .input {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    padding: 7px 10px; border-radius: 4px; font-size: 13px;
    color: var(--ink); width: 100%;
    transition: border-color 0.15s;
  }
  .input:focus { outline: none; border-color: var(--ink); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .divider { height: 1px; background: var(--line); }

  table.data-table { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.data-table th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    padding: 10px 12px; background: var(--bg);
    border-bottom: 1.5px solid var(--ink); border-top: 1px solid var(--line);
    position: sticky; top: 0; z-index: 1;
    white-space: nowrap;
  }
  table.data-table td {
    padding: 9px 12px; font-size: 13px;
    border-bottom: 1px solid var(--line-2);
    vertical-align: top;
  }
  table.data-table tr:last-child td { border-bottom: none; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 500;
    color: var(--ink-2); cursor: pointer; border-radius: 3px;
    transition: all 0.15s; position: relative;
  }
  .nav-item:hover { background: var(--bg-deep); color: var(--ink); }
  .nav-item.active {
    background: var(--ink); color: var(--bg-elev);
    font-weight: 600;
  }
  .nav-item .nav-count {
    margin-left: auto; font-size: 11px; padding: 1px 7px;
    border-radius: 999px; background: var(--bg-deep); color: var(--ink-3);
    font-weight: 600;
  }
  .nav-item.active .nav-count { background: rgba(255,255,255,0.15); color: var(--bg); }

  .kpi-card {
    border: 1px solid var(--line);
    background: var(--bg-elev);
    padding: 18px 20px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top:0; left:0; right:0;
    height: 2px; background: var(--ink);
  }
  .kpi-card.accent::before { background: var(--accent); }
  .kpi-card.ok::before { background: var(--ok); }
  .kpi-card.warn::before { background: var(--warn); }
  .kpi-card.err::before { background: var(--err); }

  .dropzone {
    border: 2px dashed var(--line);
    background: var(--bg-elev);
    border-radius: 6px;
    padding: 56px 32px;
    text-align: center;
    transition: all 0.2s;
  }
  .dropzone.drag { border-color: var(--accent); background: #FBF5F1; }

  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,16,12,0.55);
    z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--bg-elev); border-radius: 6px;
    max-width: 90vw; max-height: 90vh; overflow: auto;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .ribbon {
    background: repeating-linear-gradient(
      45deg, var(--bg-deep), var(--bg-deep) 10px,
      var(--bg-elev) 10px, var(--bg-elev) 20px
    );
  }

  /* Override Tailwind defaults to use our typography */
  h1,h2,h3,h4 { font-family: 'Fraunces', serif; }

  /* Tooltip */
  .tip { position: relative; }
  .tip:hover::after {
    content: attr(data-tip); position: absolute;
    bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg-elev);
    padding: 4px 8px; border-radius: 3px;
    font-size: 11px; white-space: nowrap; z-index: 10;
  }

  /* Sidebar resizer */
  .sidebar-resizer {
    position: absolute; top: 0; right: -3px; width: 6px; height: 100%;
    cursor: col-resize; z-index: 30;
    background: transparent; transition: background 0.15s;
  }
  .sidebar-resizer:hover, .sidebar-resizer.dragging {
    background: var(--accent);

  .sidebar-collapsed .nav-item span:not(.nav-count),
  .sidebar-collapsed .sidebar-text { display: none !important; }
  .sidebar-collapsed .nav-item { justify-content: center; padding: 10px 8px; }
  .sidebar-collapsed .nav-item .nav-count {
    position: absolute; top: 2px; right: 2px; margin: 0;
    font-size: 9px; padding: 0 4px; min-width: 14px; text-align: center;
  }

  /* Analitico table customization (only outer table cells, not nested) */
  table.data-table.wrap-cells > tbody > tr > td { white-space: normal; word-break: break-word; }
  table.data-table.nowrap-cells > tbody > tr > td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* th already has position:sticky (top:0) globally, which doubles as positioning context for the col-resizer */
  .col-resizer {
    position: absolute; top: 0; right: 0; width: 6px; height: 100%;
    cursor: col-resize; user-select: none;
    background: transparent; transition: background 0.15s;
  }
  .col-resizer:hover, .col-resizer.dragging { background: var(--accent); }
  table.data-table.compact > thead > tr > th { padding: 6px 8px; }
  table.data-table.compact > tbody > tr > td,
  table.data-table.compact > tfoot > tr > td { padding: 5px 8px; }
  /* Allow inline font-size on the wrapper to cascade to cells (outer table only) */
  .analitico-wrapper > .analitico-wrapper-inner,
  .analitico-wrapper > table.data-table > tbody > tr > td,
  .analitico-wrapper > table.data-table > tfoot > tr > td,
  .analitico-wrapper > table.data-table > tbody > tr > td > .num,
  .analitico-wrapper > table.data-table > tbody > tr > td > span { font-size: inherit; }

  /* Sticky stacking layers (higher = on top):
       5: header + freeze (top-left corner)
       4: header non-freeze
       3: invoice group banner
       2: frozen data cell
       0: regular data cell  */
  .analitico-wrapper table.data-table thead th { z-index: 4; }
  .analitico-wrapper table.data-table th.freeze,
  .analitico-wrapper table.data-table td.freeze {
    position: sticky; background: var(--bg-elev);
    box-shadow: inset -1px 0 0 var(--line-2);
  }
  .analitico-wrapper table.data-table td.freeze { z-index: 2; }
  .analitico-wrapper table.data-table th.freeze { background: var(--bg); z-index: 5; }
  .analitico-wrapper table.data-table th.freeze.freeze-last,
  .analitico-wrapper table.data-table td.freeze.freeze-last {
    box-shadow: inset -2px 0 0 var(--ink-3);
  }
  .analitico-wrapper table.data-table tr.hover-row:hover td.freeze { background: var(--bg-deep); }

  /* Invoice grouping separator */
  .analitico-wrapper table.data-table tr.invoice-group-row td {
    background: var(--bg-deep);
    border-top: 2px solid var(--ink) !important;
    border-bottom: 1px solid var(--line) !important;
    padding: 8px 12px;
    position: sticky; top: var(--head-offset, 36px); z-index: 3;
  }
  .analitico-wrapper table.data-table tr.invoice-group-row + tr td { border-top: none; }
  .analitico-wrapper table.data-table tr.invoice-end-row td {
    height: 4px; padding: 0; background: var(--ink); border: none;
  }

  /* Zebra stripes (outer table only, skip detail/expansion rows) */
  table.data-table.zebra > tbody > tr:nth-child(even):not(.documenti-detail-row) > td:not(.freeze) { background: var(--zebra-bg, transparent); }
  table.data-table.zebra > tbody > tr:nth-child(even):not(.documenti-detail-row) > td.freeze { background: color-mix(in srgb, var(--zebra-bg, transparent) 70%, var(--bg-elev)); }

  /* Inner detail tables: ensure rows grow with wrapped content and never inherit nowrap */
  .doc-detail-table { table-layout: fixed; width: 100%; border-collapse: collapse; }
  .doc-detail-table td, .doc-detail-table th {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    word-break: break-word;
    vertical-align: top;
    line-height: 1.3;
  }
  .doc-detail-table td { padding: 3px 6px; font-size: 11px; }
  .doc-detail-table th {
    padding: 4px 6px; font-size: 10px;
    background: var(--bg); border-bottom: 1.5px solid var(--ink);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); font-weight: 700;
    text-align: left;
  }
  .doc-detail-table tr:not(:last-child) td { border-bottom: 1px solid var(--line-2); }
</style>

<script>
  // Show error if React/Babel fail to bootstrap within 5s
  window.addEventListener('error', function(e){
    var box = document.getElementById('boot-error');
    if (box) { box.style.display='block'; box.textContent = 'Errore di caricamento: '+(e.message||e.error||e); }
  });
  setTimeout(function(){
    var fb = document.getElementById('boot-fallback');
    if (fb && fb.parentNode && fb.parentNode.id === 'root') {
      var box = document.getElementById('boot-error');
      if (box) { box.style.display='block'; box.textContent = 'Timeout: lo script React/Babel non si è avviato. Possibili cause: CDN bloccato, errore di sintassi, network restrittiva. Apri il file localmente o controlla la console (F12).'; }
    }
  }, 8000);
</script>

/* =========================================================================
   UTILS — formatting, parsing helpers
========================================================================= */
const fmtMoney = (n, currency='EUR') => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('it-IT', { style:'currency', currency, minimumFractionDigits:2 });
};
const fmtNum = (n, d=2) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('it-IT', { minimumFractionDigits:d, maximumFractionDigits:d });
};
const fmtDate = (s) => {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('it-IT');
};
const safeNum = (s) => {
  if (s === null || s === undefined || s === '') return null;
  const n = parseFloat(String(s).replace(',', '.'));
  return isNaN(n) ? null : n;
};
const uid = () => Math.random().toString(36).slice(2, 11);
const round2 = (n) => Math.round(n * 100) / 100;

const normalizeNumber = (str) => String(str || '').replace(/\s/g,'').replace(/[^\dA-Za-z]/g,'').toUpperCase();
const normalizeVat = (v) => String(v || '').replace(/\s/g,'').toUpperCase();

/* AdE invoice list CSV parser (semicolon-separated, Italian locale, single-quoted text fields) */
const parseAdeCsv = (csvText) => {
  const text = String(csvText || '').replace(/^﻿/, '');
  const rawLines = text.split(/\r?\n/);
  // Re-join lines that were split inside a quoted field
  const lines = [];
  let buffer = '';
  for (const line of rawLines) {
    buffer = buffer ? buffer + '\n' + line : line;
    const quoteCount = (buffer.match(/"/g) || []).length;
    if (quoteCount % 2 === 0) { lines.push(buffer); buffer = ''; }
  }
  if (buffer) lines.push(buffer);
  const filtered = lines.filter(l => l.trim().length > 0);
  if (filtered.length < 2) return [];

  const SEP = ';';
  const splitRow = (line) => {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === SEP && !inQ) {
        out.push(cur); cur = '';
      } else { cur += c; }
    }
    out.push(cur);
    return out;
  };
  const stripQuotes = (s) => {
    let v = String(s || '').trim();
    // Strip leading/trailing single quote (Excel text protector)
    if (v.startsWith("'") && v.endsWith("'") && v.length >= 2) v = v.slice(1, -1);
    return v.trim();
  };
  const parseDate = (s) => {
    if (!s) return null;
    const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
  };
  const parseAmount = (s) => {
    const v = String(s || '').trim();
    if (!v) return null;
    const cleaned = v.replace(/^0+(?=\d)/, '').replace(/\./g, '').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  };

  const headers = splitRow(filtered[0]).map(h => h.trim());
  const rows = [];
  for (let i = 1; i < filtered.length; i++) {
    const cells = splitRow(filtered[i]);
    const o = {};
    headers.forEach((h, j) => { o[h] = stripQuotes(cells[j]); });
    rows.push({
      tipoFattura: o['Tipo fattura'],
      tipoDocumento: o['Tipo documento'],
      numeroDocumento: o['Numero fattura / Documento'],
      dataEmissione: parseDate(o['Data emissione']),
      dataTrasmissione: parseDate(o['Data trasmissione']),
      supplierFiscalCode: o['Codice fiscale fornitore'] === 'Non presente' ? '' : o['Codice fiscale fornitore'],
      supplierVat: o['Partita IVA fornitore'],
      supplierName: o['Denominazione fornitore'],
      customerFiscalCode: o['Codice fiscale cliente'] === 'Non presente' ? '' : o['Codice fiscale cliente'],
      customerVat: o['Partita IVA cliente'],
      customerName: o['Denominazione cliente'],
      imponibile: parseAmount(o['Imponibile/Importo (totale in euro)']),
      imposta: parseAmount(o['Imposta (totale in euro)']),
      sdiFileId: o['Sdi/file'],
      consegnata: o['Fatture consegnate'],
      dataRicezione: parseDate(o['Data ricezione']),
      bolloVirtuale: (o['Bollo virtuale'] || '').toLowerCase().startsWith('s'),
    });
  }
  return rows;
};

/* JasperReports-generated VAT register parser ("Registro delle fatture di acquisto/vendita")
   The file has a multi-row layout: each invoice block starts with a date in col 0 and is followed
   by sub-rows (P.IVA, additional VAT lines for multi-aliquota documents, currency conversion notes).
   This parser flattens it into one row per (invoice × VAT line), compatible with the existing
   detailed register schema. */
const detectJasperVatFormat = (sheet) => {
  for (let i = 0; i < Math.min(20, sheet.length); i++) {
    const flat = (sheet[i] || []).map(c => String(c||'')).join(' ');
    if (/Registro delle fatture di (acquisto|vendita)/i.test(flat)) return true;
  }
  return false;
};

const parseJasperVatSheet = (sheet, fileName) => {
  const stripDate = (s) => {
    const m = String(s || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
  };
  const stripAmt = (s) => {
    const v = String(s || '').trim();
    if (!v) return null;
    // Format observed: "5,860.14" (comma=thousands, dot=decimal). Also handle "5.860,14" just in case.
    let cleaned;
    if (/,\d{1,2}$/.test(v) && !/\.\d/.test(v)) cleaned = v.replace(/\./g, '').replace(',', '.');
    else cleaned = v.replace(/,/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  };

  // Header metadata (company, period, sezionale, register type)
  let registerType = 'acquisti', companyName = '', companyVat = '', periodFromTo = '', sezionale = '';
  for (let i = 0; i < Math.min(15, sheet.length); i++) {
    const cells = (sheet[i] || []).map(c => String(c||''));
    const flat = cells.join(' ');
    if (/Registro delle fatture di vendita/i.test(flat)) registerType = 'vendite';
    if (/Registro delle fatture di acquisto/i.test(flat)) registerType = 'acquisti';
    if (!companyName) {
      const trimmed = cells.filter(c => c.trim().length);
      if (trimmed.length === 1 && !/Registro|Codice|Periodo|Pagina|Dal\s/i.test(trimmed[0])) {
        companyName = trimmed[0].trim();
      }
    }
    const cfM = flat.match(/Codice fiscale\s+(\S+)/i);
    if (cfM && !companyVat) companyVat = cfM[1];
    const periodM = flat.match(/Dal\s+(\d{2}\/\d{2}\/\d{4})\s+al\s+(\d{2}\/\d{2}\/\d{4})/i);
    if (periodM && !periodFromTo) periodFromTo = `${periodM[1]} → ${periodM[2]}`;
    const sezM = flat.match(/Sezionale\s+(\S+)\s*(.*)/i);
    if (sezM && !sezionale) sezionale = sezM[1] + (sezM[2] ? ' ' + sezM[2].trim() : '');
  }

  const isHeaderRow = (r) => {
    if (!r) return false;
    return String(r[0] || '').trim() === 'Data reg.' && r.some(c => /Imponibile/i.test(String(c||'')));
  };
  const isStopRow = (r) => {
    if (!r) return true;
    const flat = r.map(c => String(c||'')).join(' ');
    return /FINE STAMPA|Totali sezionale|Op\. competenza/i.test(flat);
  };

  // Parse: each new date in col 0 starts a new invoice block.
  const docs = [];
  let cur = null;
  const flushCur = () => { if (cur) { docs.push(cur); cur = null; } };

  const addVatLine = (r) => {
    const imp = stripAmt(r[32]);
    const code = String(r[34] || '').trim();
    const desc = String(r[35] || '').trim();
    const imposta = stripAmt(r[38]);
    const impostaNd = stripAmt(r[40]);
    if (imp == null && !code && !desc && imposta == null && impostaNd == null) return;
    cur.vatLines.push({ taxableAmount: imp, codeOrRate: code, articleDescription: desc, vatAmount: imposta, nonDeductibleVat: impostaNd });
  };

  for (let i = 0; i < sheet.length; i++) {
    const r = sheet[i];
    if (!r) continue;
    if (isHeaderRow(r)) continue;
    if (String(r[23] || '').trim() === 'Totali') break;
    if (isStopRow(r)) break;

    const dataReg = stripDate(r[0]);
    if (dataReg) {
      flushCur();
      const fornitoreCell = String(r[15] || '').trim();
      const fornM = fornitoreCell.match(/^(\d+)\s+(.+)$/);
      cur = {
        registrationDate: dataReg,
        accountingDescription: String(r[9] || '').trim(),
        supplierCode: fornM ? fornM[1] : '',
        supplierOrCustomer: fornM ? fornM[2].trim() : fornitoreCell,
        protocolNumber: String(r[20] || '').trim(),
        documentNumber: String(r[23] || '').trim(),
        documentDate: stripDate(r[28]),
        vatNumber: '',
        currencyNote: '',
        vatLines: [],
        documentTotal: null,
      };
      addVatLine(r);
      const tot = stripAmt(r[43]);
      if (tot != null) cur.documentTotal = tot;
    } else {
      if (!cur) continue;
      const c15 = String(r[15] || '').trim();
      const pivaM = c15.match(/^P\.IVA\s+(.+)$/i);
      if (pivaM) cur.vatNumber = pivaM[1].trim().replace(/^IT(?=IT)/i, '');
      const c12 = String(r[12] || '').trim();
      if (/Importo in valuta/i.test(c12)) cur.currencyNote = c12;
      addVatLine(r);
      const tot = stripAmt(r[43]);
      if (tot != null) cur.documentTotal = tot;
    }
  }
  flushCur();

  // Flatten to one register row per (invoice × VAT line), compatible with REGISTER_FIELDS shape
  const rows = [];
  let rn = 0;
  docs.forEach(doc => {
    const lines = doc.vatLines.length ? doc.vatLines : [{}];
    lines.forEach((l, idx) => {
      rn++;
      // codeOrRate can be a percentage ("22,00", "10,00") or a natura/article code ("315 ", "326 ")
      let vatRate = null, natureCode = '';
      const cr = (l.codeOrRate || '').trim();
      if (cr) {
        if (/[,.]/.test(cr)) vatRate = parseFloat(cr.replace(',', '.'));
        else {
          const n = parseInt(cr, 10);
          if (!isNaN(n) && n <= 100) vatRate = n;
          else natureCode = cr;
        }
      }
      rows.push({
        id: uid(),
        rowNumber: rn,
        sourceFileName: fileName,
        registrationDate: doc.registrationDate,
        documentDate: doc.documentDate,
        documentNumber: doc.documentNumber,
        protocolNumber: doc.protocolNumber,
        supplierOrCustomer: doc.supplierOrCustomer,
        supplierCode: doc.supplierCode,
        vatNumber: doc.vatNumber,
        fiscalCode: '',
        taxableAmount: l.taxableAmount ?? null,
        vatAmount: l.vatAmount ?? null,
        nonDeductibleVat: l.nonDeductibleVat ?? null,
        vatRate,
        natureCode,
        vatArticle: natureCode,
        vatArticleDescription: l.articleDescription || '',
        // Only the first VAT-line of each invoice carries the totale, to avoid double-counting in totals.
        documentTotal: idx === 0 ? doc.documentTotal : null,
        accountingAccount: '',
        accountingDescription: doc.accountingDescription,
        currencyNote: doc.currencyNote || '',
      });
    });
  });

  return { rows, docCount: docs.length, registerType, companyName, companyVat, periodFromTo, sezionale };
};

/* Match an XML invoice to an AdE row by P.IVA fornitore + numero documento + data documento */
const normalizeDocNum = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
const normalizeVatLoose = (s) => String(s || '').replace(/\s+/g, '').replace(/^IT/i, '').toUpperCase();
const buildAdeIndex = (adeRows) => {
  const byKey = new Map();
  for (const r of adeRows) {
    const key = `${normalizeVatLoose(r.supplierVat)}|${normalizeDocNum(r.numeroDocumento)}|${r.dataEmissione || ''}`;
    if (!byKey.has(key)) byKey.set(key, r);
  }
  return byKey;
};
const findAdeMatch = (inv, idx) => {
  const k = `${normalizeVatLoose(inv.supplierVat)}|${normalizeDocNum(inv.numeroDocumento)}|${inv.dataDocumento || ''}`;
  return idx.get(k) || null;
};

/* =========================================================================
   REGISTRO IVA — Formato riassuntivo italiano (Zucchetti / Esa / TeamSystem-like)
   Periodo · Sez · Tipo reg. · Aliq.IVA · Tipologia IVA · Imponibile · Imposta · Indetraibile
========================================================================= */

const ITALIAN_MONTHS = {
  'gennaio':1,'febbraio':2,'marzo':3,'aprile':4,'maggio':5,'giugno':6,
  'luglio':7,'agosto':8,'settembre':9,'ottobre':10,'novembre':11,'dicembre':12,
};
/* "gennaio 2026" → "2026-01"  ·  "gen 26" → "2026-01"  ·  "01/2026" → "2026-01" */
const parsePeriodo = (s) => {
  if (s == null || s === '') return null;
  const txt = String(s).toLowerCase().trim();
  // Italian month + year
  for (const [name, num] of Object.entries(ITALIAN_MONTHS)) {
    if (txt.startsWith(name) || txt.startsWith(name.slice(0,3))) {
      const yMatch = txt.match(/(\d{2,4})/);
      if (yMatch) {
        const y = yMatch[1].length === 2 ? '20'+yMatch[1] : yMatch[1];
        return `${y}-${String(num).padStart(2,'0')}`;
      }
    }
  }
  // MM/YYYY or YYYY-MM
  const m1 = txt.match(/^(\d{1,2})[\/\-](\d{2,4})$/);
  if (m1) {
    const y = m1[2].length === 2 ? '20'+m1[2] : m1[2];
    return `${y}-${m1[1].padStart(2,'0')}`;
  }
  const m2 = txt.match(/^(\d{4})[\/\-](\d{1,2})$/);
  if (m2) return `${m2[1]}-${m2[2].padStart(2,'0')}`;
  return null;
};
const formatPeriodo = (p) => {
  if (!p) return '—';
  const [y,m] = p.split('-');
  const monthName = Object.keys(ITALIAN_MONTHS).find(k => ITALIAN_MONTHS[k] === parseInt(m));
  return monthName ? `${monthName} ${y}` : p;
};

/* Riconosce il formato del registro dalle intestazioni. */
const detectRegisterFormat = (headers) => {
  const norm = headers.map(h => String(h||'').toLowerCase().replace(/[._\s-]+/g,'').trim());
  const has = (k) => norm.some(h => h.includes(k));
  // Summary format = ha Periodo + Sez + Aliq.IVA + Tipologia IVA + Imponibile
  if (has('periodo') && has('sez') && has('aliqiva') && has('tipologiaiva') && has('imponibile')) {
    return 'summary';
  }
  return 'detailed';
};

/* =========================================================================
   XML PARSER — FatturaPA
========================================================================= */
const stripNS = (tag) => tag.replace(/^.*:/, '');
const findChild = (el, name) => {
  if (!el) return null;
  for (const c of Array.from(el.children)) {
    if (stripNS(c.tagName) === name) return c;
  }
  return null;
};
const findChildren = (el, name) => {
  if (!el) return [];
  return Array.from(el.children).filter(c => stripNS(c.tagName) === name);
};
const text = (el, name) => {
  const c = findChild(el, name);
  return c ? c.textContent.trim() : '';
};
const deepText = (el, path) => {
  let cur = el;
  for (const seg of path.split('/')) {
    cur = findChild(cur, seg);
    if (!cur) return '';
  }
  return cur.textContent.trim();
};

const parseFatturaXml = (xmlString, fileName) => {
  const parser = new DOMParser();
  let doc = parser.parseFromString(xmlString, 'application/xml');
  let perr = doc.querySelector('parsererror');
  if (perr) {
    // Lenient retry: some Italian gestionali emit XML with namespace prefix on the
    // opening tag (<ns2:Comune>) but not on the closing tag (</Comune>) — or vice
    // versa. DOMParser refuses; MIGGsrl / MSXML accept. Strip every "ns:" prefix
    // from element tags and remove xmlns declarations, then re-parse.
    const stripped = xmlString
      .replace(/<(\/?)([A-Za-z][\w-]*):/g, '<$1')
      .replace(/\s+xmlns(?::[A-Za-z][\w-]*)?\s*=\s*"[^"]*"/g, '')
      .replace(/\s+xmlns(?::[A-Za-z][\w-]*)?\s*=\s*'[^']*'/g, '');
    const retryDoc = parser.parseFromString(stripped, 'application/xml');
    const retryErr = retryDoc.querySelector('parsererror');
    if (!retryErr) {
      doc = retryDoc;
      perr = null;
    }
  }
  if (perr) {
    const errText = (perr.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 160);
    const head = (xmlString || '').slice(0, 80).replace(/[\x00-\x1F]/g, '·').replace(/\s+/g, ' ');
    const tail = (xmlString || '').slice(-60).replace(/[\x00-\x1F]/g, '·').replace(/\s+/g, ' ');
    throw new Error(`XML non valido — ${errText} | inizio: "${head}" | fine: "${tail}" | size: ${(xmlString || '').length}b`);
  }
  const root = doc.documentElement;
  const rootTag = stripNS(root.tagName);
  if (rootTag !== 'FatturaElettronica' && rootTag !== 'FatturaElettronicaSemplificata') {
    throw new Error(`Non è un file FatturaPA (root tag: ${rootTag})`);
  }
  const isSemplificata = rootTag === 'FatturaElettronicaSemplificata';

  const header = findChild(root, 'FatturaElettronicaHeader');
  const cedente = findChild(header, 'CedentePrestatore');
  const cessionario = findChild(header, 'CessionarioCommittente');

  const extractAnagrafica = (party) => {
    if (!party) return {};
    const dati = findChild(party, 'DatiAnagrafici');
    const idFiscale = findChild(dati, 'IdFiscaleIVA');
    const anag = findChild(dati, 'Anagrafica');
    const sede = findChild(party, 'Sede');
    let denom = '';
    if (anag) {
      denom = text(anag, 'Denominazione');
      if (!denom) {
        const nome = text(anag, 'Nome');
        const cognome = text(anag, 'Cognome');
        denom = (nome + ' ' + cognome).trim();
      }
    }
    let vat = '';
    if (idFiscale) {
      const paese = text(idFiscale, 'IdPaese');
      const codice = text(idFiscale, 'IdCodice');
      vat = (paese + codice).trim();
    }
    return {
      denominazione: denom,
      partitaIva: vat,
      codiceFiscale: text(dati, 'CodiceFiscale'),
      indirizzo: sede ? `${text(sede,'Indirizzo')}, ${text(sede,'CAP')} ${text(sede,'Comune')} ${text(sede,'Provincia')}`.trim() : '',
    };
  };

  const sup = extractAnagrafica(cedente);
  const cli = extractAnagrafica(cessionario);

  // Multiple bodies (rare but possible)
  const bodies = findChildren(root, 'FatturaElettronicaBody');
  const documents = [];

  bodies.forEach((body) => {
    const datiGenerali = findChild(body, 'DatiGenerali');
    const datiDoc = findChild(datiGenerali, 'DatiGeneraliDocumento');

    const tipoDocumento = text(datiDoc, 'TipoDocumento');
    const numero = text(datiDoc, 'Numero');
    const data = text(datiDoc, 'Data');
    const divisa = text(datiDoc, 'Divisa') || 'EUR';
    const totaleDocumento = safeNum(text(datiDoc, 'ImportoTotaleDocumento'));
    const causaliEls = findChildren(datiDoc, 'Causale');
    const causale = causaliEls.map(c => c.textContent.trim()).join(' | ');

    // Order/Contract/CIG/CUP — search in DatiOrdineAcquisto, DatiContratto, DatiConvenzione, DatiRicezione
    const collectCigCup = () => {
      const groups = ['DatiOrdineAcquisto','DatiContratto','DatiConvenzione','DatiRicezione','DatiFattureCollegate'];
      const cigs = new Set(), cups = new Set(), ords = new Set();
      groups.forEach(g => {
        findChildren(datiGenerali, g).forEach(el => {
          const cig = text(el, 'CodiceCIG'); if (cig) cigs.add(cig);
          const cup = text(el, 'CodiceCUP'); if (cup) cups.add(cup);
          const id = text(el, 'IdDocumento'); if (id) ords.add(id);
        });
      });
      return { cig: [...cigs].join(', '), cup: [...cups].join(', '), idOrdine: [...ords].join(', ') };
    };
    const { cig, cup, idOrdine } = collectCigCup();

    // DDT
    const ddtList = findChildren(datiGenerali, 'DatiDDT')
      .map(el => `${text(el,'NumeroDDT')} del ${text(el,'DataDDT')}`).join('; ');

    // Body / lines / summaries — different for semplificata
    let lines = [];
    let summaries = [];
    let payment = null;

    if (!isSemplificata) {
      const datiBeni = findChild(body, 'DatiBeniServizi');
      const linee = findChildren(datiBeni, 'DettaglioLinee');
      lines = linee.map((line) => {
        const sconti = findChildren(line, 'ScontoMaggiorazione').map(sm => ({
          tipo: text(sm,'Tipo'),
          percentuale: safeNum(text(sm,'Percentuale')),
          importo: safeNum(text(sm,'Importo')),
        }));
        const altri = findChildren(line, 'AltriDatiGestionali').map(a => ({
          tipo: text(a,'TipoDato'), riferimentoTesto: text(a,'RiferimentoTesto'),
          riferimentoNumero: safeNum(text(a,'RiferimentoNumero')),
          riferimentoData: text(a,'RiferimentoData'),
        }));
        const codiciArt = findChildren(line, 'CodiceArticolo').map(c => ({
          tipo: text(c,'CodiceTipo'), valore: text(c,'CodiceValore')
        }));
        return {
          numeroLinea: text(line, 'NumeroLinea'),
          tipoCessionePrestazione: text(line,'TipoCessionePrestazione'),
          codiceArticolo: codiciArt.map(c=>`${c.tipo}:${c.valore}`).join(' / '),
          descrizione: text(line, 'Descrizione'),
          quantita: safeNum(text(line, 'Quantita')),
          unitaMisura: text(line, 'UnitaMisura'),
          prezzoUnitario: safeNum(text(line, 'PrezzoUnitario')),
          prezzoTotale: safeNum(text(line, 'PrezzoTotale')),
          aliquotaIVA: safeNum(text(line, 'AliquotaIVA')),
          natura: text(line, 'Natura'),
          sconti, altri,
          riferimentoAmministrazione: text(line, 'RiferimentoAmministrazione'),
        };
      });

      const riepiloghi = findChildren(datiBeni, 'DatiRiepilogo');
      summaries = riepiloghi.map((r) => ({
        aliquotaIVA: safeNum(text(r, 'AliquotaIVA')),
        natura: text(r, 'Natura'),
        speseAccessorie: safeNum(text(r,'SpeseAccessorie')),
        arrotondamento: safeNum(text(r,'Arrotondamento')),
        imponibile: safeNum(text(r, 'ImponibileImporto')),
        imposta: safeNum(text(r, 'Imposta')),
        esigibilita: text(r, 'EsigibilitaIVA'),
        riferimentoNormativo: text(r, 'RiferimentoNormativo'),
      }));

      const datiPagamento = findChildren(body, 'DatiPagamento');
      if (datiPagamento.length) {
        const dp = datiPagamento[0];
        const cond = text(dp, 'CondizioniPagamento');
        const dettagli = findChildren(dp, 'DettaglioPagamento').map(d => ({
          modalita: text(d, 'ModalitaPagamento'),
          dataScadenza: text(d, 'DataScadenzaPagamento'),
          importoPagamento: safeNum(text(d, 'ImportoPagamento')),
          iban: text(d, 'IBAN'),
          beneficiario: text(d, 'Beneficiario'),
        }));
        payment = { condizioni: cond, dettagli };
      }
    } else {
      // Semplificata
      const datiBeni = findChild(body, 'DatiBeniServizi');
      const dettagli = findChildren(datiBeni, 'DatiBeniServizi');
      lines = dettagli.map((line, idx) => ({
        numeroLinea: String(idx+1),
        descrizione: text(line, 'Descrizione'),
        quantita: null,
        prezzoTotale: safeNum(text(line, 'Importo')),
        aliquotaIVA: safeNum(text(line, 'Aliquota')),
        natura: text(line, 'Natura'),
        imposta: safeNum(text(line, 'Imposta')),
      }));
      summaries = lines.map(l => ({
        aliquotaIVA: l.aliquotaIVA,
        natura: l.natura,
        imponibile: l.prezzoTotale ? round2(l.prezzoTotale - (l.imposta||0)) : null,
        imposta: l.imposta,
      }));
    }

    // Allegati
    const allegati = findChildren(body, 'Allegati').map(a => ({
      nome: text(a, 'NomeAttachment'),
      formato: text(a, 'FormatoAttachment'),
      compressione: text(a, 'AlgoritmoCompressione'),
      descrizione: text(a, 'DescrizioneAttachment'),
      data: text(a, 'Attachment'),
    }));

    // Compute totals (cross-check)
    const sumImponibile = summaries.reduce((s,x)=>s+(x.imponibile||0),0);
    const sumImposta = summaries.reduce((s,x)=>s+(x.imposta||0),0);

    documents.push({
      id: uid(),
      sourceFileName: fileName,
      isSemplificata,
      // Header
      tipoDocumento, numeroDocumento: numero, dataDocumento: data,
      divisa, totaleDocumento, causale, riferimentoOrdine: idOrdine,
      cig, cup, ddt: ddtList,
      // Parties
      cedente: sup, cessionario: cli,
      supplierName: sup.denominazione, supplierVat: sup.partitaIva, supplierFiscalCode: sup.codiceFiscale,
      customerName: cli.denominazione, customerVat: cli.partitaIva, customerFiscalCode: cli.codiceFiscale,
      // Body
      lines, summaries, payment, allegati,
      // Totals
      taxableAmountTotal: round2(sumImponibile),
      vatAmountTotal: round2(sumImposta),
      // Status
      status: 'imported',
      warnings: [],
    });
  });

  return documents;
};

/* =========================================================================
   FILE INTAKE — read XML files (and ZIPs and signed .p7m envelopes)
========================================================================= */
const readFileAsText = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsText(file, 'UTF-8');
});
const readFileAsArrayBuffer = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsArrayBuffer(file);
});

/* Encoding-aware XML reader — respects BOM and the encoding declared in <?xml ... ?>.
   Italian fiscal software (and old gestionali) often emit FatturaPA in iso-8859-1 or
   windows-1252; reading those as UTF-8 corrupts accented characters and the parser
   fails downstream. */
const readXmlFile = async (file) => {
  const buf = await readFileAsArrayBuffer(file);
  return decodeXmlBytes(new Uint8Array(buf));
};
const decodeXmlBytes = (view) => {
  // BOM detection
  if (view.length >= 3 && view[0] === 0xEF && view[1] === 0xBB && view[2] === 0xBF) {
    return new TextDecoder('utf-8', { fatal: false }).decode(view.slice(3));
  }
  if (view.length >= 2 && view[0] === 0xFF && view[1] === 0xFE) {
    return new TextDecoder('utf-16le', { fatal: false }).decode(view.slice(2));
  }
  if (view.length >= 2 && view[0] === 0xFE && view[1] === 0xFF) {
    return new TextDecoder('utf-16be', { fatal: false }).decode(view.slice(2));
  }
  // Peek at the XML declaration (latin1 keeps byte offsets and ASCII tokens readable)
  const head = new TextDecoder('latin1', { fatal: false }).decode(view.slice(0, Math.min(200, view.length)));
  const m = head.match(/<\?xml[^>]*\bencoding\s*=\s*["']([\w.:-]+)["']/i);
  let enc = 'utf-8';
  if (m) {
    const declared = m[1].toLowerCase();
    if (declared === 'utf-8' || declared === 'utf8') enc = 'utf-8';
    else if (/^iso-?8859-?1$|^latin-?1$/.test(declared)) enc = 'iso-8859-1';
    else if (/^windows-?1252$|^cp-?1252$/.test(declared)) enc = 'windows-1252';
    else enc = declared;
  }
  try {
    return new TextDecoder(enc, { fatal: false }).decode(view);
  } catch {
    return new TextDecoder('utf-8', { fatal: false }).decode(view);
  }
};

/* Companion files emitted by SDI alongside the invoice — they describe the exchange
   (sender, recipient, hash) and must NOT be parsed as invoices.
   Patterns observed: IT12345_AAAAA_metadato.xml, metadato_IT12345_AAAAA.xml */
const isMetadataFile = (name) => {
  const n = String(name||'').toLowerCase();
  return /(?:^|[_\-\/\\])metadat[oi](?:[_\-\.]|$)|metadat[oi]\.xml$/i.test(n);
};

/* Locate the FatturaPA XML inside a decoded text view. Returns [startIdx, endIdx] or null. */
const _findFatturaXmlRange = (decoded) => {
  const rootRe = /<(?:[A-Za-z][\w.-]*:)?FatturaElettronica(?:Semplificata)?[\s>]/;
  const rootMatch = decoded.match(rootRe);
  if (!rootMatch) return null;
  let startIdx = rootMatch.index;
  const xmlIdx = decoded.lastIndexOf('<?xml', startIdx);
  if (xmlIdx >= 0 && (startIdx - xmlIdx) < 200) startIdx = xmlIdx;
  const openTagEnd = decoded.indexOf('>', rootMatch.index);
  const searchFrom = openTagEnd > 0 ? openTagEnd : startIdx;
  const endRe = /<\/(?:[A-Za-z][\w.-]*:)?FatturaElettronica(?:Semplificata)?\s*>/g;
  endRe.lastIndex = searchFrom;
  const endMatch = endRe.exec(decoded);
  if (!endMatch) return null;
  return [startIdx, endMatch.index + endMatch[0].length];
};

/* Strip XML-illegal control chars (XML 1.0 forbids them outside \x09/\x0A/\x0D). */
const _xmlSanitize = (s) => s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');

/* Quick sniff: does this string look like a parseable XML (no obvious garbage in tags)?
   Returns true if it lacks suspicious non-ASCII bytes inside tag-like patterns. */
const _looksParseable = (xml) => {
  // A tag containing latin1 high bytes (0x80-0xFF) typically means leftover ASN.1 padding.
  return !/<[\w.:\-\/]*[\x80-\xFF][\w.:\-\/]*>/.test(xml);
};

/* Walk a DER ASN.1 stream, collect contents of all primitive OCTET STRINGs and
   concatenate them in source order. For chunked (constructed) OCTET STRINGs the
   children re-assemble into the original encoded content with NO ASN.1 length
   headers in between — the key reason this fallback exists. */
const _collectAsn1OctetStrings = (view) => {
  const out = []; // {start, end} byte ranges
  const readLen = (p) => {
    if (p >= view.length) return null;
    const lb = view[p];
    if (lb < 0x80) return { len: lb, lenBytes: 1 };
    if (lb === 0x80) return { len: -1, lenBytes: 1 }; // indefinite (BER)
    const n = lb & 0x7f;
    if (n > 4 || p + n >= view.length) return null;
    let v = 0;
    for (let i = 0; i < n; i++) v = (v << 8) | view[p + 1 + i];
    return { len: v, lenBytes: 1 + n };
  };
  // Find the position of the EOC marker (00 00) that closes an indefinite-length
  // element starting at content position `cs`. Skips over nested TLVs at the same
  // depth, including nested indefinite-length ones (recursion). Returns -1 on
  // truncation or malformed input.
  const findIndefiniteEnd = (cs, hardEnd) => {
    let p = cs;
    while (p < hardEnd - 1) {
      if (view[p] === 0x00 && view[p + 1] === 0x00) return p; // EOC at this depth
      if (p >= view.length) return -1;
      // Skip over a TLV
      p++; // tag consumed
      if (p >= view.length) return -1;
      const lb = view[p];
      if (lb < 0x80) {
        p += 1 + lb;          // short form
      } else if (lb === 0x80) {
        const inner = findIndefiniteEnd(p + 1, hardEnd);
        if (inner < 0) return -1;
        p = inner + 2;        // skip inner content + its EOC
      } else {
        const n = lb & 0x7f;
        if (n > 4 || p + n >= view.length) return -1;
        let len = 0;
        for (let i = 0; i < n; i++) len = (len << 8) | view[p + 1 + i];
        p += 1 + n + len;     // long form
      }
    }
    return -1;
  };
  const walk = (start, end, depth) => {
    if (depth > 30) return;
    let p = start;
    while (p < end) {
      const tag = view[p];
      if (tag === undefined) return;
      // End-of-content marker (00 00) — boundary of indefinite-length element above.
      if (tag === 0x00 && view[p + 1] === 0x00) return;
      const li = readLen(p + 1);
      if (!li) return;
      let cs = p + 1 + li.lenBytes;
      let ce;
      let advanceTo;
      if (li.len < 0) {
        // Indefinite-length BER: scan for EOC at this depth
        const eoc = findIndefiniteEnd(cs, end);
        if (eoc < 0) return;
        ce = eoc;
        advanceTo = eoc + 2; // skip past EOC
      } else {
        ce = cs + li.len;
        if (ce > end) return;
        advanceTo = ce;
      }
      if (tag === 0x04) {
        out.push({ start: cs, end: ce });
      }
      // Constructed (low-tag-bit 0x20 set, includes context-specific [n] EXPLICIT) — recurse.
      if ((tag & 0x20) !== 0) walk(cs, ce, depth + 1);
      p = advanceTo;
    }
  };
  walk(0, view.length, 0);
  return out;
};

const _extractFromAsn1 = (view) => {
  const ranges = _collectAsn1OctetStrings(view);
  if (!ranges.length) return null;
  // Concatenate all OCTET STRING contents in source order. The eContent (which holds
  // the XML, possibly across many chunks) appears before the certificate / signature
  // OCTET STRINGs that come later in the SignedData structure. The XML markers are
  // therefore guaranteed to be in the prefix; the trailing junk is harmless because
  // we slice on those markers.
  let total = 0;
  for (const r of ranges) total += (r.end - r.start);
  const buf = new Uint8Array(total);
  let off = 0;
  for (const r of ranges) {
    buf.set(view.subarray(r.start, r.end), off);
    off += (r.end - r.start);
  }
  const text = new TextDecoder('latin1').decode(buf);
  const range = _findFatturaXmlRange(text);
  if (!range) return null;
  return _xmlSanitize(new TextDecoder('utf-8', { fatal: false }).decode(buf.slice(range[0], range[1])));
};

/* Extract the encapsulated XML invoice from a CAdES-BES PKCS#7 envelope (.p7m).
   Strategy (in order):
     1. ASN.1 walker — correct path for every well-formed CMS file: handles both
        primitive OCTET STRING (single chunk) AND constructed OCTET STRING (XML
        split across chunks). Re-assembles chunks contiguously so no ASN.1 length
        bytes pollute the result.
     2. Byte-scan in latin1 — fallback for malformed files, plain XML mistakenly
        named .p7m, or formats the walker can't traverse (BER indefinite length).
     3. UTF-16 LE/BE byte-scan — rare tools that produce UTF-16 payloads. */
const extractXmlFromP7mBuffer = (arrayBuffer) => {
  let view = new Uint8Array(arrayBuffer);

  // PEM detection
  let p = 0;
  while (p < view.length && (view[p] === 0x20 || view[p] === 0x09 || view[p] === 0x0A || view[p] === 0x0D)) p++;
  if (view[p] === 0x2D) {
    const head = new TextDecoder('latin1').decode(view.slice(p, Math.min(p + 30, view.length)));
    if (head.startsWith('-----BEGIN')) {
      const text = new TextDecoder('latin1').decode(view);
      const m = text.match(/-----BEGIN[^-\n]*-----([\s\S]+?)-----END/);
      if (!m) throw new Error('Envelope PEM senza body Base64');
      const b64 = m[1].replace(/[^A-Za-z0-9+/=]/g, '');
      try {
        const decoded = atob(b64);
        const bytes = new Uint8Array(decoded.length);
        for (let k = 0; k < decoded.length; k++) bytes[k] = decoded.charCodeAt(k);
        view = bytes;
      } catch (e) {
        throw new Error('Envelope PEM con Base64 corrotto');
      }
    }
  }

  // 1) ASN.1 walker — preferred path for any structured CMS envelope
  const asn1 = _extractFromAsn1(view);
  if (asn1) return asn1;

  // 2) Byte-scan latin1 — catches plain XML files mislabelled as .p7m or
  //    structures the walker can't traverse (e.g. BER indefinite length)
  const ascii = new TextDecoder('latin1').decode(view);
  const range = _findFatturaXmlRange(ascii);
  if (range) {
    return _xmlSanitize(new TextDecoder('utf-8', { fatal: false }).decode(view.slice(range[0], range[1])));
  }

  // 3) UTF-16 LE / BE byte-scan
  if (view.length >= 4) {
    try {
      const utf16 = new TextDecoder('utf-16le', { fatal: false }).decode(view);
      const r2 = _findFatturaXmlRange(utf16);
      if (r2) return _xmlSanitize(utf16.substring(r2[0], r2[1]));
    } catch {}
    try {
      const utf16be = new TextDecoder('utf-16be', { fatal: false }).decode(view);
      const r3 = _findFatturaXmlRange(utf16be);
      if (r3) return _xmlSanitize(utf16be.substring(r3[0], r3[1]));
    } catch {}
  }

  // Build a diagnostic message so the user can tell us what kind of envelope this is
  const ranges = _collectAsn1OctetStrings(view);
  const head = Array.from(view.slice(0, 16)).map(b => b.toString(16).padStart(2,'0')).join(' ');
  throw new Error(`Nessun XML FatturaPA trovato nell'envelope p7m (firma scollegata, BER indefinito o formato non supportato) — size: ${view.length}b, OCTET STRINGs trovate: ${ranges.length}, primi byte: ${head}`);
};

const processFiles = async (fileList, onProgress) => {
  const results = []; // {fileName, status, message, documents?}
  const xmlFiles = [];

  for (const f of Array.from(fileList)) {
    const lower = f.name.toLowerCase();
    if (isMetadataFile(f.name)) {
      results.push({ fileName: f.name, status: 'skipped', message: 'Metadato SDI (saltato)' });
    } else if (lower.endsWith('.xml.p7m') || lower.endsWith('.p7m')) {
      xmlFiles.push({ name: f.name, file: f, kind: 'p7m' });
    } else if (lower.endsWith('.xml')) {
      xmlFiles.push({ name: f.name, file: f, kind: 'xml' });
    } else if (lower.endsWith('.zip')) {
      try {
        const zip = await JSZip.loadAsync(f);
        for (const entry of Object.values(zip.files)) {
          if (entry.dir) continue;
          const baseName = entry.name.split('/').pop();
          if (isMetadataFile(baseName)) {
            results.push({ fileName: baseName, status: 'skipped', message: 'Metadato SDI (saltato)' });
            continue;
          }
          const en = baseName.toLowerCase();
          if (en.endsWith('.xml.p7m') || en.endsWith('.p7m')) {
            const buf = await entry.async('arraybuffer');
            xmlFiles.push({ name: baseName, buffer: buf, kind: 'p7m' });
          } else if (en.endsWith('.xml')) {
            // Read as bytes so we can respect the declared encoding (iso-8859-1, etc.)
            const ab = await entry.async('arraybuffer');
            xmlFiles.push({ name: baseName, text: decodeXmlBytes(new Uint8Array(ab)), kind: 'xml' });
          }
        }
      } catch (e) {
        results.push({ fileName: f.name, status: 'error', message: 'ZIP non leggibile' });
      }
    } else {
      results.push({ fileName: f.name, status: 'skipped', message: 'Estensione non supportata' });
    }
  }

  for (let i = 0; i < xmlFiles.length; i++) {
    const xf = xmlFiles[i];
    onProgress && onProgress(i+1, xmlFiles.length, xf.name);
    try {
      let xmlText;
      if (xf.kind === 'p7m') {
        const buf = xf.buffer || await readFileAsArrayBuffer(xf.file);
        xmlText = extractXmlFromP7mBuffer(buf);
      } else {
        // Encoding-aware read: respect BOM and the declared <?xml ... encoding="..."?>.
        // FatturaPA from older Italian gestionali is often iso-8859-1 / windows-1252.
        const txt = xf.text != null ? xf.text : await readXmlFile(xf.file);
        const clean = txt.replace(/^\uFEFF/, '');
        const i1 = clean.indexOf('<');
        const i2 = clean.lastIndexOf('>');
        xmlText = (i1 >= 0 && i2 > i1) ? clean.substring(i1, i2+1) : clean;
      }
      const docs = parseFatturaXml(xmlText, xf.name);
      results.push({ fileName: xf.name, status: 'ok', documents: docs });
    } catch (e) {
      results.push({ fileName: xf.name, status: 'error', message: e.message });
    }
  }
  return results;
};

    mapping: null,
    fileName: null,
    // summary format (aggregated by period/sezionale/codice IVA)
    summaryRows: [],    // [{ id, sourceFileId, sourceFileName, periodo, sezione, descSezione, tipoReg, aliqIvaCode, aliqIvaDesc, tipologiaIva, tipologiaIvaDesc, imponibile, imposta, indetraibile }]
    codeMap: { ...DEFAULT_VAT_CODE_MAP }, // editable mapping codice IVA → {aliquota, natura, ...}
  });
  const [reconResults, setReconResults] = useState([]); // per-document: matchStatus, register row id, diffs
  const [errorReport, setErrorReport] = useState([]); // ErrorReportItem[]
  const [tolerance, setTolerance] = useState(0.02); // € rounding tolerance
  const [pdfTarget, setPdfTarget] = useState(null);
  const [showResetMenu, setShowResetMenu] = useState(false);
  const [adeRows, setAdeRows] = useState([]); // AdE invoice list (CSV)
  const [adeFileName, setAdeFileName] = useState(null);

  const adeIndex = useMemo(() => buildAdeIndex(adeRows), [adeRows]);
  const decoratedInvoices = useMemo(() => {
    if (!adeRows.length) return invoices;
    return invoices.map(inv => {
      const m = findAdeMatch(inv, adeIndex);
      return m ? {
        ...inv,
        dataRicezione: m.dataRicezione,
        dataTrasmissione: m.dataTrasmissione,
        sdiFileId: m.sdiFileId,
        bolloVirtuale: m.bolloVirtuale,
        consegnata: m.consegnata,
        adeMatched: true,
      } : { ...inv, adeMatched: false };
    });
  }, [invoices, adeRows, adeIndex]);
  const adeMatchedCount = useMemo(() => decoratedInvoices.filter(i => i.adeMatched).length, [decoratedInvoices]);

  // ---- Persistence to IndexedDB ---------------------------------------------
  // `hydrated` becomes true once we've finished reading from IDB. Until then we
  // skip writes, otherwise the empty initial state would overwrite stored data.
  const [hydrated, setHydrated] = useState(false);
  const [hydratingMessage, setHydratingMessage] = useState('Apertura archivio locale…');

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [savedInvoices, savedAde, savedAdeName, savedRegister] = await Promise.all([
          idbGet('invoices'),
          idbGet('adeRows'),
          idbGet('adeFileName'),
          idbGet('vatRegister'),
        ]);
        if (cancelled) return;
        if (Array.isArray(savedInvoices) && savedInvoices.length) setInvoices(savedInvoices);
        if (Array.isArray(savedAde) && savedAde.length) setAdeRows(savedAde);
        if (typeof savedAdeName === 'string' && savedAdeName) setAdeFileName(savedAdeName);
        if (savedRegister && typeof savedRegister === 'object') {
          // Merge with default codeMap so newly added codes still appear after upgrades
          setVatRegister(prev => ({ ...prev, ...savedRegister, codeMap: { ...DEFAULT_VAT_CODE_MAP, ...(savedRegister.codeMap || {}) } }));
        }
      } catch (e) {
        console.warn('Hydration failed:', e);
      } finally {
        if (!cancelled) setHydrated(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Debounced writes — coalesce rapid state changes into one IDB write per ~400ms.
  useEffect(() => {
    if (!hydrated) return;
    const t = setTimeout(() => idbSet('invoices', invoices), 400);
    return () => clearTimeout(t);
  }, [invoices, hydrated]);
  useEffect(() => {
    if (!hydrated) return;
    const t = setTimeout(() => idbSet('adeRows', adeRows), 400);
    return () => clearTimeout(t);
  }, [adeRows, hydrated]);
  useEffect(() => {
    if (!hydrated) return;
    const t = setTimeout(() => idbSet('adeFileName', adeFileName || ''), 400);
    return () => clearTimeout(t);
  }, [adeFileName, hydrated]);
  useEffect(() => {
    if (!hydrated) return;
    const t = setTimeout(() => idbSet('vatRegister', vatRegister), 400);
    return () => clearTimeout(t);
  }, [vatRegister, hydrated]);
  // ----------------------------------------------------------------------------

  const [sidebarWidth, setSidebarWidth] = useState(() => {
    const v = parseInt(localStorage.getItem('vx_sidebarWidth') || '');
    return Number.isFinite(v) && v >= 56 ? Math.min(v, 480) : 288;
  });
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => localStorage.getItem('vx_sidebarCollapsed') === '1');
  useEffect(() => { localStorage.setItem('vx_sidebarWidth', String(sidebarWidth)); }, [sidebarWidth]);
  useEffect(() => { localStorage.setItem('vx_sidebarCollapsed', sidebarCollapsed ? '1' : '0'); }, [sidebarCollapsed]);

  const sidebarResizing = useRef(false);
  const startSidebarResize = (e) => {
    e.preventDefault();
    sidebarResizing.current = true;
    const target = e.currentTarget;
    target.classList.add('dragging');
    let lastW = sidebarWidth;
    const onMove = (ev) => {
      if (!sidebarResizing.current) return;
      const w = Math.max(56, Math.min(480, ev.clientX));
      lastW = w;
      setSidebarWidth(w);
    };
    const onUp = () => {
      sidebarResizing.current = false;
      target.classList.remove('dragging');
      // Auto-collapse if user dragged it very narrow; auto-expand otherwise
      if (lastW < 110) setSidebarCollapsed(true);
      else setSidebarCollapsed(false);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const allLines = useMemo(() => {
    const out = [];
    decoratedInvoices.forEach(inv => {
      inv.lines.forEach(line => {
        // For each line, attach the corresponding summary (by rate+nature)
        const matchSummaries = inv.summaries.length
          ? inv.summaries.filter(s =>
              (s.aliquotaIVA||0) === (line.aliquotaIVA||0) &&
              (s.natura||'') === (line.natura||''))
          : [];
        const summary = matchSummaries[0] || (inv.summaries[0] || {});
        out.push({
          invoice: inv,
          line,
          summary,
          // flatten convenient fields
          documentId: inv.id,
          sourceFileName: inv.sourceFileName,
          tipoDocumento: inv.tipoDocumento,
          numeroDocumento: inv.numeroDocumento,
          dataDocumento: inv.dataDocumento,
          supplierName: inv.supplierName,
          supplierVat: inv.supplierVat,
          customerName: inv.customerName,
          customerVat: inv.customerVat,
          numeroLinea: line.numeroLinea,
          descrizione: line.descrizione,
          quantita: line.quantita,
          unitaMisura: line.unitaMisura,
          prezzoUnitario: line.prezzoUnitario,
          prezzoTotale: line.prezzoTotale,
          aliquotaIVA: line.aliquotaIVA,
          natura: line.natura,
          riferimentoAmministrazione: line.riferimentoAmministrazione,
          imponibileRiep: summary.imponibile,
          impostaRiep: summary.imposta,
          aliquotaIVARiep: summary.aliquotaIVA,
          naturaRiep: summary.natura,
          riferimentoNormativo: summary.riferimentoNormativo,
          totaleDocumento: inv.totaleDocumento,
          // AdE-decorated fields (present only if CSV loaded and matched)
          dataRicezione: inv.dataRicezione,
          dataTrasmissione: inv.dataTrasmissione,
          sdiFileId: inv.sdiFileId,
          bolloVirtuale: inv.bolloVirtuale,
          adeMatched: inv.adeMatched,
        });
      });
      // Edge case: invoices with no lines — still produce one row per summary
      if (inv.lines.length === 0) {
        inv.summaries.forEach(summary => {
          out.push({
            invoice: inv, line: {}, summary,
            documentId: inv.id, sourceFileName: inv.sourceFileName,
            tipoDocumento: inv.tipoDocumento, numeroDocumento: inv.numeroDocumento,
            dataDocumento: inv.dataDocumento,
            supplierName: inv.supplierName, supplierVat: inv.supplierVat,
            customerName: inv.customerName, customerVat: inv.customerVat,
            aliquotaIVARiep: summary.aliquotaIVA,
            naturaRiep: summary.natura,
            imponibileRiep: summary.imponibile,
            impostaRiep: summary.imposta,
            riferimentoNormativo: summary.riferimentoNormativo,
            dataRicezione: inv.dataRicezione,
            dataTrasmissione: inv.dataTrasmissione,
            sdiFileId: inv.sdiFileId,
            bolloVirtuale: inv.bolloVirtuale,
            adeMatched: inv.adeMatched,
            totaleDocumento: inv.totaleDocumento,
          });
        });
      }
    });
    return out;
  }, [decoratedInvoices]);

  const addInvoices = (docs, fileNames) => {
    setInvoices(prev => {
      // dedup by sourceFileName + numero + data + supplierVat
      const existing = new Set(prev.map(x => `${x.sourceFileName}|${x.numeroDocumento}|${x.dataDocumento}|${x.supplierVat}`));
      const fresh = docs.filter(d => !existing.has(`${d.sourceFileName}|${d.numeroDocumento}|${d.dataDocumento}|${d.supplierVat}`));
      return [...prev, ...fresh];
    });
  };

  const removeInvoice = (id) => {
    setInvoices(prev => prev.filter(x => x.id !== id));
    setReconResults(prev => prev.filter(x => x.invoiceId !== id));
  };

  const clearAll = () => {
    if (!confirm('Eliminare TUTTO: fatture, registro IVA, lista AdE, riconciliazioni, errori?')) return;
    setInvoices([]); setReconResults([]); setErrorReport([]);
    setVatRegister({ files:[], rows: [], mapping: null, fileName: null, summaryRows: [], codeMap: { ...DEFAULT_VAT_CODE_MAP } });
    setAdeRows([]); setAdeFileName(null);
    // Wipe IDB immediately too, in case the user reloads before the debounced writes fire
    idbClear();
  };
  const clearInvoices = () => {
    if (!confirm(`Eliminare le ${invoices.length} fatture caricate? (registro e mapping vengono mantenuti)`)) return;
    setInvoices([]); setReconResults([]); setErrorReport([]);
  };
  const clearRegister = () => {
    const totalRows = vatRegister.rows.length + vatRegister.summaryRows.length;
    if (!confirm(`Eliminare il registro IVA importato (${totalRows} righe da ${vatRegister.files.length} file)? La mappa codici IVA viene mantenuta.`)) return;
    setVatRegister(p => ({ files:[], rows: [], mapping: null, fileName: null, summaryRows: [], codeMap: p.codeMap }));
    setReconResults([]); setErrorReport([]);
  };
  const clearRecon = () => {
    if (!reconResults.length && !errorReport.length) return;
    if (!confirm('Eliminare risultati riconciliazione e report errori?')) return;
    setReconResults([]); setErrorReport([]);
  };

  return (
    <div className="flex h-full">
      {/* SIDEBAR */}
      <aside className={`flex-shrink-0 border-r flex flex-col relative ${sidebarCollapsed ? 'sidebar-collapsed' : ''}`}
             style={{ borderColor:'var(--line)', background:'var(--bg-elev)', width: sidebarCollapsed ? 64 : sidebarWidth, transition: sidebarResizing.current ? 'none' : 'width 0.15s' }}>
        <div className={`${sidebarCollapsed ? 'px-2 py-4' : 'p-6'} border-b flex items-center justify-between gap-2`} style={{ borderColor:'var(--line)' }}>
          {!sidebarCollapsed && (
            <div className="sidebar-text">
              <div className="flex items-baseline gap-2">
                <span className="text-2xl font-serif font-semibold" style={{ color:'var(--ink)' }}>Riconciliazione</span>
              </div>
              <div className="text-xs mt-1" style={{ color:'var(--ink-3)' }}>
                <span className="small-cap">Fattura elettronica · Registro IVA</span>
              </div>
            </div>
          )}
          <button className="btn btn-ghost" style={{padding:'4px 6px'}} title={sidebarCollapsed ? 'Espandi barra' : 'Riduci barra'}
                  onClick={()=>{ const next = !sidebarCollapsed; setSidebarCollapsed(next); if (!next && sidebarWidth < 160) setSidebarWidth(288); }}>
            <Icon name={sidebarCollapsed ? 'chevright' : 'chevdown'} size={14} className={sidebarCollapsed ? '' : 'rotate-90'}/>
          </button>
        </div>
        <nav className="flex-1 p-3 space-y-1 overflow-auto">
          {SECTIONS.map(s => {
            let count = null;
            if (s.id === 'analitico') count = allLines.length || null;
            if (s.id === 'documenti') count = invoices.length || null;
            if (s.id === 'registri')  count = (vatRegister.rows.length + vatRegister.summaryRows.length) || null;
            if (s.id === 'errori')    count = errorReport.length || null;
            return (
              <div key={s.id} onClick={()=>setSection(s.id)}
                   title={sidebarCollapsed ? s.label : undefined}
                   className={`nav-item ${section===s.id ? 'active':''}`}>
                <Icon name={s.icon} size={15} />
                <span>{s.label}</span>
                {count !== null && <span className="nav-count">{count}</span>}
              </div>
            );
          })}
        </nav>
        <div className={`${sidebarCollapsed ? 'p-2' : 'p-4'} border-t relative`} style={{ borderColor:'var(--line)' }}>
          <div className={`flex items-center ${sidebarCollapsed ? 'justify-center' : 'justify-between'} text-xs`} style={{ color:'var(--ink-3)' }}>
            {!sidebarCollapsed && <span className="small-cap sidebar-text">Sessione locale</span>}
            <button className="btn btn-ghost" style={{padding:'4px 8px'}} onClick={()=>setShowResetMenu(s=>!s)} title={sidebarCollapsed ? 'Pulisci' : undefined}>
              <Icon name="trash" size={13}/>
              {!sidebarCollapsed && <><span className="sidebar-text">Pulisci</span><Icon name="chevdown" size={10}/></>}
            </button>
          </div>
          {showResetMenu && (
            <div className="absolute bottom-full left-3 right-3 mb-1 rounded-lg p-2 z-10 shadow-lg"
                 style={{background:'var(--bg-elev)', border:'1px solid var(--line)'}}>
              <div className="text-[10px] uppercase tracking-wider mb-2 px-2" style={{color:'var(--gold)'}}>Pulizia rapida</div>
              <button className="w-full text-left text-xs px-2 py-1.5 rounded hover:bg-black/5 flex items-center justify-between"
                      onClick={()=>{ clearInvoices(); setShowResetMenu(false); }}
                      disabled={!invoices.length}>
                <span>Solo fatture XML</span>
                <span className="font-mono opacity-60">{invoices.length}</span>
              </button>
              <button className="w-full text-left text-xs px-2 py-1.5 rounded hover:bg-black/5 flex items-center justify-between"
                      onClick={()=>{ clearRegister(); setShowResetMenu(false); }}
                      disabled={!vatRegister.rows.length && !vatRegister.summaryRows.length}>
                <span>Solo registro IVA</span>
                <span className="font-mono opacity-60">{vatRegister.rows.length + vatRegister.summaryRows.length}</span>
              </button>
              <button className="w-full text-left text-xs px-2 py-1.5 rounded hover:bg-black/5 flex items-center justify-between"
                      onClick={()=>{ clearRecon(); setShowResetMenu(false); }}
                      disabled={!reconResults.length && !errorReport.length}>
                <span>Solo riconciliazioni + errori</span>
                <span className="font-mono opacity-60">{reconResults.length}</span>
              </button>
              <div className="border-t my-1" style={{borderColor:'var(--line)'}}></div>
              <button className="w-full text-left text-xs px-2 py-1.5 rounded flex items-center justify-between"
                      style={{color:'var(--err)'}}
                      onClick={()=>{ clearAll(); setShowResetMenu(false); }}>
                <span><Icon name="alert" size={11}/> Tutto (reset totale)</span>
              </button>
            </div>
          )}
          {!sidebarCollapsed && (
            <div className="mt-3 text-[11px] leading-relaxed sidebar-text" style={{ color:'var(--ink-3)' }}>
              I dati vengono salvati nel browser (IndexedDB) e ricaricati alla prossima apertura. Nessun upload verso server.
            </div>
          )}
        </div>
        <div className="sidebar-resizer" onMouseDown={startSidebarResize} title="Trascina per ridimensionare"></div>
      </aside>

      {/* MAIN */}
      <main className="flex-1 overflow-auto">
        {section === 'dashboard' && (
          <Dashboard invoices={invoices} allLines={allLines} vatRegister={vatRegister}
                     reconResults={reconResults} errorReport={errorReport}
                     onNav={setSection} />
        )}
        {section === 'upload' && (
          <UploadSection invoices={invoices} addInvoices={addInvoices} removeInvoice={removeInvoice}
                         setPdfTarget={(d)=>{ setPdfTarget(d); setSection('pdf'); }}
                         adeRows={adeRows} setAdeRows={setAdeRows}
                         adeFileName={adeFileName} setAdeFileName={setAdeFileName}
                         adeMatchedCount={adeMatchedCount}/>
        )}
        {section === 'analitico' && (
          <AnaliticoSection allLines={allLines} invoices={decoratedInvoices} adeLoaded={adeRows.length > 0}
                            setPdfTarget={(d)=>{ setPdfTarget(d); setSection('pdf'); }}/>
        )}
        {section === 'documenti' && (
          <DocumentiSection invoices={decoratedInvoices} adeLoaded={adeRows.length > 0}
                            setPdfTarget={(d)=>{ setPdfTarget(d); setSection('pdf'); }}/>
        )}
        {section === 'registri' && (
          <RegistriSection vatRegister={vatRegister} setVatRegister={setVatRegister}/>
        )}
        {section === 'controlli' && (
          <ControlliSection invoices={invoices} vatRegister={vatRegister}
                            tolerance={tolerance} setTolerance={setTolerance}
                            reconResults={reconResults} setReconResults={setReconResults}
                            setErrorReport={setErrorReport}
                            setPdfTarget={(d)=>{ setPdfTarget(d); setSection('pdf'); }}/>
        )}
        {section === 'errori' && (
          <ErroriSection errorReport={errorReport} setErrorReport={setErrorReport}/>
        )}
        {section === 'pdf' && (
          <PdfSection invoices={invoices} target={pdfTarget} setTarget={setPdfTarget}/>
        )}
      </main>
    </div>
  );
};

/* =========================================================================
   DASHBOARD
========================================================================= */
const Dashboard = ({ invoices, allLines, vatRegister, reconResults, errorReport, onNav }) => {
  const stats = useMemo(() => {
    const totImponibile = invoices.reduce((s,x) => s + (x.taxableAmountTotal||0), 0);
    const totImposta = invoices.reduce((s,x) => s + (x.vatAmountTotal||0), 0);
    const totDocumenti = invoices.reduce((s,x) => s + (x.totaleDocumento||0), 0);
    const errCount = errorReport.filter(e => e.severity === 'error').length;
    const warnCount = errorReport.filter(e => e.severity === 'warning').length;
    const todoCount = errorReport.filter(e => e.severity === 'review').length;

    // Top suppliers
    const supMap = {};
    invoices.forEach(inv => {
      const k = inv.supplierName || '—';
      if (!supMap[k]) supMap[k] = { name:k, count:0, total:0, imponibile:0, imposta:0 };
      supMap[k].count++;
      supMap[k].total += inv.totaleDocumento||0;
      supMap[k].imponibile += inv.taxableAmountTotal||0;
      supMap[k].imposta += inv.vatAmountTotal||0;
    });
    const topSuppliers = Object.values(supMap).sort((a,b) => b.total - a.total).slice(0,5);

    // Aliquote distribution
    const rateMap = {};
    allLines.forEach(r => {
      const k = r.aliquotaIVARiep != null ? `${r.aliquotaIVARiep}%` : (r.naturaRiep || 'N/D');
      rateMap[k] = (rateMap[k]||0) + (r.imponibileRiep||0);
    });
    const aliquote = Object.entries(rateMap).map(([k,v]) => ({k,v})).sort((a,b)=>b.v-a.v);

    return { totImponibile, totImposta, totDocumenti, errCount, warnCount, todoCount, topSuppliers, aliquote };
  }, [invoices, allLines, errorReport]);

  return (
    <div className="px-10 py-8 max-w-[1400px]">
      <div className="flex items-baseline justify-between mb-2">
        <h1 className="text-4xl font-serif font-medium tracking-tight">Quadro generale</h1>
        <div className="text-sm" style={{ color:'var(--ink-3)' }}>
          {new Date().toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}
        </div>
      </div>
      <p className="text-sm mb-8" style={{ color:'var(--ink-3)' }}>
        Sintesi delle fatture importate, dei registri IVA caricati e dello stato dei controlli di riconciliazione.
      </p>

      {invoices.length === 0 && (
        <div className="card p-12 text-center mb-8 grid-paper">
          <div className="inline-block stamp px-6 py-2 mb-4 text-xs font-bold">NESSUN DOCUMENTO</div>
          <h2 className="font-serif text-2xl mb-2">Inizia caricando le tue fatture</h2>
          <p className="text-sm mb-6" style={{ color:'var(--ink-3)' }}>
            Trascina file XML, cartelle o archivi ZIP per importare le fatture elettroniche.
          </p>
          <button className="btn btn-primary" onClick={()=>onNav('upload')}>
            <Icon name="upload" size={14}/> Carica file XML
          </button>
        </div>
      )}

      {invoices.length > 0 && (
        <Fragment>
          <div className="grid grid-cols-4 gap-4 mb-8">
            <KPI label="Fatture importate" value={invoices.length} sub={`${allLines.length} righe analitiche`} />
            <KPI label="Imponibile totale" value={fmtMoney(stats.totImponibile)} sub="Somma riepiloghi IVA" />
            <KPI label="IVA totale" value={fmtMoney(stats.totImposta)} sub="Somma imposte" accent />
            <KPI label="Totale documenti" value={fmtMoney(stats.totDocumenti)} sub="Importo totale fatture" />
          </div>

          <div className="grid grid-cols-3 gap-4 mb-8">
            <KPI label="Errori controllo" value={stats.errCount} sub="Anomalie certe" cls="err" />
            <KPI label="Warning" value={stats.warnCount} sub="Da verificare" cls="warn" />
            <KPI label="Da chiarire" value={stats.todoCount} sub="Casi in revisione manuale" cls="ok" />
          </div>

          <div className="grid grid-cols-2 gap-4 mb-8">
            <div className="card p-6">
              <div className="flex items-baseline justify-between mb-4">
                <h3 className="font-serif text-lg">Principali fornitori / clienti</h3>
                <span className="label">Per importo</span>
              </div>
              {stats.topSuppliers.length === 0 && <div className="text-sm" style={{ color:'var(--ink-3)' }}>Nessun dato</div>}
              <table className="data-table">
                <thead>
                  <tr><th>Soggetto</th><th>Documenti</th><th>Imponibile</th><th>Totale</th></tr>
                </thead>
                <tbody>
                  {stats.topSuppliers.map((s,i) => (
                    <tr key={i} className="hover-row">
                      <td className="truncate max-w-[280px]">{s.name}</td>
                      <td className="num">{s.count}</td>
                      <td className="num">{fmtMoney(s.imponibile)}</td>
                      <td className="num font-semibold">{fmtMoney(s.total)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="card p-6">
              <div className="flex items-baseline justify-between mb-4">
                <h3 className="font-serif text-lg">Distribuzione per aliquota / natura</h3>
                <span className="label">Imponibile</span>
              </div>
              {stats.aliquote.length === 0 && <div className="text-sm" style={{ color:'var(--ink-3)' }}>Nessun dato</div>}
              <div className="space-y-3">
                {stats.aliquote.map((a,i) => {
                  const max = Math.max(...stats.aliquote.map(x=>x.v));
                  const pct = max > 0 ? (a.v/max)*100 : 0;
                  return (
                    <div key={i}>
                      <div className="flex justify-between text-sm">
                        <span className="font-mono">{a.k}</span>
                        <span className="num">{fmtMoney(a.v)}</span>
                      </div>
                      <div className="h-1 mt-1 rounded-full" style={{ background:'var(--bg-deep)' }}>
                        <div className="h-1 rounded-full" style={{ width:`${pct}%`, background:'var(--accent)' }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="card p-6 ribbon">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div>
                <h3 className="font-serif text-lg">Stato registro IVA</h3>
                <p className="text-sm" style={{ color:'var(--ink-3)' }}>
                  {(vatRegister.rows.length + vatRegister.summaryRows.length) > 0 ? (
                    <span>
                      <span className="font-mono">{vatRegister.files.length}</span> file caricati ·

  const onAdeFile = async (file) => {
    if (!file) return;

    try {
      const text = await file.text();
      const rows = parseAdeCsv(text);
      if (!rows.length) { setAdeError('CSV vuoto o formato non riconosciuto'); return; }
      setAdeRows(rows);
      setAdeFileName(file.name);
    } catch (e) {
      setAdeError(`Errore lettura CSV: ${e.message}`);

  const onFiles = async (fileList) => {
    setProgress({ current:0, total:fileList.length, file:'preparazione...' });

/* IndexedDB persistence layer for the heavy session data
   (invoices, AdE list, VAT register). Falls back to no-op if unavailable. */
const IDB_NAME = 'visualizzaft_v1';
const IDB_STORE = 'kv';
const idbOpen = () => new Promise((resolve, reject) => {
  if (typeof indexedDB === 'undefined') { reject(new Error('IndexedDB non disponibile')); return; }
  const req = indexedDB.open(IDB_NAME, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const idbGet = async (key) => {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch { return undefined; }
};
const idbSet = async (key, value) => {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { console.warn('idbSet failed for', key, e); }
};
const idbDel = async (key) => {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {}
};
const idbClear = async () => {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {}
};
